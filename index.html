/* Buttons */
.btn {
  background: var(--primary);

  border: 1px solid transparent;
  border-radius: 8px;
  font-family: inherit;
  font-weight: 700;
  transition: var(--transition-theme);
}

.btn.gold {
  background: var(--warning);
  color: var(--text-primary);
}

.btn.light {
  background: var(--bg-subtle);
  color: var(--text-primary);
  border-color: var(--border-color);
}

.btn.green {
  background: var(--success);
  color: var(--bg-surface);
}

.btn.danger {
  background: var(--danger);
  color: var(--bg-surface);
}

.btn:not(:disabled):hover,
.tabs button:not(:disabled):hover{
  transform:translateY(-2px);
  box-shadow:0 5px 14px #00000020;
}

/* Navigation and tabs */
.tabs button{
  background:var(--bg-surface);
  color:var(--text-primary);
  border:1px solid var(--border-color);
  border-radius:12px;
  padding:9px 14px;
}

.tabs button.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.top .nav button{
  background:transparent;
  color:#fff;
  border:1px solid #ffffff55;
  border-radius:12px;
}

.top .nav button.active{
  background:var(--accent);
  color:var(--text-primary);
  border-color:var(--accent);
}

/* Status labels */
.tag{
  background:var(--bg-main);
  color:var(--text-primary);
  border:1px solid var(--border-color);
}

.tag.ok{
  background:var(--success);
  color:#fff;
}

.tag.wait{
  background:var(--accent);
  color:var(--text-primary);
}

.tag.bad{
  background:var(--danger);
  color:#fff;
}

/* Notices */
.notice{
  background:var(--bg-main);
  color:var(--text-primary);
  border:1px solid var(--border-color);
}

.notice.success{
  background:var(--success);
  color:#fff;
}

.notice.error{
  background:var(--danger);
  color:#fff;
}

/* Disabled and focus states */
.btn:disabled,
input:disabled,
select:disabled,
textarea:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.btn:focus-visible,
.tabs button:focus-visible,
.top .nav button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

.auth{
  width:min(100%,480px);
  margin:28px auto;
}

.modal{
  box-shadow:0 18px 55px #00000030;
}

@media(max-width:600px){

  .item,

  }

  ?db.from("service_requests").select("*,services(name_ar),provider_profiles(display_name,city)").eq("customer_id",u.id).order("created_at",{ascending:false})

  reqQ,
  wcChatsQuery(),
  isC?Promise.resolve(null):db.from("provider_services").select("*,services(name_ar,category_id)").eq("provider_id",pp.id),
  isC?db.from("reviews").select("request_id").eq("customer_id",u.id).then(x=>x,()=>null):Promise.resolve(null),
  quoteQ,
  isC?Promise.resolve(null):db.from("provider_profiles").select("*").eq("user_id",u.id).maybeSingle(),
  loadPayments(),
  isC?Promise.resolve(null):db.from("provider_change_requests").select("*").eq("user_id",u.id).order("created_at",{ascending:false}).limit(60).then(x=>x,()=>null)
 ]);
 if(qr.error)throw qr.error;
 s.requests=r.data||[];s.chats=ch.data||[];
 if(!isC){s.myReqs=(myr&&myr.data)||[];s.offers=(o&&o.data)||[];if(provRow&&provRow.data){s.provider=provRow.data}}
 if(isC){s.reviewedIds=new Set(((rv&&rv.data)||[]).map(x=>x.request_id))}
 s.quotes=qr.data||[];
 if(s.quotes.length){
  const ids=s.quotes.map(x=>x.id);
  const [vr,er]=await Promise.all([
   db.from("service_quote_versions").select("*").in("quote_id",ids),
   isC?Promise.resolve({data:[]}):db.from("service_quote_events").select("quote_id,event_type,note,created_at").in("quote_id",ids).eq("event_type","customer_revision_requested").order("created_at",{ascending:false})

  });
 }

 function waslaSplashFit(){
  const root=document.querySelector(".wasla-welcome.wl3");if(!root)return;
  const m=root.querySelector(".wl3-mark"),row=root.querySelector(".wl3-row"),sl=root.querySelector(".wl3-slot");if(!m||!row||!sl)return;
  const rr=row.getBoundingClientRect(),q=sl.getBoundingClientRect(),R=root.getBoundingClientRect();
  const w=m.offsetWidth;if(!w)return;
  const cx=rr.left+m.offsetLeft+w/2,cy=rr.top+m.offsetTop+m.offsetHeight/2;
  m.style.setProperty("--dx1",(R.left+R.width/2-cx)+"px");m.style.setProperty("--dy1",(R.top+R.height/2-cy)+"px");
  m.style.setProperty("--s1",String(Math.min(R.width*.84,340)/w));
  m.style.setProperty("--dx2",(q.left+q.width/2-cx)+"px");m.style.setProperty("--dy2",(q.top+q.height/2-cy)+"px");
  m.style.setProperty("--s2",String(q.width/w));
 }
 (function(){let t=0;const go=()=>{clearTimeout(t);t=setTimeout(waslaSplashFit,0)};

var reqRt={chan:null,uid:null,timer:null,busy:false};
function reqRtUnsub(){try{if(reqRt.chan)db.removeChannel(reqRt.chan)}catch(_){}reqRt.chan=null;reqRt.uid=null;clearTimeout(reqRt.timer)}
function reqRtKick(){
 clearTimeout(reqRt.timer);
 reqRt.timer=setTimeout(async function go(){
  if(!s.user||!reqRt.chan)return;
  const ae=document.activeElement;
  if(reqRt.busy||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&(ae.value||"").length>0)){reqRt.timer=setTimeout(go,2500);return}
  reqRt.busy=true;
  try{await refreshRoleData()}catch(_){}
  reqRt.busy=false;
 },700);
}
function reqRtSubscribe(uid){
 if(!uid||(reqRt.chan&&reqRt.uid===uid))return;
 reqRtUnsub();
 try{
  reqRt.uid=uid;
  reqRt.chan=db.channel("wasla-requests-"+uid)
   .on("postgres_changes",{event:"*",schema:"public",table:"service_requests"},()=>reqRtKick())
   .on("postgres_changes",{event:"*",schema:"public",table:"service_quotes"},()=>reqRtKick())
   .subscribe();
 }catch(_){reqRt.chan=null;reqRt.uid=null}
}
var payRt={chan:null,uid:null};
function payRtUnsub(){try{if(payRt.chan)db.removeChannel(payRt.chan)}catch(_){}payRt.chan=null;payRt.uid=null}
function payRtSubscribe(uid){
 if(!uid||(payRt.chan&&payRt.uid===uid))return;
 payRtUnsub();
 try{
  payRt.uid=uid;
  payRt.chan=db.channel("wasla-payments-"+uid)
   .on("postgres_changes",{event:"UPDATE",schema:"public",table:"payments",filter:"customer_id=eq."+uid},payload=>{
    const row=payload&&payload.new;
    if(!row||!row.request_id)return;
    const prev=s.payments&&s.payments[row.request_id];
    if(!s.payments)s.payments={};
    s.payments[row.request_id]=Object.assign({},prev||{},row);
    if(row.payment_status==="paid"&&(!prev||prev.payment_status!=="paid")){
     note("الفني أكد استلام المبلغ ✓","success");
    }else render();
   })
   .subscribe();
 }catch(_){payRt.chan=null;payRt.uid=null}
}

  if(provider&&q.status==="pending"&&!q.provider_id){
   a=btn("claim","قبول الطلب","green",q.id);

    a=btn("createquote",quote?"إرسال عرض معدل":"إنشاء عرض سعر","gold",q.id);

    a=btn("advance","بدء التنفيذ","gold",q.id,"data-next='in_progress'");
   }else{
    const quoteStatus={
     awaiting_customer:"في انتظار رد العميل",
          awaiting_provider_approval:"في انتظار اعتمادك",
     withdrawn:"تم سحب عرض السعر"
    };

    if(quote.status==="awaiting_provider_approval"){
     a=btn("quote-provider-review","مراجعة واعتماد العرض","gold",quote.id);
    }else{
     a=tag(quoteStatus[quote.status]||"عرض السعر قيد المراجعة");

   }

   a=btn("advance","إنهاء الطلب","green",q.id,"data-next='completed'");
  }

function rqFilesRender(){
 const el=document.getElementById("rqFileList");if(!el)return;
 el.innerHTML=(s.reqFiles||[]).map((f,i)=>'<div class="rq-file"><span>'+(f.type.startsWith("image/")?"صورة":f.type.startsWith("video/")?"فيديو":"صوت")+'</span><b>'+esc(f.name)+'</b><small>'+(f.size/1048576).toFixed(1)+' MB</small><button type="button" data-a="rq-file-rm" data-id="'+i+'" aria-label="حذف">×</button></div>').join("");
}
function rqFilesAdd(list){
 const lim={image:[10,5],video:[50,1],audio:[15,2]};
 s.reqFiles=s.reqFiles||[];
 for(const f of Array.from(list||[])){
  const k=f.type.startsWith("image/")?"image":f.type.startsWith("video/")?"video":f.type.startsWith("audio/")?"audio":null;
  if(!k){note("نوع الملف غير مدعوم: "+f.name,"error");continue}
  if(f.size>lim[k][0]*1048576){note("الملف "+f.name+" أكبر من "+lim[k][0]+" ميجابايت","error");continue}
  if(s.reqFiles.filter(x=>x.type.startsWith(k+"/")).length>=lim[k][1]){note("الحد الأقصى لهذا النوع "+lim[k][1]+" ملف","error");continue}
  s.reqFiles.push(f);
 }
 rqFilesRender();
}
document.addEventListener("change",e=>{
 const t=e.target;
 if(t&&(t.id==="rqFileImg"||t.id==="rqFileVid"||t.id==="rqFileAud")){rqFilesAdd(t.files);t.value=""}
});
function rqHoursRefresh(){
 const day=document.querySelector('#requestForm [name="sched_day"]')?.value||"";
 const now=new Date();
 const today=now.getFullYear()+"-"+rqPad(now.getMonth()+1)+"-"+rqPad(now.getDate());
 document.querySelectorAll("#requestForm .rq-hr").forEach(b=>{
  const h=Number(b.dataset.id);
  const past=day===today&&h<=now.getHours();
  b.disabled=past;b.classList.toggle("off",past);
  if(past&&b.classList.contains("on")){b.classList.remove("on");const hh=document.querySelector('#requestForm [name="sched_hour"]');if(hh)hh.value=""}
 });
}
async function rqUploadFiles(requestId,files){
 const bucket=db.storage.from("request-media");
 let ok=0,fail=0;
 for(const f of files){
  try{
   const ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"")||"bin";
   const path=s.user.id+"/"+requestId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
   const up=await bucket.upload(path,f,{contentType:f.type,upsert:false});
   if(up.error)throw up.error;
   const kind=f.type.startsWith("image/")?"image":f.type.startsWith("video/")?"video":"audio";
   const ins=await db.from("service_request_media").insert({request_id:requestId,uploaded_by:s.user.id,storage_path:path,mime_type:f.type,size_bytes:f.size,media_kind:kind});
   if(ins.error)throw ins.error;
   ok++;
  }catch(err){console.warn("[request-media]",err);fail++}
 }
 return {ok,fail};
}

const WC_TZ="Africa/Cairo";
function wcTime(x){
 const d=new Date(x);if(isNaN(d))return "";
 const t=d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:WC_TZ});
 return t.replace("AM","ص").replace("PM","م");
}
function wcDayKey(x){
 const d=new Date(x);if(isNaN(d))return "";
 return d.toLocaleDateString("en-CA",{timeZone:WC_TZ});
}
function wcListTime(x){
 const d=new Date(x);if(isNaN(d))return "";
 const key=wcDayKey(x),today=new Date();
 if(key===wcDayKey(today))return wcTime(x);
 if(key===wcDayKey(new Date(today.getTime()-86400000)))return "أمس";
 return d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"2-digit",timeZone:WC_TZ});
}
function wcDayLabel(x){
 const d=new Date(x);if(isNaN(d))return "";
 const key=wcDayKey(x),today=new Date();
 const k0=wcDayKey(today),k1=wcDayKey(new Date(today.getTime()-86400000));
 if(key===k0)return "اليوم";
 if(key===k1)return "أمس";
 const diff=(Date.parse(k0)-Date.parse(key))/86400000;
 if(diff>0&&diff<7)return d.toLocaleDateString("ar-EG-u-nu-latn",{weekday:"long",timeZone:WC_TZ});
 return d.toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"long",year:"numeric",timeZone:WC_TZ});
}
const WC_DOC_MAX=25*1024*1024;
const WC_DOC_TYPES={pdf:"application/pdf",doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xls:"application/vnd.ms-excel",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",ppt:"application/vnd.ms-powerpoint",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",txt:"text/plain",zip:"application/zip"};
function wcDocExt(file){return String(file&&file.name||"").split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"")}
function wcDocMime(file){
 const ext=wcDocExt(file),mime=WC_DOC_TYPES[ext];
 if(!mime)return null;
 const t=(file.type||"").toLowerCase();
 if(t&&t!==mime&&!(ext==="zip"&&(t==="application/x-zip-compressed"||t==="application/x-zip"))&&!(ext==="txt"&&t.startsWith("text/"))&&t!=="application/octet-stream")return null;
 return mime;
}

function wcVideoThumb(file){
 return new Promise(resolve=>{
  let done=false,url=null;
  const v=document.createElement("video");
  const finish=blob=>{if(done)return;done=true;clearTimeout(tm);try{if(url)URL.revokeObjectURL(url)}catch(_){}v.removeAttribute("src");resolve(blob||null)};
  const tm=setTimeout(()=>finish(null),10000);
  try{
   url=URL.createObjectURL(file);
   v.muted=true;v.playsInline=true;v.preload="auto";v.crossOrigin="anonymous";
   v.onerror=()=>finish(null);
   v.onloadedmetadata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(_){finish(null)}};
   v.onseeked=()=>{
    try{
     if(!v.videoWidth||!v.videoHeight)return finish(null);
     const w=Math.min(480,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);
     const c=document.createElement("canvas");c.width=w;c.height=h;
     c.getContext("2d").drawImage(v,0,0,w,h);
     c.toBlob(b=>finish(b&&b.size>0?b:null),"image/jpeg",0.8);
    }catch(_){finish(null)}
   };
   v.src=url;
  }catch(_){finish(null)}
 });
}

async function loadChatMediaUrls(messages){
 s.chatMediaUrls={};

 const mediaMessages=(messages||[])
  .filter(m=>m.attachment_path);

 const results=await Promise.all(
  mediaMessages.map(async m=>{
   let result={error:true};
   try{
    result=await db.storage
     .from("conversation-media")
     .createSignedUrl(m.attachment_path,3600);
   }catch(_){}

   return {
    id:m.id,
    url:result.error?null:result.data?.signedUrl||null
   };
  })
 );

 s.chatMediaUrls=Object.fromEntries(
  results.filter(x=>x.url).map(x=>[x.id,x.url])
 );

 const thumbMessages=(messages||[]).filter(m=>m.thumbnail_path);
 const thumbResults=await Promise.all(
  thumbMessages.map(async m=>{
   let result={error:true};
   try{
    result=await db.storage
     .from("conversation-media")
     .createSignedUrl(m.thumbnail_path,3600);
   }catch(_){}
   return {id:"t:"+m.id,url:result.error?null:result.data?.signedUrl||null};
  })
 );
 thumbResults.filter(x=>x.url).forEach(x=>{s.chatMediaUrls[x.id]=x.url});
 s.chatUrlAt={};s.wcSignTry={};
 Object.keys(s.chatMediaUrls).forEach(k=>{s.chatUrlAt[k]=Date.now()});
}

      async function resumePrimeKnowledgeRelease(releaseId){
 if(s.profile?.role!=="owner")
  throw Error("استكمال الإصدارات متاح للمالك فقط");

 const release=s.knowledgeReleases.find(x=>x.id===releaseId);

 if(!release||release.status!=="draft")
  throw Error("مسودة الإصدار غير موجودة أو لم تعد قابلة للاستكمال");

 const manifest=release.document_manifest;

 if(!Array.isArray(manifest)||!manifest.length||manifest.length>100)
  throw Error("قائمة مستندات الإصدار غير صالحة");

 const seen=new Set();

 for(const entry of manifest){
  if(!entry||typeof entry!=="object"||
     typeof entry.document_id!=="string"||
     !Number.isInteger(Number(entry.document_version))||
     Number(entry.document_version)<1||
     !Number.isInteger(Number(entry.chunk_count))||
     Number(entry.chunk_count)<1||
     Number(entry.chunk_count)>1000)
   throw Error("بيانات أحد مستندات الإصدار غير صالحة");

  if(seen.has(entry.document_id))
   throw Error("الإصدار يحتوي على مستند مكرر");

  seen.add(entry.document_id);

  const {data,error}=await db.functions.invoke("prime-knowledge-admin",{
   body:{
    action:"get_document",
    document_id:entry.document_id
   }
  });

  if(error)throw error;
  if(data?.error)throw Error(data.error);

  const doc=data?.document;

  if(!doc||doc.status!=="approved"||
     Number(doc.document_version)!==Number(entry.document_version))
   throw Error("أحد المستندات لم يعد معتمدًا بنفس النسخة. لن يتم استكمال الإصدار.");

  const content=String(doc.content||"").trim();

  if(!content||content.length>100000)
   throw Error("محتوى أحد المستندات غير صالح");

  const chunks=[];
  let current="";

  const paragraphs=content.split(/\n\s*\n/);

  for(const paragraph of paragraphs){
   const part=paragraph.trim();
   if(!part)continue;

   if(part.length>15000){
    if(current){
     chunks.push(current);
     current="";
    }

    for(let i=0;i<part.length;i+=15000){
     chunks.push(part.slice(i,i+15000));
    }
    continue;
   }

   if(current&&current.length+part.length+2>15000){
    chunks.push(current);
    current=part;
   }else{
    current=current?current+"\n\n"+part:part;
   }
  }

  if(current)chunks.push(current);

  if(chunks.length!==Number(entry.chunk_count))
   throw Error("عدد أجزاء المستند تغيّر. أوقفنا الاستكمال لحماية الإصدار.");

  for(let i=0;i<chunks.length;i++){
   const result=await db.functions.invoke("prime-knowledge-admin",{
    body:{
     action:"add_chunk",
     release_id:releaseId,
     document_id:doc.id,
     document_version:Number(entry.document_version),
     chunk_index:i,
     content:chunks[i],
     token_estimate:Math.ceil(chunks[i].length/4),
     metadata:{
      title:doc.title,
      slug:doc.slug,
      category:doc.category
     }
    }
   });

   if(result.error)throw result.error;
   if(result.data?.error)throw Error(result.data.error);
   if(!result.data?.success)
    throw Error("لم يتم تأكيد استكمال أحد أجزاء المحتوى");
  }
 }

 await loadPrimeKnowledge();

 note("تم استكمال تجهيز الإصدار كمسودة. لم يتم نشره.","success");
  }

      const RL_REASON={no_provider:"بلا مزوّد",past_scheduled:"متأخر في التنفيذ",no_scheduled_at:"بلا موعد"};
      const RL_DESC={no_provider:"قيد الانتظار وتجاوز المهلة بلا مقدم خدمة",past_scheduled:"جاري التنفيذ وتجاوز موعد التنفيذ والمهلة",no_scheduled_at:"له مقدم خدمة (مقبول أو جاري التنفيذ) بلا موعد تنفيذ متفق عليه"};
      function rlState(){
        if(!s.rl)s.rl={rows:[],total:0,counters:null,limit:25,offset:0,loading:false,loaded:false,error:"",errorHint:"",filters:{search:"",reason:"",city_id:"",area_id:"",service_id:"",provider_id:""}};
        return s.rl;
      }
      async function loadLateRequests(){
        const l=rlState();
        if(!rqCanView())return;
        l.loading=true;l.loaded=true;l.error="";l.errorHint="";l.rows=[];
        render();
        const f=l.filters;
        const params={p_reason:f.reason||null,p_city_id:f.city_id||null,p_area_id:f.area_id||null,p_service_id:f.service_id||null,p_provider_id:f.provider_id||null,p_search:f.search.trim()||null,p_limit:l.limit,p_offset:l.offset};
        try{
          const {data,error}=await db.rpc("admin_list_late_requests",params);
          if(error)throw error;
          l.rows=Array.isArray(data?.items)?data.items:[];
          l.total=Number(data?.total||0);
          l.counters=data?.counters||null;
          l.limit=Number(data?.limit||l.limit);
          l.offset=Number(data?.offset??l.offset);
        }catch(err){
          console.error("[admin_list_late_requests]");
          const info=rqError(err);
          l.rows=[];l.total=0;l.counters=null;
          l.error=info.known?info.text:"تعذّر تحميل الطلبات المتأخرة.";
          l.errorHint=info.known?"":String(info.raw||"");
          if(info.offsetReset)l.offset=0;
        }
        l.loading=false;
        render();
      }
      function rlApplyFromDom(){
        const l=rlState(),g=id=>document.getElementById(id),f=l.filters;
        f.search=g("rlSearch")?.value||"";
        f.city_id=g("rlCity")?.value||"";
        f.area_id=g("rlArea")?.value||"";
        f.service_id=g("rlService")?.value||"";
        f.provider_id=g("rlProvider")?.value||"";
        if(f.search.length>200){note("نص البحث أطول من 200 حرف.","error");return false}
        l.offset=0;
        return true;
      }

        '</div><div class="actions">'+btn("rl-apply","تطبيق","gold")+btn("rl-reset","إعادة ضبط","light")+'</div>';

        let content="";
        if(l.loading)content='<div class="empty">جاري تحميل الطلبات المتأخرة...</div>';
        else if(l.error)content='<div class="notice error">'+esc(l.error)+(l.errorHint?'<div class="small">'+esc(l.errorHint)+'</div>':'')+'</div><div class="actions">'+btn("rl-retry","إعادة المحاولة","light")+'</div>';
        else if(!l.rows.length)content=empty("لا توجد طلبات متأخرة مطابقة");
        else{
          content='<div class="rq-wrap"><table class="rq-table"><thead><tr><th>رقم الطلب</th><th>عنوان الطلب</th><th>الخدمة</th><th>الحالة</th><th>المدينة</th><th>المنطقة</th><th>مقدم الخدمة</th><th>تاريخ الإنشاء</th><th>الموعد</th><th>التصنيف</th></tr></thead><tbody>'+
          l.rows.map(r=>{
            const st=r.status;

            const rs=RL_REASON[r.reason]||r.reason||"—";
            const badge='<span class="tag'+(r.reason==="no_scheduled_at"?"":" bad")+'">'+esc(rs)+'</span>'+((r.delay_hours!==null&&r.delay_hours!==undefined)?'<div class="small">'+esc(fmt(r.delay_hours))+' ساعة تأخير</div>':"");
            return '<tr data-a="rq-open" data-id="'+esc(r.request_id)+'" style="cursor:pointer"><td class="rq-id">'+esc(String(r.request_id||"").slice(0,8))+'</td><td>'+esc(r.title||"طلب خدمة")+'</td><td>'+esc(r.service_name_ar||"—")+'</td><td>'+stTag+'</td><td>'+esc(r.city_name||"—")+'</td><td>'+esc(r.area_name||"—")+'</td><td>'+esc(r.provider_name||"—")+'</td><td>'+esc(rqDate(r.created_at))+'</td><td>'+esc(rqDate(r.scheduled_at))+'</td><td><div class="rq-flags">'+badge+'</div></td></tr>';
          }).join("")+'</tbody></table></div>';
        }
        const pages=Math.max(1,Math.ceil(l.total/l.limit)),page=Math.floor(l.offset/l.limit)+1;
        const pager='<div class="rq-pager"><span class="small">الإجمالي: '+fmt(l.total)+' طلب</span><div class="actions">'+
          (l.offset>0&&!l.loading?btn("rl-prev","السابق","light"):"")+
          '<span class="small">صفحة '+fmt(page)+' من '+fmt(pages)+'</span>'+
          (l.offset+l.limit<l.total&&!l.loading?btn("rl-next","التالي","light"):"")+
        '</div></div>';
        return counters+filters+content+pager;
      }

      /* ===== مشرف المنطقة (ASV): شاشات الموبايل =====
         الشاشات المبنية على RPCs موجودة شغالة. الشكاوى والمزودين واقتراح الإيقاف مبنية لكن مقفولة بالأعلام
         دي لحد ما الـDB يتنفذ (راجع مستند طلبات الـDB). مفيش بيانات عميل ولا أسعار ولا مدفوعات تظهر للمشرف. */

        const q=rqState(),f=q.filters;

      function asvDue(iso){
        if(!iso)return {txt:"—",cls:""};

        return ms>=0?{txt:"باقي "+t,cls:ms<3600000?"bad":"warn"}:{txt:"تجاوز بـ "+t,cls:"bad"};
      }

      async function asvSheetSend(){
        const st=asvState(),sh=st.sheet;
        if(!sh||sh.busy||!ASV_SHEETS[sh.kind])return;
        const d=ASV_SHEETS[sh.kind];
        const text=String(document.getElementById("asvSheetText")?.value||sh.text||"").trim();
        sh.text=text;sh.err="";
        const params={};
        params[d.idKey]=sh.id;
        if(text.length<5||text.length>500){sh.err="النص لازم يكون من 5 إلى 500 حرف";render();return}
        if(d.amount){
          const raw=String(document.getElementById("asvSheetAmt")?.value||sh.amount||"").trim().replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x));
          sh.amount=raw;
          const n=Number(raw);
          if(!raw||!Number.isFinite(n)||n<=0||n>100000){sh.err="اكتب مبلغ صحيح أكبر من صفر";render();return}
          params.p_amount=n;
        }
        params[d.textKey]=text;
        sh.busy=true;render();
        try{
          const {error}=await db.rpc(d.rpc,params);
          if(error)throw error;
          st.msg=d.ok;st.sheet=null;
          if(d.reload==="cmp")await asvLoadComplaints();else await asvLoadProviders();
          return;
        }catch(err){
          console.error("["+d.rpc+"]");
          sh.err=String(err?.message||"").slice(0,160)||"تعذّر تنفيذ العملية.";
        }
        sh.busy=false;render();
      }

const FINANCIAL_RESTRICTED_AR="الصلاحيات المالية مخصصة لموظفي الإدارة المالية فقط.";
function staffPermissionOptionsHtml(selected=[],roleCode="ASV"){
 return STAFF_PERMISSION_OPTIONS.map(x=>{
  const key=x[0],adminOnly=x[3];
  const financial=FINANCIAL_PERMISSION_KEYS.includes(key);
  const finLocked=financial&&roleCode!=="FIN";
  const locked=adminOnly||finLocked;
  return '<label class="item"><input type="checkbox" name="permissions" value="'+esc(key)+'"'+
   (financial?' data-financial="1"':"")+
   (selected.includes(key)&&!locked?" checked":"")+(locked?" disabled":"")+'> '+esc(x[1])+
   (adminOnly?' <span class="muted small">(للإدارة فقط)</span>':"")+
   (financial?' <span class="muted small fin-badge"'+(finLocked?"":' style="display:none"')+'>(للمالية فقط)</span>':"")+'</label>';
 }).join("");
}
function syncFinancialPermissionOptions(form){
 const role=form.elements.staff_role_code?.value;
 form.querySelectorAll('input[data-financial="1"]').forEach(input=>{
  const locked=role!=="FIN";
  if(locked)input.checked=false;
  input.disabled=locked;
  const badge=input.parentElement?.querySelector(".fin-badge");
  if(badge)badge.style.display=locked?"":"none";
 });
}
async function readFunctionError(err){
 try{
  const c=err&&err.context;
  if(c&&typeof c.json==="function"){
   const b=await c.json();
   if(b&&b.error)return String(b.error);
  }
 }catch(_e){}
 return String(err&&err.message||"");
}
function isFinancialRestrictedError(msg){
 return String(msg||"").includes(FINANCIAL_RESTRICTED_EN);
}
function checkedStaffPermissions(form){
 return Array.from(form.querySelectorAll('input[name="permissions"]:checked:not(:disabled)')).map(x=>x.value);
}

const waslaNotif=(function(){
 var VAPID="BCp9on6uMfhPamLjxs6wFzO-Y3J1Bx6Wt-dF7Wj5bu2MM3SEeyQivPJoK4IxRfMyNJZ4TaQbV1jg2YaJBT1HDsA";
 var st={pushUid:null,uid:null,list:[],unread:0,ok:true,chan:null,panel:null,swReg:null,loading:false};
 function stop(){try{if(st.chan)db.removeChannel(st.chan)}catch(_){}st.chan=null;st.uid=null;st.list=[];st.unread=0;st.ok=true;closePanel();if(!s.user)pushOff()}
 function u8(b){var p="=".repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
 async function pushOff(){
  try{
   st.pushUid=null;
   if(!("serviceWorker" in navigator))return;
   var reg=await navigator.serviceWorker.getRegistration("/sw.js")||await navigator.serviceWorker.getRegistration();
   var sub=reg&&reg.pushManager?await reg.pushManager.getSubscription():null;
   if(sub)await sub.unsubscribe();
  }catch(_){}
 }
 async function ensurePush(){
  try{
   if(!s.user||st.pushUid===s.user.id)return;
   if(typeof Notification==="undefined"||Notification.permission!=="granted")return;
   if(!("serviceWorker" in navigator)||!("PushManager" in window))return;
   var reg=await navigator.serviceWorker.ready;
   if(!reg||!reg.pushManager)return;
   var sub=await reg.pushManager.getSubscription();
   if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
   var j=sub.toJSON();
   if(!j||!j.endpoint||!j.keys)return;
   var r=await db.rpc("save_push_subscription",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_user_agent:navigator.userAgent});
   if(!r.error)st.pushUid=s.user.id;
  }catch(e){console.warn("[push]",e&&e.message)}
 }
 function badge(){
  var b=document.querySelector(".notif-bell .notif-badge");
  if(b){b.textContent=st.unread>99?"99+":String(st.unread);b.style.display="flex";b.classList.toggle("zero",st.unread===0)}
 }
 function ago(t){
  var d=Math.max(0,(Date.now()-new Date(t).getTime())/1000);
  if(d<60)return "الآن";
  if(d<3600)return "منذ "+Math.floor(d/60)+" د";
  if(d<86400)return "منذ "+Math.floor(d/3600)+" س";
  return "منذ "+Math.floor(d/86400)+" يوم";
 }
 async function load(){
  if(st.loading)return;st.loading=true;
  try{
   var r=await db.from("notifications").select("*").order("created_at",{ascending:false}).limit(50);
   if(r.error){st.ok=false;return}
   st.ok=true;st.list=r.data||[];st.unread=st.list.filter(function(x){return !x.is_read}).length;
   badge();if(st.panel)renderPanel();
  }catch(_){st.ok=false}finally{st.loading=false}
 }
 function sysNotify(n){
  try{
   if(typeof Notification==="undefined"||Notification.permission!=="granted")return;
   if(!document.hidden)return;
   var opt={body:n.body||"",tag:n.id,lang:"ar",dir:"rtl"};
   if(st.swReg&&st.swReg.showNotification){st.swReg.showNotification(n.title,opt);return}
   new Notification(n.title,opt);
  }catch(_){}
 }
 function subscribe(uid){
  try{
   st.chan=db.channel("wasla-notifs-"+uid)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+uid},function(p){
     var n=p&&p.new;if(!n||!n.id)return;
     if(st.list.some(function(x){return x.id===n.id}))return;
     st.list.unshift(n);st.unread+=n.is_read?0:1;badge();
     if(st.panel)renderPanel();
     if(document.hidden)sysNotify(n);else{try{note(n.title+(n.body?" - "+n.body:""),"success")}catch(_){}}
    }).subscribe();
  }catch(_){st.chan=null}
 }
 function start(uid){
  st.uid=uid;
  try{if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").then(function(r){st.swReg=r}).catch(function(){})}catch(_){}
  load().then(function(){if(st.ok&&st.uid===uid)subscribe(uid)});
  ensurePush();
 }
 function bellHtml(){
  return '<button type="button" class="notif-bell'+((typeof Notification!=="undefined"&&Notification.permission==="default")?' notif-ask':'')+'" data-nf="open" aria-label="الإشعارات" title="الإشعارات"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="notif-badge'+(st.unread>0?'':' zero')+'" style="display:flex">'+(st.unread>99?"99+":st.unread)+'</span></button>';
 }
 function onRender(){
  if(!s.user||!s.profile){if(st.uid)stop();return}
  if(st.uid!==s.user.id){if(st.uid)stop();start(s.user.id)}
  urlNav();
  if(!st.ok)return;
  var top=document.querySelector(".topline");
  if(top&&!top.querySelector(".notif-bell")){
   var tmp=document.createElement("div");tmp.innerHTML=bellHtml();
   var bell=tmp.firstChild,nav=top.querySelector(":scope > .nav");
   if(nav)top.insertBefore(bell,nav);else top.appendChild(bell);
  }
 }
 function closePanel(){if(st.panel){st.panel.remove();st.panel=null}}
 function renderPanel(){
  var perm=(typeof Notification!=="undefined")?Notification.permission:"unsupported";
  var h='<div class="wth-panel notif-panel" role="dialog" aria-label="الإشعارات"><div class="notif-head"><h3>الإشعارات</h3><div>'+(st.unread>0?'<button type="button" class="notif-link" data-nf="readall">تحديد الكل كمقروء</button>':'')+'<button type="button" class="notif-link" data-nf="close">إغلاق</button></div></div>';
  if(perm==="default")h+='<div class="notif-perm"><span>فعّل إشعارات الجهاز عشان توصلك التنبيهات بصوت الموبايل.</span><button type="button" class="btn gold" data-nf="perm">تفعيل</button></div>';
  else if(perm==="denied")h+='<div class="notif-perm"><span>إشعارات الجهاز مقفولة من إعدادات المتصفح.</span></div>';
  if(!st.list.length)h+='<div class="empty">مفيش إشعارات لسه.</div>';
  else h+=st.list.map(function(n){return '<button type="button" class="notif-item'+(n.is_read?'':' unread')+'" data-nf="item" data-nid="'+esc(n.id)+'"><span class="notif-dot"></span><span class="notif-txt"><b>'+esc(n.title)+'</b>'+(n.body?'<span>'+esc(n.body)+'</span>':'')+'<small>'+esc(ago(n.created_at))+'</small></span></button>'}).join("");
  h+='</div>';
  st.panel.innerHTML=h;
 }
 function openPanel(){
  closePanel();
  var el=document.createElement("div");el.className="wth-back";el.setAttribute("data-nf-back","1");
  document.body.appendChild(el);st.panel=el;renderPanel();load();
 }
 function go(n){
  closePanel();
  try{
   var role=s.profile&&s.profile.role;
   if(n.notification_type==="chat_message"){if(n.request_id)navFire("chat",n.request_id);else navFire("tab","messages")}
   else if(n.notification_type==="payment_paid"&&role==="customer")navFire("tab","payments");
   else navFire("tab","requests");
  }catch(_){}
 }
 try{if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("message",function(e){var d=e&&e.data&&e.data.wasla_nf;if(d&&s.user)go(d)})}catch(_){}
 function urlNav(){
  try{
   var m=/[?&]wnf=([^&]*)/.exec(location.search);
   if(!m||!s.user||!s.profile)return;
   var p=decodeURIComponent(m[1]).split("|");
   history.replaceState(history.state,document.title,location.pathname);
   go({notification_type:p[0]||"",request_id:p[1]||null});
  }catch(_){}
 }
 document.addEventListener("click",function(e){
  var t=e.target;if(!t||!t.closest)return;
  var b=t.closest("[data-nf]");
  if(!b){if(st.panel&&t===st.panel)closePanel();return}
  var a=b.getAttribute("data-nf");
  if(a==="open")openPanel();
  else if(a==="close")closePanel();
  else if(a==="readall"){
   st.list=st.list.map(function(x){return Object.assign({},x,{is_read:true})});st.unread=0;badge();if(st.panel)renderPanel();
   try{db.rpc("mark_all_notifications_read").then(function(){},function(){})}catch(_){}
  }else if(a==="perm"){
   try{Notification.requestPermission().then(function(){ensurePush();if(st.panel)renderPanel()})}catch(_){}
  }else if(a==="item"){
   var id=b.getAttribute("data-nid"),n=st.list.find(function(x){return x.id===id});
   if(!n)return;
   if(!n.is_read){n.is_read=true;st.unread=Math.max(0,st.unread-1);badge();try{db.rpc("mark_notification_read",{p_id:id}).then(function(){},function(){})}catch(_){}}
   go(n);
  }
 });
 return {onRender:onRender,enable:function(){try{return Notification.requestPermission().then(function(){return ensurePush()}).then(function(){if(st.panel)renderPanel()})}catch(_){return Promise.resolve()}}};
})();
const waslaInstall=(function(){
 var deferred=null,el=null,KEY="wasla_setup_snooze_at",DAYS=7;
 var ua=navigator.userAgent||"";
 var isIOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 var installed=false;
 function standalone(){try{return installed||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true}catch(_){return false}}
 function snoozed(){try{var t=Number(localStorage.getItem(KEY)||0);return t&&(Date.now()-t)<DAYS*86400000}catch(_){return false}}
 function snooze(){try{localStorage.setItem(KEY,String(Date.now()))}catch(_){}}
 function hide(){if(el){el.remove();el=null}}
 function needInstall(){return !standalone()&&(!!deferred||isIOS)}
 function needNotif(){try{return typeof Notification!=="undefined"&&Notification.permission==="default"}catch(_){return false}}
 window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;try{onRender()}catch(_){}});
 window.addEventListener("appinstalled",function(){deferred=null;installed=true;try{onRender()}catch(_){}});
 function sheet(){
  var b=document.createElement("div");b.className="wth-back";b.setAttribute("data-inst-sheet","1");
  b.innerHTML='<div class="wth-panel" role="dialog" aria-label="تثبيت وصلة"><h3>ثبّت وصلة على الآيفون</h3><p>٣ خطوات بس:</p><ol class="inst-steps"><li>اضغط زر <b>المشاركة</b> <span class="inst-share">⬆︎</span> في شريط سفاري.</li><li>اختار <b>Add to Home Screen</b> (إضافة إلى الشاشة الرئيسية).</li><li>اضغط <b>Add</b>، وهتلاقي وصلة على شاشتك كأنها تطبيق.</li></ol><div class="wth-actions"><button type="button" class="go" data-inst="sheetclose">تمام</button></div></div>';
  document.body.appendChild(b);
 }
 var CHK='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
 function row(n,done,title,sub,act,label){
  return '<div class="sc-row'+(done?' done':'')+'"><span class="sc-num">'+(done?CHK:n)+'</span><div class="sc-txt"><b>'+title+'</b><span>'+sub+'</span></div>'+(done?'':'<button type="button" class="sc-btn" data-inst="'+act+'">'+label+'</button>')+'</div>';
 }
 function onRender(){
  try{
   if(!s.user||!s.profile||snoozed()){hide();return}

   if(!ni&&!nn){hide();return}
   var h='<div class="sc-head"><svg class="sc-logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M7 17 L19 46 L31 25 L43 46 L57 17" fill="none" stroke="#F9FAFB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 39 C17 57 46 9 59 27" fill="none" stroke="#D6A642" stroke-width="4" stroke-linecap="round"/><circle cx="55" cy="15" r="5" fill="#D6A642"/></svg><div class="sc-title"><b>خلّي وصلة في جيبك</b><span>'+((ni&&nn)?"خطوتين بسيطين وتبقى جاهز":"خطوة واحدة وتخلص")+'</span></div><button type="button" class="sc-x" data-inst="x" aria-label="إغلاق">✕</button></div>';
   var k=1;
   if(ni)h+=row(k++,false,"ثبّت التطبيق","يفتح من شاشتك الرئيسية كأي تطبيق","go","تثبيت");
   else if(wasSteps.install)h+=row(k++,true,"ثبّت التطبيق","تم التثبيت","","");
   if(nn)h+=row(k++,false,"فعّل الإشعارات","تنبيه بصوت الموبايل لكل طلب ورسالة","notif","تفعيل");

 var wasSteps={install:false};
 document.addEventListener("click",function(e){
  var t=e.target;if(!t||!t.closest)return;
  var b=t.closest("[data-inst]");
  if(!b){var sh=t.closest("[data-inst-sheet]");if(sh&&t===sh)sh.remove();return}

  else if(a==="go"){
   if(deferred){
    var d=deferred;deferred=null;
    try{d.prompt();d.userChoice.then(function(r){onRender()}).catch(function(){onRender()})}catch(_){onRender()}
   }else if(isIOS)sheet();

 async function prepareServiceImage(file){
 if(!file)return null;

 if(!["image/jpeg","image/png","image/webp"].includes(file.type))
  throw Error("اختار صورة JPG أو PNG أو WebP");

 if(typeof createImageBitmap!=="function")
  throw Error("المتصفح لا يدعم ضغط الصور. جرّب Chrome محدث.");

 const bitmap=await createImageBitmap(file);
 const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));

 const canvas=document.createElement("canvas");
 canvas.width=Math.max(1,Math.round(bitmap.width*scale));
 canvas.height=Math.max(1,Math.round(bitmap.height*scale));

 const ctx=canvas.getContext("2d");
 ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
 bitmap.close?.();

 const blob=await new Promise(resolve=>
  canvas.toBlob(resolve,"image/webp",.82)
 );

 if(!blob)throw Error("تعذّر تجهيز الصورة");
 if(blob.size>4*1024*1024)
  throw Error("حجم الصورة بعد الضغط أكبر من 4 ميجابايت");

 return new File([blob],"service-"+Date.now()+".webp",{
  type:"image/webp"
 });
}

async function saveServiceImage(serviceId,file,oldUrl){
 const imageFile=await prepareServiceImage(file);
 if(!imageFile)return null;

 const path="services/"+serviceId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+".webp";
 const bucket=db.storage.from("service-images");

 const uploaded=await bucket.upload(path,imageFile,{
  contentType:"image/webp",
  cacheControl:"31536000",
  upsert:false
 });

 if(uploaded.error)throw uploaded.error;

 const publicUrl=bucket.getPublicUrl(path).data.publicUrl;

 const updated=await db.rpc("admin_set_service_image",{
 p_service_id:serviceId,
 p_image_url:publicUrl
});

if(updated.error){
 await bucket.remove([path]);
 throw updated.error;
}
 const marker="/storage/v1/object/public/service-images/";

 if(oldUrl&&String(oldUrl).includes(marker)){
  const oldPath=decodeURIComponent(String(oldUrl).split(marker).pop());

  if(oldPath.startsWith("services/")&&oldPath!==path)
   await bucket.remove([oldPath]);
 }

 return publicUrl;
}

if(String(v.currency||"").toUpperCase()!==expectedCurrency)
 throw Error("عملة عرض السعر يجب أن تكون الجنيه المصري");

 const validMoney=value=>
  /^\d+(\.\d{1,2})?$/.test(String(value||"").trim())&&Number(value)>0;

 if(!validMoney(v.amount))
  throw Error("أدخل إجمالي عرض صحيحًا، بحد أقصى منزلتين عشريتين");

 const amountCents=Math.round(Number(v.amount)*100);

 if(scope.length<5||scope.length>5000)

 if(!duration||duration.length>200)
  throw Error("أدخل مدة تنفيذ صحيحة لا تتجاوز 200 حرف");

 if(terms.length>3000)

 const validUntil=new Date(v.valid_until);

 if(!v.valid_until||Number.isNaN(validUntil.getTime()))
  throw Error("حدد تاريخ صلاحية عرض السعر");

 const now=Date.now();

 if(validUntil.getTime()<=now+60000)
  throw Error("يجب أن تكون صلاحية العرض بعد دقيقة على الأقل");

 if(validUntil.getTime()>now+30*24*60*60*1000)
  throw Error("أقصى مدة لصلاحية العرض 30 يومًا");

 let proposedStart=null;

 if(v.proposed_start_at){

 }

 const paymentSchedule=[];

 for(let i=1;i<=3;i++){
  const amount=String(v["schedule_amount_"+i]||"").trim();
  const label=String(v["schedule_label_"+i]||"").trim();
  const event=String(v["schedule_event_"+i]||"").trim();

  if(!amount)continue;

  if(!validMoney(amount))
   throw Error("أدخل مبلغًا صحيحًا للدفعة رقم "+i);

  if(label.length>160)
   throw Error("وصف الدفعة رقم "+i+" لا يتجاوز 160 حرفًا");

  if(!["on_agreement","on_start","on_milestone","on_completion"].includes(event))
   throw Error("موعد استحقاق الدفعة رقم "+i+" غير صحيح");

  paymentSchedule.push({
   sequence:paymentSchedule.length+1,
   amount:Number(amount),
   due_event:event,
   label:label||({on_agreement:"عند الاتفاق",on_start:"عند بدء التنفيذ",on_milestone:"عند إنجاز مرحلة",on_completion:"عند اكتمال العمل"})[event]
  });
 }

 if(!paymentSchedule.length)

  const quoteSettings=s.serviceQuoteSettings||{};

  );

 );

 if(scheduleCents!==amountCents)

if(f.id==="primeKnowledgeReleaseForm"){
 if(s.profile?.role!=="owner")
  throw Error("إنشاء إصدارات المعرفة متاح للمالك فقط");

 const formData=new FormData(f);
 const releaseVersion=Number(formData.get("release_version"));
 const platformCommit=String(formData.get("platform_commit")||"").trim()||null;
 const documentIds=[...new Set(formData.getAll("documents").map(String))];

 const latestVersion=Math.max(
  0,
  ...s.knowledgeReleases.map(x=>Number(x.release_version)||0)
 );

 if(!Number.isInteger(releaseVersion)||releaseVersion<=latestVersion)
  throw Error("رقم الإصدار يجب أن يكون أكبر من أحدث إصدار موجود");

 if(!documentIds.length)
  throw Error("اختر مستندًا معتمدًا واحدًا على الأقل");

 if(platformCommit&&platformCommit.length>100)
  throw Error("معرّف Commit أطول من المسموح");

 const documents=[];

 for(const documentId of documentIds){
  const {data,error}=await db.functions.invoke("prime-knowledge-admin",{
   body:{
    action:"get_document",
    document_id:documentId
   }
  });

  if(error)throw error;
  if(data?.error)throw Error(data.error);

  const doc=data?.document;
  if(!doc||doc.status!=="approved")
   throw Error("أحد المستندات المختارة لم يعد معتمدًا");

  const listed=s.knowledgeDocs.find(x=>x.id===documentId);
  if(!listed||Number(listed.document_version)!==Number(doc.document_version))
   throw Error("تغيّرت نسخة أحد المستندات. حدّث البيانات وأعد المحاولة");

  const content=String(doc.content||"").trim();
  if(!content||content.length>100000)
   throw Error("محتوى المستند غير صالح أو يتجاوز الحد المسموح");

  const chunks=[];
  let current="";

  const paragraphs=content.split(/\n\s*\n/);

  for(const paragraph of paragraphs){
   const part=paragraph.trim();
   if(!part)continue;

   if(part.length>15000){
    if(current){
     chunks.push(current);
     current="";
    }

    for(let i=0;i<part.length;i+=15000){
     chunks.push(part.slice(i,i+15000));
    }
    continue;
   }

   if(current&&current.length+part.length+2>15000){
    chunks.push(current);
    current=part;
   }else{
    current=current?current+"\n\n"+part:part;
   }
  }

  if(current)chunks.push(current);

  if(!chunks.length||chunks.length>1000)
   throw Error("تعذّر تقسيم محتوى أحد المستندات");

  documents.push({
   id:doc.id,
   title:doc.title,
   slug:doc.slug,
   version:Number(doc.document_version),
   chunks
  });
 }

 const manifest=documents.map(doc=>({
  document_id:doc.id,
  document_version:doc.version,
  chunk_count:doc.chunks.length
 }));

 const created=await db.functions.invoke("prime-knowledge-admin",{
  body:{
   action:"create_release",
   release_version:releaseVersion,
   platform_commit:platformCommit,
   document_manifest:manifest
  }
 });

 if(created.error)throw created.error;
 if(created.data?.error)throw Error(created.data.error);
 if(!created.data?.success||!created.data?.release_id)
  throw Error("لم يتم تأكيد إنشاء مسودة الإصدار");

 const releaseId=created.data.release_id;
 let addedChunks=0;

 try{

   for(let i=0;i<doc.chunks.length;i++){

     body:{
      action:"add_chunk",
      release_id:releaseId,
      document_id:doc.id,
      document_version:doc.version,
      chunk_index:i,
      content:chunk,
      token_estimate:Math.ceil(chunk.length/4),
      metadata:{
       title:doc.title,
       slug:doc.slug,
       category:s.knowledgeDocs.find(x=>x.id===doc.id)?.category||null
      }
     }
    });

    if(result.error)throw result.error;
    if(result.data?.error)throw Error(result.data.error);
    if(!result.data?.success)throw Error("لم يتم تأكيد إضافة جزء من المحتوى");

    addedChunks++;
   }
  }
 }catch(chunkError){
  throw Error(
   "تم إنشاء الإصدار كمسودة، لكن تعذّرت إضافة جميع الأجزاء. "+
   "معرّف المسودة: "+releaseId+
   " — الأجزاء المضافة: "+addedChunks+
   ". لم يتم نشر الإصدار أو حذف المسودة."
  );
 }

 s.modal=null;
 await loadPrimeKnowledge();
 note("تم تجهيز الإصدار كمسودة وإضافة جميع أجزاء المحتوى. لم يتم نشره.", "success");
 return;
}

const waslaPendingActions = new Set();
const waslaPendingForms = new Set();
const waslaOriginalDisabled = new WeakMap();

function waslaActionKey(button) {
  return [
    button.dataset.a || "",
    button.dataset.id || "",
    button.dataset.next || "",
    button.dataset.decision || ""
  ].join("|");
}

function waslaSetPending(control, pending) {
  if (pending) {
    if (!waslaOriginalDisabled.has(control)) {
      waslaOriginalDisabled.set(control, !!control.disabled);
    }

    if ("disabled" in control) control.disabled = true;

    control.classList.add("wasla-action-pending");
    control.setAttribute("aria-busy", "true");
  } else {
    if (waslaOriginalDisabled.has(control)) {
      if ("disabled" in control) {
        control.disabled = waslaOriginalDisabled.get(control);
      }
      waslaOriginalDisabled.delete(control);
    }

    control.classList.remove("wasla-action-pending");
    control.removeAttribute("aria-busy");
  }
}

function waslaSyncPendingUI() {
  app.querySelectorAll("[data-a]").forEach(button => {
    waslaSetPending(
      button,
      waslaPendingActions.has(waslaActionKey(button))
    );
  });

  app.querySelectorAll("form[id]").forEach(form => {
    const pending = waslaPendingForms.has(form.id);

    form.querySelectorAll(
      'button[type="submit"], button:not([type]), input[type="submit"]'
    ).forEach(control => {
      waslaSetPending(control, pending);
    });
  });
}

const waslaPendingObserver = new MutationObserver(waslaSyncPendingUI);
waslaPendingObserver.observe(app, {
  childList: true,
  subtree: true

let chatMicSession=0;
let chatMicStarting=false;
let chatMicStopRequested=false;

function chatMicHaptic(){
 try{
  if(navigator.vibrate)navigator.vibrate(18);
 }catch(_){}
}

function resetChatMicButton(){
 const button=document.getElementById("chatMicButton");
 if(!button)return;

 button.title="تسجيل رسالة صوتية";
 button.classList.remove("is-recording");
 wcRecUi(false);
 wcSyncAction();
 button.setAttribute("aria-label","بدء التسجيل");
 button.style.background="";
 button.style.color="";
}

app.addEventListener("click",async e=>{
 const button=e.target.closest?.("#chatMicButton");
 if(!button)return;

 e.preventDefault();
 if(button.dataset.mode==="send"){
  const f=document.getElementById("sendMessage");
  if(f&&f.requestSubmit)f.requestSubmit();
  return;
 }

 // الضغطة الثانية أثناء انتظار إذن الميكروفون
 if(chatMicStarting){
  chatMicStopRequested=true;
  button.title="جاري إلغاء بدء التسجيل...";
  return;
 }

 // الضغطة الثانية أثناء التسجيل توقفه
 if(s.chatRecorder?.state==="recording"){
  chatMicStopRequested=true;
  s.chatRecorder.stop();
  return;
 }

 if(s.chatRecording)return;

 const session=++chatMicSession;
 chatMicStarting=true;
 chatMicStopRequested=false;
 chatMicHaptic();

 button.title="جاري تشغيل الميكروفون — اضغط للإلغاء";

 let stream=null;

 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
   throw Error("التسجيل الصوتي غير مدعوم في هذا المتصفح.");
  }

  stream=await navigator.mediaDevices.getUserMedia({audio:true});

  if(
   session!==chatMicSession||
   chatMicStopRequested||
   !document.getElementById("chatMicButton")
  ){
   stream.getTracks().forEach(track=>track.stop());

   if(session===chatMicSession){
    chatMicStarting=false;
    chatMicStopRequested=false;
    resetChatMicButton();
   }
   return;
  }

  const candidates=[
   "audio/webm;codecs=opus",
   "audio/ogg;codecs=opus",
   "audio/mp4"
  ];

  const selectedType=candidates.find(type=>
   MediaRecorder.isTypeSupported(type)
  );

  const recorder=selectedType
   ?new MediaRecorder(stream,{mimeType:selectedType})
   :new MediaRecorder(stream);

  const mimeType=(recorder.mimeType||selectedType||"audio/webm")
   .split(";")[0].toLowerCase();

  if(!["audio/webm","audio/ogg","audio/mp4"].includes(mimeType)){
   throw Error("صيغة التسجيل الصوتي غير مدعومة.");
  }

  const chunks=[];
  const startedAt=Date.now();

  recorder.addEventListener("dataavailable",event=>{
   if(event.data?.size)chunks.push(event.data);
  });

  recorder.addEventListener("stop",()=>{
   stream.getTracks().forEach(track=>track.stop());

   if(s.chatRecorder===recorder){
    s.chatRecorder=null;
    s.chatRecording=false;
   }

   if(session===chatMicSession){
    chatMicStarting=false;
    chatMicStopRequested=false;
    resetChatMicButton();
   }

   if(!chunks.length){
    note("لم يتم تسجيل صوت. حاول مرة أخرى.","error");
    return;
   }

   const extensions={
    "audio/webm":"webm",
    "audio/ogg":"ogg",
    "audio/mp4":"mp4"
   };

   const blob=new Blob(chunks,{type:mimeType});
   const file=new File(
    [blob],
    "voice-message-"+Date.now()+"."+extensions[mimeType],
    {type:mimeType,lastModified:Date.now()}
   );

   s.chatMediaDurationSeconds=Math.max(
    1,Math.round((Date.now()-startedAt)/1000)
   );

   const input=document.querySelector("#chatMediaInput");

   if(!input){
    s.chatAttachment=file;
    return;
   }

   const transfer=new DataTransfer();
   transfer.items.add(file);
   input.files=transfer.files;
   input.dispatchEvent(new Event("change",{bubbles:true}));
  });

  recorder.start(250);

  s.chatRecorder=recorder;
  s.chatRecording=true;
  chatMicStarting=false;

  const activeButton=document.getElementById("chatMicButton");

  if(activeButton){
   activeButton.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>';
   activeButton.classList.add("is-recording");
   wcRecUi(true);
   activeButton.title="اضغط لإيقاف التسجيل";
   activeButton.setAttribute("aria-label","إيقاف التسجيل");
  }

 }catch(error){
  stream?.getTracks().forEach(track=>track.stop());

  if(session===chatMicSession){
   chatMicStarting=false;
   chatMicStopRequested=false;
   s.chatRecorder=null;
   s.chatRecording=false;
   resetChatMicButton();
  }

  note(error.message||"تعذر بدء التسجيل الصوتي.","error");
 }
});


let chatLocationSending = false;

app.addEventListener("click", async e => {
  const button = e.target.closest?.("#chatLocationButton");
  if (!button) return;

  e.preventDefault();

  if (chatLocationSending) return;

  const conversationId = s.activeChat?.id;
  const senderId = s.user?.id;

  if (!conversationId || !senderId) {
    note("افتح محادثة نشطة أولًا.", "error");
    return;
  }

  chatLocationSending = true;
  button.disabled = true;
  button.setAttribute("aria-busy", "true");

  let saved = false;

  try {
    if (window.isSecureContext === false) {
      throw Error("مشاركة الموقع تتطلب فتح المنصة عبر اتصال آمن HTTPS.");
    }

    if (!navigator.geolocation) {
      throw Error("المتصفح لا يدعم تحديد الموقع.");
    }

    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 30000
        }
      );
    });

    if (
      s.activeChat?.id !== conversationId ||
      s.user?.id !== senderId
    ) {
      throw Error("تم تغيير المحادثة. افتح المحادثة المطلوبة وحاول مرة أخرى.");
    }

    const latitude = Number(position.coords.latitude);
    const longitude = Number(position.coords.longitude);

    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude) ||
      latitude < -90 ||
      latitude > 90 ||
      longitude < -180 ||
      longitude > 180
    ) {
      throw Error("تعذر الحصول على إحداثيات موقع صحيحة.");
    }

    const inserted = await db.from("messages").insert({
      conversation_id: conversationId,
      sender_id: senderId,
      message_text: "📍 تمت مشاركة الموقع",
      message_type: "location",
      attachment_path: null,
      attachment_mime_type: null,
      attachment_size_bytes: null,
      location_latitude: latitude,
      location_longitude: longitude
    });

    if (inserted.error) throw inserted.error;

    saved = true;

    if (s.activeChat?.id !== conversationId) {
      note("تم إرسال موقعك بنجاح.", "success");
      return;
    }

    const q = await db.from("messages")
      .select("id,sender_id,message_text,is_read,created_at,message_type,attachment_path,attachment_mime_type,attachment_size_bytes,media_duration_seconds,location_latitude,location_longitude,delivered_at,thumbnail_path,attachment_name")
      .eq("conversation_id", conversationId)
      .order("created_at");

    if (q.error) {
      note("تم إرسال الموقع، لكن تعذر تحديث عرض الرسائل. أعد فتح المحادثة.", "success");
      return;
    }

    s.messages = q.data || [];
    await loadChatMediaUrls(s.messages);

    render();
    note("تم إرسال موقعك بنجاح.", "success");

  } catch (error) {
    if (saved) {
      note("تم إرسال الموقع، لكن تعذر تحديث عرض المحادثة.", "success");
    } else if (error.code === 1) {
      note("لم تسمح بمشاركة الموقع. يمكنك تفعيل إذن الموقع من إعدادات المتصفح.", "error");
    } else if (error.code === 2) {
      note("تعذر تحديد موقعك حاليًا. حاول مرة أخرى.", "error");
    } else if (error.code === 3) {
      note("انتهت مهلة تحديد الموقع. حاول مرة أخرى.", "error");
    } else {
      note(error.message || "تعذر إرسال الموقع.", "error");
    }
  } finally {
    chatLocationSending = false;

    const currentButton = document.getElementById("chatLocationButton");
    if (currentButton) {
      currentButton.disabled = false;
      currentButton.removeAttribute("aria-busy");
    }
  }
});
      
app.addEventListener("click", async e => {

  // إظهار وإخفاء كلمة المرور
  const passwordToggle = e.target.closest("[data-password-toggle]");
  if (passwordToggle) {
    const passwordInput =
      passwordToggle.parentElement.querySelector('input[name="password"]');

    if (passwordInput) {
      const showPassword = passwordInput.type === "password";
      passwordInput.type = showPassword ? "text" : "password";
      passwordToggle.textContent = showPassword ? "إخفاء" : "إظهار";
      passwordToggle.setAttribute(
        "aria-label",
        showPassword ? "إخفاء كلمة المرور" : "إظهار كلمة المرور"
      );
      passwordToggle.setAttribute("aria-pressed", String(showPassword));
    }
    return;
  }

  // إغلاق النافذة عند الضغط على الخلفية
  if (s.modal && e.target.classList.contains("modalback")) {
    s.modal = null;
    render();
    return;
  }

  const button = e.target.closest("[data-a]");
  if (!button) return;

  // إغلاق النافذة عند اختيار إجراء خارجها
  if (s.modal && !button.closest(".modal")) {
    s.modal = null;
  }

  const key = waslaActionKey(button);
  if (waslaPendingActions.has(key)) return;

  waslaPendingActions.add(key);
  waslaSyncPendingUI();

  try {
    await action(button.dataset.a, button.dataset.id, button);
  } finally {
    waslaPendingActions.delete(key);
    waslaSyncPendingUI();
  }
});


app.addEventListener("submit", async e => {
  const form = e.target;
  if (!form?.id) return;

  if (waslaPendingForms.has(form.id)) {
    e.preventDefault();
    return;
  }

  waslaPendingForms.add(form.id);
  waslaSyncPendingUI();

  try {
    await submit(e);
  } finally {
    waslaPendingForms.delete(form.id);
    waslaSyncPendingUI();
  }
});

 if(recoveryMode)s.mode="recovery";

 try{

   publicData(),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),15000))
  ]);
 }catch(e){

 }

  return;
 }

   }

  await loadUser(r.data.session.user);
 }else{
  s.mode="welcome";
  render();
 }

 db.auth.onAuthStateChange((event,session)=>{

  }
  else if(!session){
   s.user=null;
   s.profile=null;
   s.provider=null;
   if(s.staffSuspended)return;
   if(s.mode!=="recovery")render();
  }
 });
}

boot().catch(e=>{console.error(e);app.innerHTML='<main class="wrap">'+empty("تعذّر تحميل المنصة. تحقق من الاتصال ثم أعد المحاولة.")+'</main>'});

<script>
(() => {
  const root = document.documentElement;
  const app = document.getElementById("app");
  if (!app) return;

  let mode = "light";

  try {
    mode = localStorage.getItem("wasla_color_mode") === "dark"
      ? "dark"
      : "light";
  } catch (e) {}

  const applyTheme = () => {
  root.setAttribute("data-theme", mode);

  try {
    localStorage.setItem("wasla_color_mode", mode);
    localStorage.removeItem("wasla_theme_draft");
  } catch (e) {}

  const button = app.querySelector(".theme-toggle");

  if (button) {
    button.textContent = mode === "dark" ? "☀" : "☾";

    button.setAttribute(
      "aria-label",
      mode === "dark" ? "التبديل للوضع النهاري" : "التبديل للوضع الليلي"
    );

    button.setAttribute(
      "title",
      mode === "dark" ? "الوضع النهاري" : "الوضع الليلي"
    );
  }
};

const addButton = () => {
  const header = app.querySelector(".topline");
  const welcome = app.querySelector(".wasla-welcome");
  const target = header || welcome;

  if (!target || target.querySelector(".theme-toggle")) return;

  const button = document.createElement("button");
  button.type = "button";
  button.className = "theme-toggle";
  button.setAttribute("aria-label", "تبديل الوضع");

  button.addEventListener("click", () => {
    mode = mode === "dark" ? "light" : "dark";
    applyTheme();
    try { window.waslaThemeSync && window.waslaThemeSync.mode(mode); } catch (e) {}
  });

  if (header) {
    const brand = header.querySelector(".brand-lockup");

    if (brand) {
      brand.insertAdjacentElement("afterend", button);
    } else {
      header.appendChild(button);
    }
  } else {
    welcome.prepend(button);
  }

  applyTheme();
};

  window.__waslaSetMode = (m) => {
    const nm = m === "dark" ? "dark" : "light";
    if (nm === mode) return;
    mode = nm;
    applyTheme();
  };

  applyTheme();
  addButton();

  new MutationObserver(addButton).observe(app, {
    childList: true,
    subtree: true
  });
})();
