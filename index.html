}

  --surface-shadow: none;
}

/* WASLA - Default Theme Variables */
body{background:var(--bg-main);color:var(--text-primary)}
.card,.item,.modal,.empty{
  background:var(--bg-surface);
  color:var(--text-primary);
  border-color:var(--border-color);
}
.card h3,.sectionhead h2{color:var(--text-primary)}
.field input,.field select,.field textarea{
  background:var(--bg-surface);
  color:var(--text-primary);
  border-color:var(--border-color);
}
.tabs button{
  background:var(--bg-surface);
  color:var(--text-primary);
  border-color:var(--border-color);
}
.btn.light{background:var(--border-color);color:var(--text-primary)}
.btn.danger{background:var(--bg-surface);color:var(--danger)}
.icon,.avatar{background:var(--border-color);color:var(--text-primary)}
.notice{background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-color)}
 

.notice.error{background:var(--bg-surface);color:var(--danger);border-color:var(--danger)}
.notice.success{background:var(--bg-surface);color:var(--success);border-color:var(--success)}
.tag{background:var(--border-color);color:var(--text-primary)}
.tag.ok{background:var(--bg-surface);color:var(--success)}
.tag.wait{background:var(--bg-surface);color:var(--accent)}
.tag.bad{background:var(--bg-surface);color:var(--danger)}
 
.empty{border-color:var(--border-color)}

/* WASLA - UI Polish */
.btn{
  transition:background .2s ease,transform .2s ease,box-shadow .2s ease;
}
.btn:not(:disabled):hover{
  transform:translateY(-2px);
  box-shadow:0 5px 14px #0005;
}
.btn.gold:hover{
  background:var(--accent);
}
.card,.item{
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.card:hover,.item:hover{
  border-color:var(--primary-hover);
  box-shadow:0 5px 18px #0003;
}
.tabs button.active,.nav button.active{
  background:var(--primary-hover);
  color:var(--bg-surface);
  border-color:var(--primary-hover);
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;
  border-color:var(--primary-hover);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary-hover) 18%,transparent);
}
button:focus-visible{
  outline:2px solid var(--primary-hover);
  outline-offset:3px;
}
hr{
  border:0;
  border-top:1px solid var(--border-color);
}
::selection{
  background:var(--border-color);
  color:var(--text-primary);
}
 
/* WASLA - Navigation Design */
.top .nav{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  margin:14px 0 0;
  padding:5px 0;
}

.top .nav button{
  flex:0 0 auto;
  min-height:40px;
  padding:8px 17px;
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  border-radius:12px;
  background:color-mix(in srgb,var(--primary-hover) 85%,transparent);
  color:var(--accent);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:all .2s ease;
}

.top .nav button:hover{
  background:var(--primary-hover);
  border-color:var(--accent);
  transform:translateY(-2px);
}

.top .nav button.active{
  background:var(--accent);
  color:var(--bg-main);
  border-color:var(--accent);
  box-shadow:0 3px 12px color-mix(in srgb,var(--accent) 25%,transparent);
}

}

/* WASLA - Unified Button Polish */
.btn,
.tabs button,
.top .nav button{
  min-height:40px;
  border-radius:12px;
  font-weight:700;
  transition:background .2s ease,
             color .2s ease,

             transform .2s ease,

}

.btn{
  padding:9px 17px;

.btn:not(:disabled):active,
.tabs button:not(:disabled):active,

  transform:scale(.97);
}

.btn:disabled,
.tabs button:disabled,
.top .nav button:disabled{
  opacity:.5;
  cursor:not-allowed;
  box-shadow:none;
  transform:none;
}

.btn.gold{
  background:var(--accent);

  }

async function auditEvent(action,entityTable="application",entityId=null,result="success",metadata={}){
 try{
  if(!s.user)return;
  const {error}=await db.rpc("record_audit_event",{
   p_action:action,
   p_entity_table:entityTable,
   p_entity_id:entityId?String(entityId):null,
   p_result:result,
   p_metadata:metadata
  });
  if(error)console.warn("Audit log failed:",error.message);
 }catch(e){
  console.warn("Audit log failed:",e);
 }
}

      function requestList(provider){
 return s.requests.map(q=>{const own=q.provider_id===s.provider?.id;let a="";
 if(provider&&q.status==="pending"&&!q.provider_id)a=btn("claim","قبول الطلب","green",q.id);
 if(provider&&own&&q.status==="accepted")a=btn("advance","بدء التنفيذ","gold",q.id,"data-next='in_progress'");
 if(provider&&own&&q.status==="in_progress")a=btn("advance","إنهاء الطلب","green",q.id,"data-next='completed'");
 if(provider&&q.provider_id&&!own)return "";
 return '<article class="item"><div class="row"><b>'+esc(q.title||q.services?.name_ar||"طلب خدمة")+'</b>'+tag(q.status)+'</div><p>'+esc([q.city,q.country].filter(Boolean).join("، "))+'</p><p>'+esc(q.description||"")+'</p><p>الميزانية: '+(q.budget?fmt(q.budget):"غير محددة")+'</p><div class="actions">'+a+(!provider&&["pending","accepted"].includes(q.status)?btn("cancelrequest","إلغاء الطلب","danger",q.id):"")+(q.status==="completed"&&q.provider_id&&!provider?btn("review","تقييم الخدمة","light",q.id):"")+(q.provider_id&&["accepted","in_progress"].includes(q.status)&&(!provider||s.chats.some(c=>c.request_id===q.id))?btn("chat","محادثة","light",q.id):"")+'</div></article>';
 }).join("")||empty("لا توجد طلبات حتى الآن");
}

      async function resumePrimeKnowledgeRelease(releaseId){
 if(s.profile?.role!=="owner")
  throw Error("استكمال الإصدارات متاح للمالك فقط");

 const release=s.knowledgeReleases.find(x=>x.id===releaseId);

 if(!release||release.status!=="draft")
  throw Error("مسودة الإصدار غير موجودة أو لم تعد قابلة للاستكمال");

 const manifest=release.document_manifest;

 if(!Array.isArray(manifest)||!manifest.length||manifest.length>100)
  throw Error("قائمة مستندات الإصدار غير صالحة");

 const seen=new Set();

 for(const entry of manifest){
  if(!entry||typeof entry!=="object"||
     typeof entry.document_id!=="string"||
     !Number.isInteger(Number(entry.document_version))||
     Number(entry.document_version)<1||
     !Number.isInteger(Number(entry.chunk_count))||
     Number(entry.chunk_count)<1||
     Number(entry.chunk_count)>1000)
   throw Error("بيانات أحد مستندات الإصدار غير صالحة");

  if(seen.has(entry.document_id))
   throw Error("الإصدار يحتوي على مستند مكرر");

  seen.add(entry.document_id);

  const {data,error}=await db.functions.invoke("prime-knowledge-admin",{
   body:{
    action:"get_document",
    document_id:entry.document_id
   }
  });

  if(error)throw error;
  if(data?.error)throw Error(data.error);

  const doc=data?.document;

  if(!doc||doc.status!=="approved"||
     Number(doc.document_version)!==Number(entry.document_version))
   throw Error("أحد المستندات لم يعد معتمدًا بنفس النسخة. لن يتم استكمال الإصدار.");

  const content=String(doc.content||"").trim();

  if(!content||content.length>100000)
   throw Error("محتوى أحد المستندات غير صالح");

  const chunks=[];
  let current="";

  const paragraphs=content.split(/\n\s*\n/);

  for(const paragraph of paragraphs){
   const part=paragraph.trim();
   if(!part)continue;

   if(part.length>15000){
    if(current){
     chunks.push(current);
     current="";
    }

    for(let i=0;i<part.length;i+=15000){
     chunks.push(part.slice(i,i+15000));
    }
    continue;
   }

   if(current&&current.length+part.length+2>15000){
    chunks.push(current);
    current=part;
   }else{
    current=current?current+"\n\n"+part:part;
   }
  }

  if(current)chunks.push(current);

  if(chunks.length!==Number(entry.chunk_count))
   throw Error("عدد أجزاء المستند تغيّر. أوقفنا الاستكمال لحماية الإصدار.");

  for(let i=0;i<chunks.length;i++){
   const result=await db.functions.invoke("prime-knowledge-admin",{
    body:{
     action:"add_chunk",
     release_id:releaseId,
     document_id:doc.id,
     document_version:Number(entry.document_version),
     chunk_index:i,
     content:chunks[i],
     token_estimate:Math.ceil(chunks[i].length/4),
     metadata:{
      title:doc.title,
      slug:doc.slug,
      category:doc.category
     }
    }
   });

   if(result.error)throw result.error;
   if(result.data?.error)throw Error(result.data.error);
   if(!result.data?.success)
    throw Error("لم يتم تأكيد استكمال أحد أجزاء المحتوى");
  }
 }

 await loadPrimeKnowledge();

 note("تم استكمال تجهيز الإصدار كمسودة. لم يتم نشره.","success");
  }

async function prepareServiceImage(file){
 if(!file)return null;

 if(!["image/jpeg","image/png","image/webp"].includes(file.type))
  throw Error("اختار صورة JPG أو PNG أو WebP");

 if(typeof createImageBitmap!=="function")
  throw Error("المتصفح لا يدعم ضغط الصور. جرّب Chrome محدث.");

 const bitmap=await createImageBitmap(file);
 const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));

 const canvas=document.createElement("canvas");
 canvas.width=Math.max(1,Math.round(bitmap.width*scale));
 canvas.height=Math.max(1,Math.round(bitmap.height*scale));

 const ctx=canvas.getContext("2d");
 ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
 bitmap.close?.();

 const blob=await new Promise(resolve=>
  canvas.toBlob(resolve,"image/webp",.82)
 );

 if(!blob)throw Error("تعذّر تجهيز الصورة");
 if(blob.size>4*1024*1024)
  throw Error("حجم الصورة بعد الضغط أكبر من 4 ميجابايت");

 return new File([blob],"service-"+Date.now()+".webp",{
  type:"image/webp"
 });
}

async function saveServiceImage(serviceId,file,oldUrl){
 const imageFile=await prepareServiceImage(file);
 if(!imageFile)return null;

 const path="services/"+serviceId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+".webp";
 const bucket=db.storage.from("service-images");

 const uploaded=await bucket.upload(path,imageFile,{
  contentType:"image/webp",
  cacheControl:"31536000",
  upsert:false
 });

 if(uploaded.error)throw uploaded.error;

 const publicUrl=bucket.getPublicUrl(path).data.publicUrl;

 const updated=await db.rpc("admin_set_service_image",{
 p_service_id:serviceId,
 p_image_url:publicUrl
});

if(updated.error){
 await bucket.remove([path]);
 throw updated.error;
}
 const marker="/storage/v1/object/public/service-images/";

 if(oldUrl&&String(oldUrl).includes(marker)){
  const oldPath=decodeURIComponent(String(oldUrl).split(marker).pop());

  if(oldPath.startsWith("services/")&&oldPath!==path)
   await bucket.remove([oldPath]);
 }

 return publicUrl;
}

function vals(f){

}

   }

    chunks.push(current);
    current=part;
   }else{

   }
  }

  documents.push({

   title:doc.title,

  });

 if(!file)throw Error("اختر صورة أولًا");

 if(!["image/jpeg","image/png","image/webp"].includes(file.type))
  throw Error("اختار صورة JPG أو PNG أو WEBP");

 if(file.size>5*1024*1024)
  throw Error("حجم الصورة يجب ألا يتجاوز 5 ميجابايت");

 if(typeof createImageBitmap!=="function")
  throw Error("المتصفح لا يدعم معالجة الصور. حدّث Chrome.");

 const bitmap=await createImageBitmap(file);
 const scale=Math.min(1,512/Math.max(bitmap.width,bitmap.height));

 const canvas=document.createElement("canvas");
 canvas.width=Math.max(1,Math.round(bitmap.width*scale));
 canvas.height=Math.max(1,Math.round(bitmap.height*scale));

 const ctx=canvas.getContext("2d");
 ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
 bitmap.close?.();

 const imageBlob=await new Promise(resolve=>
  canvas.toBlob(resolve,"image/webp",.85)
 );

 if(!imageBlob)throw Error("تعذّر تجهيز الصورة");
 if(imageBlob.size>5*1024*1024)
  throw Error("حجم الصورة بعد المعالجة كبير جدًا");

 const bucket=db.storage.from("profile-photos");
 const oldUrl=s.profile.avatar_url||"";
 const path=s.user.id+"/avatar-"+Date.now()+".webp";

 const uploaded=await bucket.upload(path,imageBlob,{
  contentType:"image/webp",
  cacheControl:"31536000",
  upsert:false
 });

 if(uploaded.error)throw uploaded.error;

 const publicUrl=bucket.getPublicUrl(path).data.publicUrl;

 const updated=await db.rpc("update_own_profile",{
  p_patch:{avatar_url:publicUrl}
});

 if(updated.error){
  await bucket.remove([path]);
  throw updated.error;
 }

 s.profile.avatar_url=publicUrl;

 const marker="/storage/v1/object/public/profile-photos/";

 if(oldUrl&&oldUrl.includes(marker)){
  try{
   const oldPath=decodeURIComponent(oldUrl.split(marker).pop());

   if(oldPath.startsWith(s.user.id+"/")&&oldPath!==path)
    await bucket.remove([oldPath]);
  }catch(e){
   console.warn("تعذّر حذف الصورة القديمة:",e);
  }
 }

 await auditEvent(
  "PROFILE_PHOTO_UPDATED",

  "success",
  {content_type:"image/webp",size_bytes:imageBlob.size}
 );

 render();
 note("تم تحديث الصورة الشخصية بنجاح.","success");
 return;
}

  if(a==="advance"){let r=await db.rpc("advance_service_request",{p_request_id:id,p_next_status:b.dataset.next});if(r.error)throw r.error;await loadUser(s.user);note("تم تحديث حالة الطلب.","success");return}
  if(a==="availability"){let r=await db.rpc("toggle_own_provider_availability");if(r.error)throw r.error;await loadUser(s.user);note("تم تحديث التوفر.","success");return}
  if(a==="toggleoffer"){let r=await db.rpc("toggle_own_provider_service",{p_provider_service_id:id});if(r.error)throw r.error;await loadUser(s.user);return}
  if(a==="reviewprovider"){let r=await db.rpc("admin_review_provider_application",{p_user_id:id,p_decision:b.dataset.decision});if(r.error)throw r.error;await loadUser(s.user);note("تم تحديث طلب الانضمام.","success");return}
 if(a==="toggleservice"){let r=await db.rpc("toggle_service_active",{p_service_id:id});if(r.error)throw r.error;await loadUser(s.user);note("تم تحديث الخدمة.","success");return}
  if(a==="togglecategory"){let r=await db.rpc("toggle_category_active",{p_category_id:id});if(r.error)throw r.error;await loadUser(s.user);note("تم تحديث التصنيف.","success");return}
 }catch(x){console.error(x);note(x.message||"تعذّر تنفيذ العملية.","error")}
}
app.addEventListener("click",e=>{let b=e.target.closest("[data-a]");if(!b)return;if(b.dataset.a==="close"&&e.target!==b&&e.target.closest(".modal"))return;action(b.dataset.a,b.dataset.id,b)});
app.addEventListener("submit",submit);
app.addEventListener("change",async e=>{
 if(e.target.name==="account_type"){
  s.type=e.target.value;
  const extra=document.getElementById("providerExtra");
  if(extra)extra.classList.toggle("hidden",s.type!=="provider");
 }

 if(e.target.name==="city_id"){
  const form=e.target.closest("#signup");
  if(!form)return;

  const citySelect=e.target;
  const countryId=form.elements.country_id.value;
  const cityId=citySelect.value;
  const areaSelect=form.elements.area_id;
  const areaStatus=form.querySelector("#geoAreaStatus");

  areaSelect.disabled=true;
  areaSelect.innerHTML='<option value="">'+(cityId?"جاري تحميل الأقسام...":"اختر المحافظة أولاً")+'</option>';

  if(!cityId){
   s.geo.areas=[];
   if(areaStatus)areaStatus.textContent="اختر المحافظة أولاً";
   return;
  }

  citySelect.disabled=true;
  if(areaStatus)areaStatus.textContent="جاري تحميل الأقسام...";

  try{
   await loadGeoCatalog(countryId,cityId);

   const areas=s.geo.areas.filter(x=>x.city_id===cityId);

   areaSelect.innerHTML='<option value="">اختر القسم / المركز</option>'+
    areas.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name_ar)+'</option>').join("");

   areaSelect.disabled=areas.length===0;
   if(areaStatus)areaStatus.textContent=areas.length?"اختر القسم / المركز":"لا توجد أقسام نشطة لهذه المحافظة";
  }catch(error){
   console.warn("Geo areas loading failed:",error);
   areaSelect.innerHTML='<option value="">تعذر تحميل الأقسام</option>';
   if(areaStatus)areaStatus.textContent="تعذر تحميل الأقسام. حاول اختيار المحافظة مرة أخرى.";
  }finally{
   citySelect.disabled=false;
  }
 }
});
app.addEventListener("input",e=>{if(e.target.id==="search"){s.filter=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById("search");if(n){n.focus();n.setSelectionRange(pos,pos)}}});
async function boot(){
 const status=t=>{
  app.innerHTML='<main class="wrap"><div class="empty">'+t+'</div></main>';
 };
 const recoveryMode=new URLSearchParams(location.search).get("mode")==="recovery"||new URLSearchParams(location.hash.slice(1)).get("type")==="recovery";
 if(recoveryMode)s.mode="recovery";

 try{
  await Promise.race([
   publicData(),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),15000))
  ]);
 }catch(e){
  status("توقف التحميل في المرحلة 1: بيانات الخدمات والتصنيفات.");
  return;
 }

 try{
  await loadGeoCatalog();
 }catch(e){
  console.warn("Geo catalog loading failed:",e);
 }

 let r;
 try{
  r=await Promise.race([
   db.auth.getSession(),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),15000))
  ]);
 }catch(e){
  status("توقف التحميل في المرحلة 2: جلسة تسجيل الدخول.");
  return;
 }

 if(recoveryMode){
  s.mode="recovery";
  render();
 }else if(r.data.session?.user){
  
  await loadUser(r.data.session.user);
 }else{
  s.mode="welcome";
  render();
 }

 db.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY"||(recoveryMode&&session?.user)){
   s.mode="recovery";
   render();
   return;
  }
  if(session?.user&&session.user.id!==s.user?.id)loadUser(session.user);
  else if(!session){
   s.user=null;
   s.profile=null;
   s.provider=null;
   if(s.mode!=="recovery")render();
  }
 });
}

boot().catch(e=>{console.error(e);app.innerHTML='<main class="wrap">'+empty("تعذّر تحميل المنصة. تحقق من الاتصال ثم أعد المحاولة.")+'</main>'});
})();
</script>
<style>
.theme-toggle {
  border: 1px solid var(--border-color);
  background: var(--bg-subtle);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 8px 12px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.theme-toggle:hover {
  background: var(--primary);
  color: #fff;
}
</style>

<script>
(() => {
  const root = document.documentElement;
  const app = document.getElementById("app");
  if (!app) return;

  let mode = "light";

  try {
    mode = localStorage.getItem("wasla_color_mode") === "dark"
      ? "dark"
      : "light";
  } catch (e) {}

  const applyTheme = () => {
  root.setAttribute("data-theme", mode);

  try {
    localStorage.setItem("wasla_color_mode", mode);
    localStorage.removeItem("wasla_theme_draft");
  } catch (e) {}

  const button = app.querySelector(".theme-toggle");

  if (button) {
    button.textContent = mode === "dark" ? "☀" : "☾";

    button.setAttribute(
      "aria-label",
      mode === "dark" ? "التبديل للوضع النهاري" : "التبديل للوضع الليلي"
    );

    button.setAttribute(
      "title",
      mode === "dark" ? "الوضع النهاري" : "الوضع الليلي"
    );
  }
};

const addButton = () => {
  const header = app.querySelector(".topline");
  const welcome = app.querySelector(".wasla-welcome");
  const target = header || welcome;

  if (!target || target.querySelector(".theme-toggle")) return;

  const button = document.createElement("button");
  button.type = "button";
  button.className = "theme-toggle";
  button.setAttribute("aria-label", "تبديل الوضع");

  button.addEventListener("click", () => {
    mode = mode === "dark" ? "light" : "dark";
    applyTheme();
  });

  if (header) {
    const brand = header.querySelector(".brand-lockup");

    if (brand) {
      brand.insertAdjacentElement("afterend", button);
    } else {
      header.appendChild(button);
    }
  } else {
    welcome.prepend(button);
  }

  applyTheme();
};

  applyTheme();
  addButton();

  new MutationObserver(addButton).observe(app, {
    childList: true,
    subtree: true
  });
})();
 
</script>
</body></html>
