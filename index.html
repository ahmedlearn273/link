hite}.nav button{border:1px solid #ffffff40;background:#ffffff16;color:white;border-radius:9px;padding:6px 10px}.notice{padding:10px 13px;border-radius:10px;margin:10px 0;background:#e8f3f7;color:#24536a}.notice.error{background:#fff0f0;color:#a53030}.notice.success{background:#e9f7ef;color:#176c4b}.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#edf3f6;font-size:12px;color:#476170}.tag.ok{background:#e6f5ee;color:#14754f}.tag.wait{background:#fff4dd;color:#956b12}.tag.bad{background:#ffeded;color:#ad3333}.list{display:grid;gap:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions .btn{font-size:12px;padding:7px 10px}.empty{text-align:center;padding:24px;color:var(--muted);background:white;border:1px dashed #cbd7df;border-radius:14px}.muted,.small{color:var(--muted);font-size:12px}.stat{font-size:25px;font-weight:800}.provider{display:flex;gap:10px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#e7eff3;font-weight:800}.price{color:var(--green);font-weight:800}.modalback{position:fixed;inset:0;background:#07192399;display:grid;place-items:center;padding:14px;z-index:10}.modal{width:min(100%,510px);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:17px}.foot{text-align:center;padding:22px;color:var(--muted);font-size:12px}

<body><div id="app"><main class="wrap"><div class="empty">جاري تحميل المنصة...</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{"use strict";
const db=window.supabase.createClient("https://hnnomaiohwyuqpfzlcol.supabase.co","sb_publishable_I4IfNkGvcxDxzz3xdGeKxw_TAzgc3ck"),app=document.getElementById("app");
const s={user:null,profile:null,provider:null,mode:"welcome",type:"customer",tab:"home",cats:[],services:[],providers:[],requests:[],offers:[],apps:[],allRequests:[],adminProfiles:[],staff:[],staffCandidates:[],chats:[],messages:[],activeChat:null,notice:"",noticeType:"",modal:null,filter:""};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fmt=x=>Number(x||0).toLocaleString("ar-SA");
function note(x,t){s.notice=x;s.noticeType=t||"";render()}
function tag(x){let a={pending:["قيد المراجعة","wait"],accepted:["مقبول","ok"],in_progress:["قيد التنفيذ","wait"],completed:["مكتمل","ok"],cancelled:["ملغي","bad"],approved:["موثّق","ok"],rejected:["مرفوض","bad"]}[x]||[x||"—",""];return '<span class="tag '+a[1]+'">'+a[0]+'</span>'}
function header(sub,nav){return '<header class="top"><div class="topline"><div><div class="brand">منصة <span>الخدمات</span></div><p>'+esc(sub||"خدمات موثوقة في مكان واحد")+'</p></div>'+(nav?'<div class="nav">'+nav+'</div>':'')+'</div></header>'}
function msg(){return s.notice?'<div class="notice '+(s.noticeType==="error"?"error":s.noticeType==="success"?"success":"")+'">'+esc(s.notice)+'</div>':""}
function btn(a,t,k,id,extra){return '<button class="btn '+(k||"")+'" data-a="'+a+'" data-id="'+esc(id||"")+'" '+(extra||"")+'>'+t+'</button>'}
function field(l,n,type,ph,v,req){return '<label class="field">'+l+'<input name="'+n+'" type="'+(type||"text")+'" placeholder="'+esc(ph||"")+'" value="'+esc(v||"")+'" '+(req?"required":"")+'></label>'}
function select(l,n,opts,v){return '<label class="field">'+l+'<select name="'+n+'">'+opts.map(o=>'<option value="'+esc(o.value)+'" '+(String(o.value)===String(v)?"selected":"")+'>'+esc(o.label)+'</option>').join("")+'</select></label>'}
function empty(x){return '<div class="empty">'+esc(x)+'</div>'}
async function publicData(includeInactive=false){
 let serviceQuery=db.from("services").select("id,category_id,name_ar,description,is_active").order("sort_order");
 if(!includeInactive)serviceQuery=serviceQuery.eq("is_active",true);
 const [c,v,p]=await Promise.all([
  (()=>{let q=db.from("categories").select("id,name_ar,slug,icon,description,is_active").order("sort_order");return includeInactive?q:q.eq("is_active",true)})(),
  serviceQuery,
  db.from("provider_profiles").select("id,user_id,display_name,bio,experience_years,country,city,average_rating,total_reviews,is_available,provider_services(id,service_id,price,currency,price_type,is_active,services(id,name_ar))").eq("verification_status","approved")
 ]);
 s.cats=c.data||[];s.services=v.data||[];s.providers=p.data||[];
}
async function loadUser(u){
 s.user=u;s.profile=null;s.provider=null;s.notice="";
 if(!u){render();return}
 let {data:p,error}=await db.from("profiles").select("*").eq("id",u.id).maybeSingle();
 if(error||!p){console.error(error);note("تعذّر تحميل ملف الحساب.","error");return}
 if(p.status!=="active"){
  s.profile=p;
  app.innerHTML=header("حالة الحساب")+'<main class="wrap"><div class="card"><h2>الحساب غير نشط</h2><p>حالة حسابك الحالية: '+esc(p.status)+'</p><p>يرجى التواصل مع إدارة المنصة.</p>'+btn("logout","تسجيل الخروج","light")+'</div></main>';
  return;
 }
 const m=u.user_metadata||{},patch={};["full_name","phone","country","city","address"].forEach(k=>{if(!p[k]&&m[k])patch[k]=m[k]});
 if(Object.keys(patch).length){await db.from("profiles").update(patch).eq("id",u.id);Object.assign(p,patch)}
 s.profile=p;
 let {data:pp}=await db.from("provider_profiles").select("*").eq("user_id",u.id).maybeSingle();
 if(!pp&&m.account_type==="provider"){
  const r=await db.from("provider_profiles").insert({user_id:u.id,display_name:p.full_name||"مزوّد خدمة",bio:m.bio||null,experience_years:Number(m.experience_years||0),country:p.country,city:p.city,service_area:m.service_area||null,verification_status:"pending",is_available:false}).select("*").single();
  if(!r.error)pp=r.data;else console.error(r.error);
 }
 s.provider=pp||null;await publicData(p.role==="admin");s.requests=[];s.offers=[];s.apps=[];s.allRequests=[];s.adminProfiles=[];s.chats=[];s.messages=[];s.activeChat=null;
 if(p.role==="customer"){
  const [r,ch]=await Promise.all([db.from("service_requests").select("*,services(name_ar),provider_profiles(display_name,city)").eq("customer_id",u.id).order("created_at",{ascending:false}),db.from("conversations").select("id,request_id,customer_id,provider_id,last_message_at,service_requests(title)").eq("customer_id",u.id).order("last_message_at",{ascending:false})]);
  s.requests=r.data||[];s.chats=ch.data||[];
 }else if(p.role==="provider"&&pp){
  const [r,o,ch]=await Promise.all([db.from("service_requests").select("*,services(name_ar)").or("provider_id.eq."+pp.id+",provider_id.is.null").order("created_at",{ascending:false}),db.from("provider_services").select("*,services(name_ar)").eq("provider_id",pp.id),db.from("conversations").select("id,request_id,customer_id,provider_id,last_message_at,service_requests(title)").eq("provider_id",pp.id).order("last_message_at",{ascending:false})]);
  s.requests=r.data||[];s.offers=o.data||[];s.chats=ch.data||[];
}else if(p.role==="admin"){
  const [a,r,profiles,permissions]=await Promise.all([
    db.from("provider_profiles").select("*").eq("verification_status","pending").order("created_at",{ascending:false}),
    db.from("service_requests").select("*,services(name_ar)").order("created_at",{ascending:false}).limit(100),
    db.from("profiles").select("id,full_name,phone,city,country,role,status").in("role",["customer","staff"]),
    db.from("staff_permissions").select("*")
  ]);
  if(a.error)throw a.error;
  if(r.error)throw r.error;
  if(profiles.error)throw profiles.error;
  if(permissions.error)throw permissions.error;
  s.apps=a.data||[];
  s.allRequests=r.data||[];
  const people=profiles.data||[];
  const perms=permissions.data||[];
  s.staff=people.filter(x=>x.role==="staff").map(x=>({...x,staff_permissions:perms.find(p=>p.user_id===x.id)||null}));
  s.staffCandidates=people.filter(x=>x.role==="customer"&&x.status==="active");
  const ids=[...new Set(s.apps.map(x=>x.user_id).concat(s.allRequests.map(x=>x.customer_id)))];
  if(ids.length){
    const x=await db.from("profiles").select("id,full_name,phone,city,country").in("id",ids);
    s.adminProfiles=x.data||[];
  }
}
 render();
}
function authView(){
 const signup=s.mode==="signup";
 return header("تسجيل موحّد بالبريد الإلكتروني")+'<main class="wrap"><div class="auth"><div class="card"><div class="sectionhead"><h2>'+(signup?"إنشاء حساب":"تسجيل الدخول")+'</h2><span class="tag">آمن</span></div>'+msg()+'<div class="tabs"><button data-a="mode" data-id="login" class="'+(!signup?"active":"")+'">دخول</button><button data-a="mode" data-id="signup" class="'+(signup?"active":"")+'">حساب جديد</button></div>'+
 (signup?'<form id="signup">'+field("الاسم الكامل","full_name","text","اسمك","",true)+field("البريد الإلكتروني","email","email","name@example.com","",true)+field("كلمة المرور","password","password","8 أحرف على الأقل","",true)+field("الهاتف (اختياري)","phone","tel","رقم التواصل","",false)+field("الدولة","country","text","الدولة","",true)+field("المدينة","city","text","المدينة","",true)+select("نوع الحساب","account_type",[{value:"customer",label:"عميل"},{value:"provider",label:"مزوّد خدمة"}],s.type)+'<div id="providerExtra" class="'+(s.type==="provider"?"":"hidden")+'">'+field("سنوات الخبرة","experience_years","number","سنوات الخبرة","",false)+field("نبذة","bio","text","نبذة عن خبرتك","",false)+field("نطاق الخدمة","service_area","text","الأحياء التي تخدمها","",false)+'</div><button class="btn gold">إنشاء الحساب</button></form>':
 '<form id="login">'+field("البريد الإلكتروني","email","email","name@example.com","",true)+field("كلمة المرور","password","password","كلمة المرور","",true)+'<button class="btn gold">دخول</button><button type="button" class="btn light" data-a="forgot">نسيت كلمة المرور؟</button></form>')+
 '<p class="small">كل الحسابات تستخدم البريد الإلكتروني وكلمة المرور. لا توجد حسابات تجريبية.</p></div></div></main>';
}
      function recoveryView(){
 return header("استعادة كلمة المرور")+
 '<main class="wrap"><div class="auth"><div class="card">'+
 '<h2>تعيين كلمة مرور جديدة</h2>'+
 '<p>اكتب كلمة المرور الجديدة وأعد كتابتها للتأكيد.</p>'+
 msg()+
 '<form id="recoveryForm">'+
 field("كلمة المرور الجديدة","password","password","8 أحرف على الأقل","",true)+
 field("تأكيد كلمة المرور","confirm_password","password","أعد كتابة كلمة المرور","",true)+
 '<button class="btn gold">حفظ كلمة المرور</button>'+
 '</form></div></div></main>';
      }
function serviceCard(x){return '<article class="card"><div class="icon">✦</div><h3>'+esc(x.name_ar)+'</h3><p>'+esc(x.description||"خدمة متاحة")+'</p>'+btn("request","اطلب الخدمة","gold",x.id)+'</article>'}
function providerCard(p){const names=(p.provider_services||[]).filter(x=>x.is_active).map(x=>x.services?.name_ar).filter(Boolean).join("، ");return '<article class="card"><div class="provider"><div class="avatar">'+esc((p.display_name||"م").slice(0,1))+'</div><div><h3>'+esc(p.display_name||"مزوّد خدمة")+'</h3><p>'+esc([p.city,p.country].filter(Boolean).join("، "))+'</p></div></div><p>'+esc(p.bio||"مزوّد معتمد")+'</p><p>خبرة '+fmt(p.experience_years)+' سنة · ⭐ '+fmt(p.average_rating)+' ('+fmt(p.total_reviews)+')</p><p>'+esc(names)+'</p>'+btn("request","اطلب من هذا المزوّد","gold",p.id)+'</article>'}
function landing(){return header("اكتشف الخدمات ومزوّدي الخدمة المعتمدين")+'<main class="wrap"><section class="hero"><h1>الخدمة المناسبة، من الشخص المناسب.</h1><p>تصفّح الخدمات، قارن مزوّدي الخدمة، واطلب الخدمة بسهولة.</p>'+btn("showauth","ابدأ الآن","gold")+'</section><section class="section"><h2>التصنيفات</h2><div class="grid small">'+(s.cats.slice(0,8).map(c=>'<div class="card"><div class="icon">'+esc(c.icon||"✦")+'</div><b>'+esc(c.name_ar)+'</b></div>').join("")||empty("لا توجد تصنيفات"))+'</div></section><section class="section"><h2>خدمات مختارة</h2><div class="grid">'+(s.services.slice(0,8).map(serviceCard).join("")||empty("لا توجد خدمات"))+'</div></section><section class="section"><h2>مزوّدو خدمة معتمدون</h2><div class="grid">'+(s.providers.slice(0,4).map(providerCard).join("")||empty("لا يوجد مزوّدون معتمدون بعد"))+'</div></section></main>'}
function requestList(provider){
 return s.requests.map(q=>{const own=q.provider_id===s.provider?.id;let a="";
 if(provider&&q.status==="pending"&&!q.provider_id)a=btn("claim","قبول الطلب","green",q.id);
 if(provider&&own&&q.status==="accepted")a=btn("advance","بدء التنفيذ","gold",q.id,"data-next='in_progress'");
 if(provider&&own&&q.status==="in_progress")a=btn("advance","إنهاء الطلب","green",q.id,"data-next='completed'");
 if(provider&&q.provider_id&&!own)return "";
 return '<article class="item"><div class="row"><b>'+esc(q.title||q.services?.name_ar||"طلب خدمة")+'</b>'+tag(q.status)+'</div><p>'+esc([q.city,q.country].filter(Boolean).join("، "))+'</p><p>'+esc(q.description||"")+'</p><p>الميزانية: '+(q.budget?fmt(q.budget):"غير محددة")+'</p><div class="actions">'+a+(!provider&&["pending","accepted"].includes(q.status)?btn("cancelrequest","إلغاء الطلب","danger",q.id):"")+(q.status==="completed"&&q.provider_id&&!provider?btn("review","تقييم الخدمة","light",q.id):"")+(q.provider_id&&["accepted","in_progress"].includes(q.status)&&(!provider||s.chats.some(c=>c.request_id===q.id))?btn("chat","محادثة","light",q.id):"")+'</div></article>';
 }).join("")||empty("لا توجد طلبات حتى الآن");
}
function customer(){
 let body="";
 if(s.tab==="home")body='<section class="section"><h2>التصنيفات</h2><div class="grid small">'+s.cats.map(c=>'<div class="card"><div class="icon">'+esc(c.icon||"✦")+'</div><b>'+esc(c.name_ar)+'</b></div>').join("")+'</div></section><section class="section"><div class="sectionhead"><h2>الخدمات</h2><input id="search" placeholder="ابحث عن خدمة" value="'+esc(s.filter)+'"></div><div class="grid">'+s.services.filter(x=>(x.name_ar+" "+(x.description||"")).includes(s.filter)).map(serviceCard).join("")+'</div></section><section class="section"><h2>مزوّدو الخدمة المعتمدون</h2><div class="grid">'+(s.providers.map(providerCard).join("")||empty("لا يوجد مزوّدون معتمدون بعد"))+'</div></section>';
 if(s.tab==="messages")body=chatContent();
 if(s.tab==="requests")body='<section class="section"><div class="sectionhead"><h2>طلباتي</h2>'+btn("request","طلب جديد","gold")+'</div><div class="list">'+(s.requests.map(q=>'<article class="item"><div class="row"><b>'+esc(q.title||q.services?.name_ar||"طلب")+'</b>'+tag(q.status)+'</div><p>'+esc(q.city||"")+' · '+esc(q.provider_profiles?.display_name||"بانتظار مزوّد")+'</p><p>'+esc(q.description||"")+'</p><div class="actions">'+(["pending","accepted"].includes(q.status)?btn("cancelrequest","إلغاء","danger",q.id):"")+(q.status==="completed"&&q.provider_id?btn("review","تقييم الخدمة","light",q.id):"")+(q.provider_id&&["accepted","in_progress"].includes(q.status)?btn("chat","محادثة","light",q.id):"")+'</div></article>').join("")||empty("لا توجد طلبات حتى الآن"))+'</div></section>';
 const nav=[["home","الرئيسية"],["requests","طلباتي"],["messages","الرسائل"]].map(x=>'<button data-a="tab" data-id="'+x[0]+'" class="'+(s.tab===x[0]?"active":"")+'">'+x[1]+'</button>').join("");
 return header("أهلًا "+(s.profile.full_name||"بك"),nav)+'<main class="wrap">'+msg()+'<div class="sectionhead"><h2>حساب العميل</h2><span class="tag">عميل</span></div>'+body+'</main>';
}
function provider(){
 let body="";
 if(s.tab==="messages")body=chatContent();
 if(["home","requests"].includes(s.tab))body='<div class="grid small"><div class="card"><div class="small">حالة التوفر</div><div class="stat">'+(s.provider.is_available?"متاح":"غير متاح")+'</div>'+btn("availability",s.provider.is_available?"إيقاف الاستقبال":"تفعيل الاستقبال",s.provider.is_available?"light":"green")+'</div><div class="card"><div class="small">التقييم</div><div class="stat">⭐ '+fmt(s.provider.average_rating)+'</div><p>'+fmt(s.provider.total_reviews)+' تقييم</p></div><div class="card"><div class="small">التوثيق</div>'+tag(s.provider.verification_status)+'</div></div><section class="section"><h2>الطلبات المتاحة والمسندة إليك</h2><div class="list">'+requestList(true)+'</div></section>';

function vals(f){return Object.fromEntries(new FormData(f).entries())}
async function submit(e){
 const f=e.target;if(!f.id)return;e.preventDefault();
 try{
  
  if(f.id==="recoveryForm"){
   let v=vals(f);
   if(v.password.length<8)throw Error("كلمة المرور يجب ألا تقل عن 8 أحرف");
   if(v.password!==v.confirm_password)throw Error("كلمتا المرور غير متطابقتين");
   let r=await db.auth.updateUser({password:v.password});
   if(r.error)throw r.error;
   await db.auth.signOut();
   s.user=null;
   s.profile=null;
   s.provider=null;
   s.mode="login";
   s.notice="تم تغيير كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.";
   s.noticeType="success";
   history.replaceState({},document.title,location.pathname);
   render();
   return;
  }

  if(f.id==="login"){let v=vals(f),r=await db.auth.signInWithPassword({email:v.email.trim(),password:v.password});if(r.error)throw r.error;await loadUser(r.data.user);return}
  if(f.id==="signup"){let v=vals(f);if(v.password.length<8)throw Error("كلمة المرور يجب ألا تقل عن 8 أحرف");let r=await db.auth.signUp({email:v.email.trim(),password:v.password,options:{data:{full_name:v.full_name,phone:v.phone||null,country:v.country,city:v.city,account_type:v.account_type,experience_years:v.experience_years||0,bio:v.bio||"",service_area:v.service_area||""}}});if(r.error)throw r.error;if(r.data.session){await loadUser(r.data.user);note("تم إنشاء الحساب.","success")}else{s.mode="login";note("تم إنشاء الحساب. راجع بريدك لتأكيده ثم سجّل الدخول.","success")}return}
  if(f.id==="requestForm"){let v=vals(f),r=await db.rpc("create_service_request",{p_service_id:v.service_id,p_title:v.title,p_description:v.description||null,p_country:v.country,p_city:v.city,p_address:v.address,p_budget:v.budget?Number(v.budget):null,p_provider_id:v.provider_id||null});if(r.error)throw r.error;s.modal=null;await loadUser(s.user);note("تم إرسال طلب الخدمة.","success");return}
  if(f.id==="offerForm"){let v=vals(f),r=await db.from("provider_services").insert({provider_id:s.provider.id,service_id:v.service_id,price:Number(v.price),currency:v.currency,price_type:v.price_type,is_active:true});if(r.error)throw r.error;s.modal=null;await loadUser(s.user);note("تمت إضافة الخدمة.","success");return}
  if(f.id==="serviceForm"){let v=vals(f),r=await db.from("services").insert({category_id:v.category_id,name_ar:v.name_ar,name_en:v.name_en||null,description:v.description||null,is_active:true});if(r.error)throw r.error;s.modal=null;await loadUser(s.user);note("تمت إضافة الخدمة.","success");return}
  if(f.id==="categoryForm"){let v=vals(f),r=await db.from("categories").insert({name_ar:v.name_ar,name_en:v.name_en||null,slug:v.slug,icon:v.icon||null,is_active:true});if(r.error)throw r.error;s.modal=null;await loadUser(s.user);note("تمت إضافة التصنيف.","success");return}
  if(f.id==="reviewForm"){let v=vals(f),r=await db.from("reviews").insert({request_id:v.request_id,provider_id:v.provider_id,customer_id:s.user.id,rating:Number(v.rating),comment:v.comment||null});if(r.error)throw r.error;s.modal=null;note("تم إرسال تقييمك.","success");return}
  if(f.id==="sendMessage"){let v=vals(f);let r=await db.from("messages").insert({conversation_id:s.activeChat.id,sender_id:s.user.id,message_text:v.message_text.trim()});if(r.error)throw r.error;let q=await db.from("messages").select("id,sender_id,message_text,is_read,created_at").eq("conversation_id",s.activeChat.id).order("created_at");if(q.error)throw q.error;s.messages=q.data||[];render();return}
  if(f.id==="providerProfile"){let v=vals(f),r=await db.from("provider_profiles").update({display_name:v.display_name,country:v.country,city:v.city,service_area:v.service_area||null,experience_years:Number(v.experience_years||0),bio:v.bio||null,updated_at:new Date().toISOString()}).eq("id",s.provider.id);if(r.error)throw r.error;await loadUser(s.user);note("تم حفظ ملفك.","success");return}
 }catch(x){console.error(x);note(x.message||"حدث خطأ.","error")}
}
async function action(a,id,b){
 try{
  if(a==="showauth"){s.mode="login";render();return}if(a==="mode"){s.mode=id;s.notice="";render();return}if(a==="tab"){s.tab=id;render();return}
  if(a==="logout"){await db.auth.signOut();s.user=null;s.profile=null;s.provider=null;s.mode="welcome";render();return}
  
if(a==="forgot"){let email=document.querySelector('#login [name="email"]')?.value;if(!email)throw Error("اكتب بريدك الإلكتروني أولًا");let r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/?mode=recovery"});if(r.error)throw r.error;note("تم إرسال رابط استعادة كلمة المرور.","success");return}
  
  if(a==="request"){if(!s.user){s.mode="login";note("سجّل الدخول أولًا حتى تتمكن من إرسال طلب خدمة.");return}s.modal={type:"request",providerId:s.providers.some(x=>x.id===id)?id:null,serviceId:s.services.some(x=>x.id===id)?id:null};render();return}
  if(["addoffer","addservice","addcategory"].includes(a)){s.modal={type:a==="addoffer"?"offer":a==="addservice"?"service":"category"};render();return}
  if(a==="review"){let q=s.requests.find(x=>x.id===id);if(q){s.modal={type:"review",requestId:q.id,providerId:q.provider_id};render()}return}
  if(a==="close"){s.modal=null;render();return}
  if(a==="chat"){await openChatForRequest(id);return}
  if(a==="chatopen"){let c=s.chats.find(x=>x.id===id);if(!c)throw Error("المحادثة غير موجودة");s.activeChat=c;let q=await db.from("messages").select("id,sender_id,message_text,is_read,created_at").eq("conversation_id",c.id).order("created_at");if(q.error)throw q.error;s.messages=q.data||[];render();return}
  if(a==="chatback"){s.activeChat=null;s.messages=[];render();return}
  if(a==="cancelrequest"){if(!confirm("هل تريد إلغاء الطلب؟"))return;let r=await db.rpc("cancel_service_request",{p_request_id:id});if(r.error)throw r.error;await loadUser(s.user);note("تم إلغاء الطلب.","success");return}
  if(a==="claim"){let r=await db.rpc("claim_service_request",{p_request_id:id});if(r.error)throw r.error;await loadUser(s.user);note("تم قبول الطلب وإسناده إليك.","success");return}
  if(a==="advance"){let r=await db.rpc("advance_service_request",{p_request_id:id,p_next_status:b.dataset.next});if(r.error)throw r.error;await loadUser(s.user);note("تم تحديث حالة الطلب.","success");return}
  if(a==="availability"){let r=await db.from("provider_profiles").update({is_available:!s.provider.is_available,updated_at:new Date().toISOString()}).eq("id",s.provider.id);if(r.error)throw r.error;await loadUser(s.user);note("تم تحديث التوفر.","success");return}
  if(a==="toggleoffer"){let o=s.offers.find(x=>x.id===id),r=await db.from("provider_services").update({is_active:!o.is_active}).eq("id",id);if(r.error)throw r.error;await loadUser(s.user);return}
  if(a==="reviewprovider"){let r=await db.rpc("admin_review_provider_application",{p_user_id:id,p_decision:b.dataset.decision});if(r.error)throw r.error;await loadUser(s.user);note("تم تحديث طلب الانضمام.","success");return}
  if(a==="toggleservice"){let x=s.services.find(y=>y.id===id),r=await db.from("services").update({is_active:!x.is_active}).eq("id",id);if(r.error)throw r.error;await loadUser(s.user);note("تم تحديث الخدمة.","success");return}
  if(a==="togglecategory"){let x=s.cats.find(y=>y.id===id),r=await db.from("categories").update({is_active:!x.is_active}).eq("id",id);if(r.error)throw r.error;await loadUser(s.user);note("تم تحديث التصنيف.","success");return}
 }catch(x){console.error(x);note(x.message||"تعذّر تنفيذ العملية.","error")}
}
app.addEventListener("click",e=>{let b=e.target.closest("[data-a]");if(!b)return;if(b.dataset.a==="close"&&e.target!==b&&e.target.closest(".modal"))return;action(b.dataset.a,b.dataset.id,b)});
app.addEventListener("submit",submit);
app.addEventListener("change",e=>{if(e.target.name==="account_type"){s.type=e.target.value;const extra=document.getElementById("providerExtra");if(extra)extra.classList.toggle("hidden",s.type!=="provider")}});
app.addEventListener("input",e=>{if(e.target.id==="search"){s.filter=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById("search");if(n){n.focus();n.setSelectionRange(pos,pos)}}});

async function boot(){
 const recoveryMode=new URLSearchParams(location.search).get("mode")==="recovery"||new URLSearchParams(location.hash.slice(1)).get("type")==="recovery";
 if(recoveryMode)s.mode="recovery";
 await publicData();
 let r=await db.auth.getSession();
 if(recoveryMode){
  s.mode="recovery";
  render();
 }else if(r.data.session?.user){
  await loadUser(r.data.session.user);
 }else{
  s.mode="welcome";
  render();
 }
 db.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY"||(recoveryMode&&session?.user)){
   s.mode="recovery";
   render();
   return;
  }
  if(session?.user&&session.user.id!==s.user?.id)loadUser(session.user);
  else if(!session){
   s.user=null;
   s.profile=null;
   s.provider=null;
   if(s.mode!=="recovery")render();
  }
 });
}
boot().catch(e=>{console.error(e);app.innerHTML='<main class="wrap">'+empty("تعذّر تحميل المنصة. تحقق من الاتصال ثم أعد المحاولة.")+'</main>'});
})();
</script></body></html>
