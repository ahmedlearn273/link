.tag.wait{

.tag.bad{
  background:var(--danger);

/* Notices */

.notice.success{
  background:var(--success);

}

.notice.error{
  background:var(--danger);

/* Disabled and focus states */
.btn:disabled,
input:disabled,
select:disabled,
textarea:disabled{

.btn:focus-visible,
.tabs button:focus-visible,
.top .nav button:focus-visible{

/* WASLA - Welcome Screen */
.wasla-welcome{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
  text-align:center;
  overflow:hidden;
  background:radial-gradient(ellipse at center,var(--bg-subtle),var(--bg-main) 75%);
  color:var(--text-primary);
}
.wasla-welcome > .theme-toggle{
  position:absolute;
  top:20px;
  inset-inline-start:20px;
  z-index:5;
}
.wasla-welcome .welcome-wordmark{
  position:relative;
  display:block;
  width:100%;
  height:130px;
  flex:0 0 130px;
  direction:ltr;
  overflow:visible;
}

.wasla-welcome .welcome-logo{
  position:absolute;
  left:50%;
  top:50%;
  width:110px;
  height:110px;
  margin:0;
  transform:translate(calc(-50% - 120px),-50%);
  filter:drop-shadow(0 0 18px color-mix(in srgb,var(--accent) 35%,transparent));
  animation:welcomeLogoCenter 5.85s cubic-bezier(.2,.75,.25,1) forwards;
}
.wasla-welcome .welcome-elcome{
  position:absolute;
  left:calc(50% - 60px);
  top:50%;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  gap:3px;
  transform:translateY(-50%);
  white-space:nowrap;
  direction:ltr;
  color:var(--text-primary);
  font-family:Tajawal,sans-serif;
  font-size:clamp(48px,10vw,72px);
  font-weight:800;
  letter-spacing:0;
  transform-origin:left center;
  animation:welcomeTextClose 5.85s ease-in forwards;
}

.wasla-welcome .welcome-elcome span{
  display:block;
  position:relative;
  flex:0 0 auto;
  min-width:.55em;
  text-align:center;
  line-height:1.2;
  animation:welcomeLetterWave 1.35s ease-in-out infinite;
}

.wasla-welcome .welcome-elcome span:nth-child(1){animation-delay:0s}
.wasla-welcome .welcome-elcome span:nth-child(2){animation-delay:.12s}
.wasla-welcome .welcome-elcome span:nth-child(3){animation-delay:.24s}
.wasla-welcome .welcome-elcome span:nth-child(4){animation-delay:.36s}
.wasla-welcome .welcome-elcome span:nth-child(5){animation-delay:.48s}
.wasla-welcome .welcome-elcome span:nth-child(6){animation-delay:.60s}
.wasla-welcome .welcome-name{
  margin:0;
  color:var(--text-primary);
  font:800 clamp(38px,8vw,58px) Tajawal,sans-serif;
  opacity:0;
  animation:waslaWelcomeText .7s ease 5.05s forwards;
}

.wasla-welcome .welcome-en{
  color:var(--accent);
  font:700 12px Arial,sans-serif;
  letter-spacing:6px;
  margin-top:3px;
  opacity:0;
  animation:waslaWelcomeText .7s ease 5.35s forwards;
}

.wasla-welcome .welcome-tagline{
  color:var(--text-secondary);
  margin:12px 0 30px;
  font-size:15px;
  opacity:0;
  animation:waslaWelcomeText .7s ease 5.55s forwards;
}

.wasla-welcome .welcome-actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  opacity:0;
  animation:waslaWelcomeText .7s ease 5.75s forwards;
}

.wasla-welcome .welcome-actions .btn{
  min-width:155px;
  min-height:48px;
}

@keyframes welcomeLetterWave{
  0%,100%{transform:translateY(0)}
  25%{transform:translateY(-13px)}
  50%{transform:translateY(2px)}
  75%{transform:translateY(-7px)}
}

@keyframes welcomeTextClose{
  0%,82%{
    opacity:1;
    transform:translateY(-50%) scaleX(1);
    max-width:400px;
  }
  100%{
    opacity:0;
    transform:translateY(-50%) scaleX(0);
    max-width:0;
  }
}

@keyframes welcomeLogoCenter{
  0%,82%{transform:translate(calc(-50% - 120px),-50%)}
  100%{transform:translate(-50%,-50%)}
}

@keyframes waslaWelcomeText{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

if(p.role==="staff"){

}

  await loadCustomerProviderData(p,pp,u);
 }else if(p.role==="admin"||p.role==="owner"){

    db.from("service_requests").select("*,services(name_ar)").order("created_at",{ascending:false}).limit(100),
    db.from("profiles").select("id,full_name,phone,city,country,role,status,staff_role_code,staff_title").in("role",["customer","staff"]),
    db.from("staff_permissions").select("*"),
    db.from("conversations").select("id,request_id,customer_id,provider_id,last_message_at,service_requests(title)").order("last_message_at",{ascending:false})
  ]);

  if(a.error)throw a.error;
  if(r.error)throw r.error;
  if(profiles.error)throw profiles.error;
  if(permissions.error)throw permissions.error;
  if(chats.error)throw chats.error;

  s.apps=a.data||[];
  s.allRequests=r.data||[];
  s.chats=chats.data||[];
if(p.role==="owner"){

  .from("audit_logs")
  .select("id,actor_id,actor_role,actor_code,action,entity_table,entity_id,event_source,created_at,result")
  .order("created_at",{ascending:false})
  .limit(100);

 if(logsError)throw logsError;
 s.auditLogs=logs||[];
}
  const people=profiles.data||[];
  const perms=permissions.data||[];

  s.staff=people.filter(x=>x.role==="staff").map(x=>({...x,staff_permissions:perms.find(p=>p.user_id===x.id)||null}));
  s.staffCandidates=people.filter(x=>x.role==="customer"&&x.status==="active");
  s.customers=people.filter(x=>x.role==="customer");

  const ids=[...new Set(s.apps.map(x=>x.user_id).concat(s.allRequests.map(x=>x.customer_id)).filter(Boolean))];

  if(ids.length){
    const {data:x,error}=await db.from("profiles").select("id,full_name,phone,city,country").in("id",ids);
    if(error)throw error;
    s.adminProfiles=x||[];
  }
 }
 render();
}

function fmtDateAr(x){try{return new Date(x).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"})}catch(_){return ""}}

 const list=Object.values(s.payments||{}).sort((a,b)=>String(b.paid_at||b.created_at||"").localeCompare(String(a.paid_at||a.created_at||"")));

 list.filter(x=>x.payment_status==="paid").forEach(x=>{const c=String(x.currency||"EGP").trim();paidSum[c]=(paidSum[c]||0)+Number(x.amount||0)});
 const pend=list.filter(x=>x.payment_status==="pending").length;

var reqRt={chan:null,uid:null,timer:null,busy:false};
function reqRtUnsub(){try{if(reqRt.chan)db.removeChannel(reqRt.chan)}catch(_){}reqRt.chan=null;reqRt.uid=null;clearTimeout(reqRt.timer)}
function reqRtKick(){
 clearTimeout(reqRt.timer);
 reqRt.timer=setTimeout(async function go(){
  if(!s.user||!reqRt.chan)return;
  const ae=document.activeElement;
  if(reqRt.busy||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&(ae.value||"").length>0)){reqRt.timer=setTimeout(go,2500);return}
  reqRt.busy=true;
  try{await refreshRoleData()}catch(_){}
  reqRt.busy=false;
 },700);
}
function reqRtSubscribe(uid){
 if(!uid||(reqRt.chan&&reqRt.uid===uid))return;
 reqRtUnsub();
 try{
  reqRt.uid=uid;
  reqRt.chan=db.channel("wasla-requests-"+uid)
   .on("postgres_changes",{event:"*",schema:"public",table:"service_requests"},()=>reqRtKick())
   .on("postgres_changes",{event:"*",schema:"public",table:"service_quotes"},()=>reqRtKick())
   .subscribe();
 }catch(_){reqRt.chan=null;reqRt.uid=null}
}
var payRt={chan:null,uid:null};
function payRtUnsub(){try{if(payRt.chan)db.removeChannel(payRt.chan)}catch(_){}payRt.chan=null;payRt.uid=null}
function payRtSubscribe(uid){
 if(!uid||(payRt.chan&&payRt.uid===uid))return;
 payRtUnsub();
 try{
  payRt.uid=uid;
  payRt.chan=db.channel("wasla-payments-"+uid)
   .on("postgres_changes",{event:"UPDATE",schema:"public",table:"payments",filter:"customer_id=eq."+uid},payload=>{
    const row=payload&&payload.new;
    if(!row||!row.request_id)return;
    const prev=s.payments&&s.payments[row.request_id];
    if(!s.payments)s.payments={};
    s.payments[row.request_id]=Object.assign({},prev||{},row);
    if(row.payment_status==="paid"&&(!prev||prev.payment_status!=="paid")){
     note("الفني أكد استلام المبلغ ✓","success");
    }else render();
   })
   .subscribe();
 }catch(_){payRt.chan=null;payRt.uid=null}
}
function moneyAr(n){n=Number(n||0);return '<span dir="ltr">'+(n<0?"-":"")+fmt(Math.abs(n))+'</span>'}
function paymentStatusAr(p){
 if(p.payment_status==="paid")return "تم الدفع";
 if(p.payment_status==="failed")return "فشل الدفع";
 if(p.payment_status==="refunded")return "تم الاسترداد";
 return p.payment_method==="cash"?"بانتظار تأكيد استلام الكاش":"بانتظار الدفع";
}
async function loadPayments(){
 try{
  const r=await db.from("payments").select("id,request_id,amount,currency,commission_rate,commission_amount,provider_amount,payment_method,payment_status,paid_at,created_at");
  const m={};
  (r.data||[]).forEach(x=>{m[x.request_id]=x});
  s.payments=m;
 }catch(_){s.payments=s.payments||{}}
}
function paymentBlock(q,provider,own){
 const p=s.payments&&s.payments[q.id];
 if(!p||q.status!=="completed")return "";
 const cur=esc(String(p.currency||"EGP").trim());
 const method=p.payment_method==="cash"?"كاش":"عبر المنصة";
 let h='<div class="wasla-pay-block"><div class="row"><b>الدفع</b>'+tag(paymentStatusAr(p))+'</div>'+
  '<p>المبلغ: '+moneyAr(p.amount)+' '+cur+' · طريقة الدفع: '+method+'</p>';
 if(provider&&own){
  h+='<p>عمولة المنصة ('+fmt(p.commission_rate)+'%): '+moneyAr(p.commission_amount)+' '+cur+' · صافي نصيبك: '+moneyAr(p.provider_amount)+' '+cur+'</p>';
  if(p.payment_method==="cash"&&p.payment_status==="pending")h+='<div class="actions">'+btn("cash-received","استلمت الفلوس","green",q.id)+'</div>';
 }else if(!provider&&p.payment_method==="cash"&&p.payment_status==="pending"){
  h+='<p>ادفع المبلغ كاش للفني مباشرة.</p>';
 }
 if(!provider&&p.payment_status==="paid")h+='<div class="actions">'+btn("receipt","عرض الإيصال","light",p.id)+'</div>';
 return h+'</div>';
}
const WALLET_LABELS={earning:"نصيبك من طلب (بعد العمولة)",cash_collected:"كاش مستلم من العميل",settlement:"تسوية",payout:"سحب",advance_repayment:"سداد سلفة",adjustment:"تعديل"};
async function loadWallet(more){
 const w=s.wallet=s.wallet||{entries:[],data:null,loading:false,error:"",more:false};
 if(w.loading)return;
 w.loading=true;w.error="";
 if(!more){w.entries=[]}
 render();
 try{
  const off=more?w.entries.length:0;
  const r=await db.rpc("get_my_wallet",{p_limit:30,p_offset:off});
  if(r.error)throw r.error;
  const d=r.data||{};
  w.data=d;
  const ent=Array.isArray(d.entries)?d.entries:[];
  w.entries=more?w.entries.concat(ent):ent;
  w.more=ent.length>=30;
 }catch(err){
  w.error="تعذّر تحميل المحفظة: "+(err&&err.message?err.message:"خطأ غير معروف");
 }
 w.loading=false;
 render();
}

 const bal=Number(d.balance||0);

 h+='<div class="grid small">'+

    '<p class="small">'+esc(new Date(e.created_at).toLocaleString("ar-EG"))+' · الرصيد بعدها: '+moneyAr(e.running_balance)+'</p>'+
    (e.note?'<p class="small">'+esc(e.note)+'</p>':'')+'</article>';
  }).join("")||empty("لا توجد حركات حتى الآن"))+
  '</div>'+
  (w.more?'<div class="actions"><button class="btn light" data-a="wallet-more"'+(w.loading?' disabled':'')+'>عرض المزيد</button></div>':'')+

      function requestList(provider,requests=s.requests){
  return requests.map(q=>{
  const own=q.provider_id===s.provider?.id;
  const quote=provider?s.quotes.find(x=>x.request_id===q.id):null;
  let a="";

  if(provider&&q.status==="pending"&&!q.provider_id){
   a=btn("claim","قبول الطلب","green",q.id);
  }

  if(provider&&own&&q.status==="accepted"){
   if(!quote||["revision_requested","rejected","expired"].includes(quote.status)){
    a=btn("createquote",quote?"إرسال عرض معدل":"إنشاء عرض سعر","gold",q.id);
   }else if(quote.status==="agreed"){
    a=btn("advance","بدء التنفيذ","gold",q.id,"data-next='in_progress'");
   }else{
    const quoteStatus={
     awaiting_customer:"في انتظار رد العميل",
          awaiting_provider_approval:"في انتظار اعتمادك",
     withdrawn:"تم سحب عرض السعر"
    };

    if(quote.status==="awaiting_provider_approval"){
     a=btn("quote-provider-review","مراجعة واعتماد العرض","gold",quote.id);
    }else{
     a=tag(quoteStatus[quote.status]||"عرض السعر قيد المراجعة");
    }
   }
  }

  if(provider&&own&&q.status==="in_progress"){
   a=btn("advance","إنهاء الطلب","green",q.id,"data-next='completed'");
  }

  if(provider&&q.provider_id&&!own)return "";

  return '<article class="item"><div class="row"><b>'+esc(q.title||q.services?.name_ar||"طلب خدمة")+'</b>'+tag(q.status)+'</div><p>'+esc([q.city,q.country].filter(Boolean).join("، "))+'</p><p>'+esc(q.description||"")+'</p><p>الميزانية: '+(q.budget?fmt(q.budget):"غير محددة")+'</p>'+paymentBlock(q,provider,own)+'<div class="actions">'+a+(provider&&own?btn("provider-request-details","تفاصيل الطلب","light",q.id):"")+(!provider&&["pending","accepted"].includes(q.status)?btn("cancelrequest","إلغاء الطلب","danger",q.id):"")+(q.status==="completed"&&q.provider_id&&!provider&&!s.reviewedIds?.has(q.id)?btn("review","تقييم الخدمة","light",q.id):"")+(q.provider_id&&["accepted","in_progress"].includes(q.status)&&(!provider||s.chats.some(c=>c.request_id===q.id))?btn("chat","محادثة","light",q.id):"")+'</div></article>';
 }).join("")||empty("لا توجد طلبات حتى الآن");
      }

const WC_TZ="Africa/Cairo";
function wcTime(x){
 const d=new Date(x);if(isNaN(d))return "";
 const t=d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:WC_TZ});
 return t.replace("AM","ص").replace("PM","م");
}
function wcDayKey(x){
 const d=new Date(x);if(isNaN(d))return "";
 return d.toLocaleDateString("en-CA",{timeZone:WC_TZ});
}
function wcListTime(x){
 const d=new Date(x);if(isNaN(d))return "";
 const key=wcDayKey(x),today=new Date();
 if(key===wcDayKey(today))return wcTime(x);
 if(key===wcDayKey(new Date(today.getTime()-86400000)))return "أمس";
 return d.toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"2-digit",timeZone:WC_TZ});
}
function wcDayLabel(x){
 const d=new Date(x);if(isNaN(d))return "";
 const key=wcDayKey(x),today=new Date();
 const k0=wcDayKey(today),k1=wcDayKey(new Date(today.getTime()-86400000));
 if(key===k0)return "اليوم";
 if(key===k1)return "أمس";
 const diff=(Date.parse(k0)-Date.parse(key))/86400000;
 if(diff>0&&diff<7)return d.toLocaleDateString("ar-EG-u-nu-latn",{weekday:"long",timeZone:WC_TZ});
 return d.toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"long",year:"numeric",timeZone:WC_TZ});
}
const WC_DOC_MAX=25*1024*1024;
const WC_DOC_TYPES={pdf:"application/pdf",doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xls:"application/vnd.ms-excel",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",ppt:"application/vnd.ms-powerpoint",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",txt:"text/plain",zip:"application/zip"};
function wcDocExt(file){return String(file&&file.name||"").split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"")}
function wcDocMime(file){
 const ext=wcDocExt(file),mime=WC_DOC_TYPES[ext];
 if(!mime)return null;
 const t=(file.type||"").toLowerCase();
 if(t&&t!==mime&&!(ext==="zip"&&(t==="application/x-zip-compressed"||t==="application/x-zip"))&&!(ext==="txt"&&t.startsWith("text/"))&&t!=="application/octet-stream")return null;
 return mime;
}

function wcVideoThumb(file){
 return new Promise(resolve=>{
  let done=false,url=null;
  const v=document.createElement("video");
  const finish=blob=>{if(done)return;done=true;clearTimeout(tm);try{if(url)URL.revokeObjectURL(url)}catch(_){}v.removeAttribute("src");resolve(blob||null)};
  const tm=setTimeout(()=>finish(null),10000);
  try{
   url=URL.createObjectURL(file);
   v.muted=true;v.playsInline=true;v.preload="auto";v.crossOrigin="anonymous";
   v.onerror=()=>finish(null);
   v.onloadedmetadata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(_){finish(null)}};
   v.onseeked=()=>{
    try{
     if(!v.videoWidth||!v.videoHeight)return finish(null);
     const w=Math.min(480,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);
     const c=document.createElement("canvas");c.width=w;c.height=h;
     c.getContext("2d").drawImage(v,0,0,w,h);
     c.toBlob(b=>finish(b&&b.size>0?b:null),"image/jpeg",0.8);
    }catch(_){finish(null)}
   };
   v.src=url;
  }catch(_){finish(null)}
 });
}

let wcListChan=null,wcListOk=false,wcListDown=false,wcListTimer=null,wcListLast=0,wcListBusy=false;
let wcListPending=false;
async function wcRefreshChats(){
 if(!s.user||!["customer","provider"].includes(s.profile?.role))return;
 if(wcListBusy){wcListPending=true;return}
 wcListBusy=true;
 try{
  const r=await wcChatsQuery();
  if(r.error||!Array.isArray(r.data))return;
  wcListLast=Date.now();
  const sig=l=>JSON.stringify((l||[]).map(c=>[c.id,c.last_message_at,c.unread_count,c.last_message_text,c.last_message_type,c.request_status]));
  if(sig(r.data)===sig(s.chats))return;
  s.chats=r.data;
  if(s.tab==="messages"&&!s.activeChat&&!document.hidden)render();
 }catch(_){}
 finally{
  wcListBusy=false;
  if(wcListPending){wcListPending=false;wcListKick()}
 }
}
function wcListKick(){
 clearTimeout(wcListTimer);
 wcListTimer=setTimeout(wcRefreshChats,700);
}
function wcListUnsubscribe(){
 if(wcListChan){try{db.removeChannel(wcListChan)}catch(_){}}
 wcListChan=null;wcListOk=false;wcListDown=false;
}
function wcListSubscribe(){
 if(wcListChan||!s.user||!["customer","provider"].includes(s.profile?.role))return;
 try{
  wcListChan=db.channel("wc-list-"+s.user.id)
   .on("postgres_changes",{event:"*",schema:"public",table:"conversations"},()=>wcListKick())
   .on("postgres_changes",{event:"*",schema:"public",table:"messages"},payload=>{
    wcListKick();
    try{
     const n=payload&&payload.new;
     if(payload&&payload.eventType==="INSERT"&&n&&n.id&&n.conversation_id&&n.sender_id&&n.sender_id!==s.user?.id){
      s.wcDelivSeen=s.wcDelivSeen||new Set();
      if(s.wcDelivSeen.has(n.id))return;
      if(!(s.activeChat&&s.activeChat.id===n.conversation_id))wcMarkDelivered(n.conversation_id).then(ok=>{if(ok)s.wcDelivSeen.add(n.id)}).catch(()=>{});
     }
    }catch(_){}

}

async function loadChatMediaUrls(messages){
 s.chatMediaUrls={};

 const mediaMessages=(messages||[])
  .filter(m=>m.attachment_path);

 const results=await Promise.all(
  mediaMessages.map(async m=>{
   let result={error:true};
   try{
    result=await db.storage
     .from("conversation-media")
     .createSignedUrl(m.attachment_path,3600);
   }catch(_){}

   return {
    id:m.id,
    url:result.error?null:result.data?.signedUrl||null
   };
  })
 );

 s.chatMediaUrls=Object.fromEntries(
  results.filter(x=>x.url).map(x=>[x.id,x.url])
 );

 const thumbMessages=(messages||[]).filter(m=>m.thumbnail_path);
 const thumbResults=await Promise.all(
  thumbMessages.map(async m=>{
   let result={error:true};
   try{
    result=await db.storage
     .from("conversation-media")
     .createSignedUrl(m.thumbnail_path,3600);
   }catch(_){}
   return {id:"t:"+m.id,url:result.error?null:result.data?.signedUrl||null};
  })
 );
 thumbResults.filter(x=>x.url).forEach(x=>{s.chatMediaUrls[x.id]=x.url});
 s.chatUrlAt={};s.wcSignTry={};
 Object.keys(s.chatMediaUrls).forEach(k=>{s.chatUrlAt[k]=Date.now()});
}
      async function openChatForRequest(requestId){
 let c=s.chats.find(x=>x.request_id===requestId);
 if(!c){if(s.profile.role!=="customer")throw Error("يجب أن يبدأ العميل المحادثة أولًا");const q=s.requests.find(x=>x.id===requestId);if(!q||!q.provider_id||!["accepted","in_progress"].includes(q.status))throw Error("المحادثة متاحة بعد قبول الطلب");const r=await db.from("conversations").insert({request_id:q.id,customer_id:s.user.id,provider_id:q.provider_id}).select("id,request_id,customer_id,provider_id,last_message_at").single();if(r.error)throw r.error;c=r.data;s.chats.unshift(c)}
 s.activeChat=c;
s.tab="messages";s.messages=[];s.chatPeerProfile=null;s.chatLoading=Date.now();render();
const [peerResult,r]=await Promise.all([db.rpc("get_conversation_peer_profile",{p_conversation_id:c.id}),db.from("messages")
 .select("id,sender_id,message_text,is_read,created_at,message_type,attachment_path,attachment_mime_type,attachment_size_bytes,media_duration_seconds,location_latitude,location_longitude,delivered_at,thumbnail_path,attachment_name")
 .eq("conversation_id",c.id)
 .order("created_at")]);
if (peerResult.error) throw peerResult.error;
s.chatPeerProfile = peerResult.data?.[0] || null;
if(r.error)throw r.error;
s.messages=r.data||[];
await loadChatMediaUrls(s.messages);
if(["customer","provider"].includes(s.profile?.role)){
 try{
  if(s.messages.some(x=>x.sender_id!==s.user.id&&!x.delivered_at&&!x.is_read)&&await wcMarkDelivered(c.id))
   s.messages=s.messages.map(x=>(x.sender_id!==s.user.id&&!x.delivered_at)?{...x,delivered_at:new Date().toISOString()}:x);
 }catch(_){}
 const readResult=await db.rpc("mark_conversation_messages_read",{
  p_conversation_id:c.id
 });
 if(readResult.error)throw readResult.error;

 if(readResult.data>0){
  s.messages=s.messages.map(m=>
   m.sender_id!==s.user.id?{...m,is_read:true}:m
  );
 }
}
 auditEvent("CONVERSATION_VIEWED","conversations",c.id,"success",{
 messages_count:s.messages.length
});
s.tab="messages";
s.chatLoading=0;
render();
wcSubscribe(c.id);
      }
function applications(onlyPending=false){
 const filter=s.providerFilter||"all";
 const search=String(s.providerSearch||"").trim().toLowerCase();

 const providers=(s.apps||[]).filter(p=>{
  const status=p.profile_status==="suspended"
   ?"suspended"
   :(p.verification_status||"unknown");

  if(onlyPending&&p.verification_status!=="pending")return false;
  if(!onlyPending&&filter!=="all"&&status!==filter)return false;

  const searchable=[
   p.full_name,p.display_name,p.phone,
   p.account_code,p.city,p.area
  ].filter(Boolean).join(" ").toLowerCase();

  return !search||searchable.includes(search);
 });

 return providers.map(p=>{
  const status=p.profile_status==="suspended"
   ?"suspended"
   :(p.verification_status||"unknown");

  const accountStatus={
   active:"نشط",
   pending:"قيد المراجعة",
   suspended:"موقوف"
  }[p.profile_status]||p.profile_status||"غير محدد";

  return '<article class="item" data-provider-card data-status="'+
   esc(status)+'" data-search="'+
   esc([
    p.full_name,p.display_name,p.phone,
    p.account_code,p.city,p.area
   ].filter(Boolean).join(" "))+'">'+
   '<div class="row"><b>'+esc(p.display_name||p.full_name||"مقدّم خدمة")+'</b>'+
   tag(p.verification_status)+'</div>'+
   '<p>'+esc(p.full_name||"")+'</p>'+
   '<p class="small">كود الحساب: '+esc(p.account_code||"غير متوفر")+
   ' · حالة الحساب: '+esc(accountStatus)+'</p>'+
   '<p>'+esc([p.city,p.area].filter(Boolean).join("، ")||"الموقع غير محدد")+'</p>'+
   '<p class="small">الهاتف: '+esc(p.phone||"غير مسجل")+
   ' · الخبرة: '+fmt(p.experience_years)+' سنوات</p>'+
   '<p class="small">التقييم: '+fmt(p.average_rating)+
   ' · عدد التقييمات: '+fmt(p.total_reviews)+'</p>'+
   '<div class="actions">'+
   btn("provider-dossier","فتح الملف الإداري","light",p.user_id)+
   (p.verification_status==="pending"
    ?btn("reviewprovider","موافقة","green",p.user_id,"data-decision='approved'")+
     btn("reviewprovider","رفض","danger",p.user_id,"data-decision='rejected'")
    :"")+
   '</div></article>';
 }).join("")||empty(onlyPending
  ?"لا توجد طلبات انضمام معلّقة."
  :"لا توجد نتائج مطابقة.");
}

      async function resumePrimeKnowledgeRelease(releaseId){
 if(s.profile?.role!=="owner")
  throw Error("استكمال الإصدارات متاح للمالك فقط");

 const release=s.knowledgeReleases.find(x=>x.id===releaseId);

 if(!release||release.status!=="draft")
  throw Error("مسودة الإصدار غير موجودة أو لم تعد قابلة للاستكمال");

 const manifest=release.document_manifest;

 if(!Array.isArray(manifest)||!manifest.length||manifest.length>100)
  throw Error("قائمة مستندات الإصدار غير صالحة");

 const seen=new Set();

 for(const entry of manifest){
  if(!entry||typeof entry!=="object"||
     typeof entry.document_id!=="string"||
     !Number.isInteger(Number(entry.document_version))||
     Number(entry.document_version)<1||
     !Number.isInteger(Number(entry.chunk_count))||
     Number(entry.chunk_count)<1||
     Number(entry.chunk_count)>1000)
   throw Error("بيانات أحد مستندات الإصدار غير صالحة");

  if(seen.has(entry.document_id))
   throw Error("الإصدار يحتوي على مستند مكرر");

  seen.add(entry.document_id);

  const {data,error}=await db.functions.invoke("prime-knowledge-admin",{
   body:{
    action:"get_document",
    document_id:entry.document_id
   }
  });

  if(error)throw error;
  if(data?.error)throw Error(data.error);

  const doc=data?.document;

  if(!doc||doc.status!=="approved"||
     Number(doc.document_version)!==Number(entry.document_version))
   throw Error("أحد المستندات لم يعد معتمدًا بنفس النسخة. لن يتم استكمال الإصدار.");

  const content=String(doc.content||"").trim();

  if(!content||content.length>100000)
   throw Error("محتوى أحد المستندات غير صالح");

  const chunks=[];
  let current="";

  const paragraphs=content.split(/\n\s*\n/);

  for(const paragraph of paragraphs){
   const part=paragraph.trim();
   if(!part)continue;

   if(part.length>15000){
    if(current){
     chunks.push(current);
     current="";
    }

    for(let i=0;i<part.length;i+=15000){
     chunks.push(part.slice(i,i+15000));
    }
    continue;
   }

   if(current&&current.length+part.length+2>15000){
    chunks.push(current);
    current=part;
   }else{
    current=current?current+"\n\n"+part:part;
   }
  }

  if(current)chunks.push(current);

  if(chunks.length!==Number(entry.chunk_count))
   throw Error("عدد أجزاء المستند تغيّر. أوقفنا الاستكمال لحماية الإصدار.");

  for(let i=0;i<chunks.length;i++){
   const result=await db.functions.invoke("prime-knowledge-admin",{
    body:{
     action:"add_chunk",
     release_id:releaseId,
     document_id:doc.id,
     document_version:Number(entry.document_version),
     chunk_index:i,
     content:chunks[i],
     token_estimate:Math.ceil(chunks[i].length/4),
     metadata:{
      title:doc.title,
      slug:doc.slug,
      category:doc.category
     }
    }
   });

   if(result.error)throw result.error;
   if(result.data?.error)throw Error(result.data.error);
   if(!result.data?.success)
    throw Error("لم يتم تأكيد استكمال أحد أجزاء المحتوى");
  }
 }

 await loadPrimeKnowledge();

 note("تم استكمال تجهيز الإصدار كمسودة. لم يتم نشره.","success");
  }

      function rlState(){
        if(!s.rl)s.rl={rows:[],total:0,counters:null,limit:25,offset:0,loading:false,loaded:false,error:"",errorHint:"",filters:{search:"",reason:"",city_id:"",area_id:"",service_id:"",provider_id:""}};
        return s.rl;

      async function loadLateRequests(){
        const l=rlState();
        if(!rqCanView())return;
        l.loading=true;l.loaded=true;l.error="";l.errorHint="";l.rows=[];
        render();
        const f=l.filters;
        const params={p_reason:f.reason||null,p_city_id:f.city_id||null,p_area_id:f.area_id||null,p_service_id:f.service_id||null,p_provider_id:f.provider_id||null,p_search:f.search.trim()||null,p_limit:l.limit,p_offset:l.offset};
        try{
          const {data,error}=await db.rpc("admin_list_late_requests",params);
          if(error)throw error;
          l.rows=Array.isArray(data?.items)?data.items:[];
          l.total=Number(data?.total||0);
          l.counters=data?.counters||null;
          l.limit=Number(data?.limit||l.limit);
          l.offset=Number(data?.offset??l.offset);
        }catch(err){
          console.error("[admin_list_late_requests]");
          const info=rqError(err);
          l.rows=[];l.total=0;l.counters=null;
          l.error=info.known?info.text:"تعذّر تحميل الطلبات المتأخرة.";
          l.errorHint=info.known?"":String(info.raw||"");
          if(info.offsetReset)l.offset=0;
        }
        l.loading=false;
        render();
      }
      function rlApplyFromDom(){

        f.provider_id=g("rlProvider")?.value||"";
        if(f.search.length>200){note("نص البحث أطول من 200 حرف.","error");return false}
        l.offset=0;

      }

      app.addEventListener("click",e=>{

        const a=b.dataset.a;
        if(!String(a).startsWith("rq-"))return;
        const q=rqState();
        if(a==="rq-tab-list"){q.view="list";render();return}
        if(a==="rq-tab-late"){q.view="late";if(!rlState().loaded)loadLateRequests();else render();return}
        if(a==="rq-open"){if(rqCanView()&&b.dataset.id)loadRequestDetail(b.dataset.id);return}
        if(a==="rq-back"){q.detailId=null;q.detail=null;q.act=null;render();return}
        if(a==="rq-detail-retry"){if(q.detailId)loadRequestDetail(q.detailId);return}
        if(a==="rq-apply"){if(rqApplyFromDom())loadRequestsList();return}
        if(a==="rq-reset"){q.filters={search:"",status:"",city_id:"",area_id:"",provider_id:"",late_only:false,date_from:"",date_to:""};q.offset=0;loadRequestsList();return}
        if(a==="rq-retry"){loadRequestsList();return}
        if(a==="rq-prev"){q.offset=Math.max(0,q.offset-q.limit);loadRequestsList();return}
        if(a==="rq-next"){q.offset=q.offset+q.limit;loadRequestsList();return}

function navViewState(idx){
 return {wv:1,idx:idx,tab:s.tab,rf:s.requestFilter,
  chat:(s.tab==="messages"&&s.activeChat)?String(s.activeChat.id):null,
  detail:(s.tab==="requests"&&s.rq&&s.rq.detailId)?String(s.rq.detailId):null,
  sub:s.tab==="profile"?(s.providerProfileTab||"profile"):""};

function navHistSync(){
 var k=navViewKey();
 if(!k)return;
 var h=navHist;
 if(h.target!==null){
  if(k===h.target||Date.now()>h.until){h.key=k;h.target=null;h.stack[h.idx]=k}
  return;
 }
 if(!h.init){
  h.init=true;
  var hs=history.state;
  h.idx=(hs&&hs.wv===1&&typeof hs.idx==="number")?hs.idx:0;
  h.stack[h.idx]=k;h.key=k;
  history.replaceState(navViewState(h.idx),document.title);
  return;
 }
 if(k===h.key)return;
 if(h.idx>0&&h.stack[h.idx-1]===k){
  // in-app "back" button: go back in history instead of stacking a duplicate
  h.target=k;h.until=Date.now()+3000;
  history.back();
  return;
 }
 h.idx+=1;
 h.stack.length=h.idx;
 h.stack[h.idx]=k;
 h.key=k;
 history.pushState(navViewState(h.idx),document.title);
}

 async function prepareServiceImage(file){
 if(!file)return null;

 if(!["image/jpeg","image/png","image/webp"].includes(file.type))
  throw Error("اختار صورة JPG أو PNG أو WebP");

 if(typeof createImageBitmap!=="function")
  throw Error("المتصفح لا يدعم ضغط الصور. جرّب Chrome محدث.");

 const bitmap=await createImageBitmap(file);
 const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));

 const canvas=document.createElement("canvas");
 canvas.width=Math.max(1,Math.round(bitmap.width*scale));
 canvas.height=Math.max(1,Math.round(bitmap.height*scale));

 const ctx=canvas.getContext("2d");
 ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
 bitmap.close?.();

 const blob=await new Promise(resolve=>
  canvas.toBlob(resolve,"image/webp",.82)
 );

 if(!blob)throw Error("تعذّر تجهيز الصورة");
 if(blob.size>4*1024*1024)
  throw Error("حجم الصورة بعد الضغط أكبر من 4 ميجابايت");

 return new File([blob],"service-"+Date.now()+".webp",{
  type:"image/webp"
 });
}

async function saveServiceImage(serviceId,file,oldUrl){
 const imageFile=await prepareServiceImage(file);
 if(!imageFile)return null;

 const path="services/"+serviceId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+".webp";
 const bucket=db.storage.from("service-images");

 const uploaded=await bucket.upload(path,imageFile,{
  contentType:"image/webp",
  cacheControl:"31536000",
  upsert:false
 });

 if(uploaded.error)throw uploaded.error;

 const publicUrl=bucket.getPublicUrl(path).data.publicUrl;

 const updated=await db.rpc("admin_set_service_image",{
 p_service_id:serviceId,
 p_image_url:publicUrl
});

if(updated.error){
 await bucket.remove([path]);
 throw updated.error;
}
 const marker="/storage/v1/object/public/service-images/";

 if(oldUrl&&String(oldUrl).includes(marker)){
  const oldPath=decodeURIComponent(String(oldUrl).split(marker).pop());

  if(oldPath.startsWith("services/")&&oldPath!==path)
   await bucket.remove([oldPath]);
 }

 return publicUrl;
}

if(f.id==="primeKnowledgeReleaseForm"){
 if(s.profile?.role!=="owner")
  throw Error("إنشاء إصدارات المعرفة متاح للمالك فقط");

 const formData=new FormData(f);
 const releaseVersion=Number(formData.get("release_version"));
 const platformCommit=String(formData.get("platform_commit")||"").trim()||null;
 const documentIds=[...new Set(formData.getAll("documents").map(String))];

 const latestVersion=Math.max(
  0,
  ...s.knowledgeReleases.map(x=>Number(x.release_version)||0)
 );

 if(!Number.isInteger(releaseVersion)||releaseVersion<=latestVersion)
  throw Error("رقم الإصدار يجب أن يكون أكبر من أحدث إصدار موجود");

 if(!documentIds.length)
  throw Error("اختر مستندًا معتمدًا واحدًا على الأقل");

 if(platformCommit&&platformCommit.length>100)
  throw Error("معرّف Commit أطول من المسموح");

 const documents=[];

 for(const documentId of documentIds){
  const {data,error}=await db.functions.invoke("prime-knowledge-admin",{
   body:{
    action:"get_document",
    document_id:documentId
   }
  });

  if(error)throw error;
  if(data?.error)throw Error(data.error);

  const doc=data?.document;
  if(!doc||doc.status!=="approved")
   throw Error("أحد المستندات المختارة لم يعد معتمدًا");

  const listed=s.knowledgeDocs.find(x=>x.id===documentId);
  if(!listed||Number(listed.document_version)!==Number(doc.document_version))
   throw Error("تغيّرت نسخة أحد المستندات. حدّث البيانات وأعد المحاولة");

  const content=String(doc.content||"").trim();
  if(!content||content.length>100000)
   throw Error("محتوى المستند غير صالح أو يتجاوز الحد المسموح");

  const chunks=[];
  let current="";

  const paragraphs=content.split(/\n\s*\n/);

  for(const paragraph of paragraphs){
   const part=paragraph.trim();
   if(!part)continue;

   if(part.length>15000){
    if(current){
     chunks.push(current);
     current="";
    }

    for(let i=0;i<part.length;i+=15000){
     chunks.push(part.slice(i,i+15000));
    }
    continue;
   }

   if(current&&current.length+part.length+2>15000){
    chunks.push(current);
    current=part;
   }else{
    current=current?current+"\n\n"+part:part;
   }
  }

  if(current)chunks.push(current);

  if(!chunks.length||chunks.length>1000)
   throw Error("تعذّر تقسيم محتوى أحد المستندات");

  documents.push({
   id:doc.id,
   title:doc.title,
   slug:doc.slug,
   version:Number(doc.document_version),
   chunks
  });
 }

 const manifest=documents.map(doc=>({
  document_id:doc.id,
  document_version:doc.version,
  chunk_count:doc.chunks.length
 }));

 const created=await db.functions.invoke("prime-knowledge-admin",{
  body:{
   action:"create_release",
   release_version:releaseVersion,
   platform_commit:platformCommit,
   document_manifest:manifest
  }
 });

 if(created.error)throw created.error;
 if(created.data?.error)throw Error(created.data.error);
 if(!created.data?.success||!created.data?.release_id)
  throw Error("لم يتم تأكيد إنشاء مسودة الإصدار");

 const releaseId=created.data.release_id;
 let addedChunks=0;

 try{
  for(const doc of documents){
   for(let i=0;i<doc.chunks.length;i++){
    const chunk=doc.chunks[i];

    const result=await db.functions.invoke("prime-knowledge-admin",{
     body:{
      action:"add_chunk",
      release_id:releaseId,
      document_id:doc.id,
      document_version:doc.version,
      chunk_index:i,
      content:chunk,
      token_estimate:Math.ceil(chunk.length/4),
      metadata:{
       title:doc.title,
       slug:doc.slug,
       category:s.knowledgeDocs.find(x=>x.id===doc.id)?.category||null
      }
     }
    });

    if(result.error)throw result.error;
    if(result.data?.error)throw Error(result.data.error);
    if(!result.data?.success)throw Error("لم يتم تأكيد إضافة جزء من المحتوى");

    addedChunks++;
   }
  }
 }catch(chunkError){
  throw Error(
   "تم إنشاء الإصدار كمسودة، لكن تعذّرت إضافة جميع الأجزاء. "+
   "معرّف المسودة: "+releaseId+
   " — الأجزاء المضافة: "+addedChunks+
   ". لم يتم نشر الإصدار أو حذف المسودة."
  );
 }

 s.modal=null;
 await loadPrimeKnowledge();
 note("تم تجهيز الإصدار كمسودة وإضافة جميع أجزاء المحتوى. لم يتم نشره.", "success");
 return;
}

const waslaPendingActions = new Set();
const waslaPendingForms = new Set();
const waslaOriginalDisabled = new WeakMap();

function waslaActionKey(button) {
  return [
    button.dataset.a || "",
    button.dataset.id || "",
    button.dataset.next || "",
    button.dataset.decision || ""
  ].join("|");
}

function waslaSetPending(control, pending) {
  if (pending) {
    if (!waslaOriginalDisabled.has(control)) {
      waslaOriginalDisabled.set(control, !!control.disabled);
    }

    if ("disabled" in control) control.disabled = true;

    control.classList.add("wasla-action-pending");
    control.setAttribute("aria-busy", "true");
  } else {
    if (waslaOriginalDisabled.has(control)) {
      if ("disabled" in control) {
        control.disabled = waslaOriginalDisabled.get(control);
      }
      waslaOriginalDisabled.delete(control);
    }

    control.classList.remove("wasla-action-pending");
    control.removeAttribute("aria-busy");
  }
}

function waslaSyncPendingUI() {
  app.querySelectorAll("[data-a]").forEach(button => {
    waslaSetPending(
      button,
      waslaPendingActions.has(waslaActionKey(button))
    );
  });

  app.querySelectorAll("form[id]").forEach(form => {
    const pending = waslaPendingForms.has(form.id);

    form.querySelectorAll(
      'button[type="submit"], button:not([type]), input[type="submit"]'
    ).forEach(control => {
      waslaSetPending(control, pending);
    });
  });
}

const waslaPendingObserver = new MutationObserver(waslaSyncPendingUI);
waslaPendingObserver.observe(app, {
  childList: true,
  subtree: true

  });
let chatMicSession=0;
let chatMicStarting=false;
let chatMicStopRequested=false;

function chatMicHaptic(){
 try{
  if(navigator.vibrate)navigator.vibrate(18);
 }catch(_){}
}

function resetChatMicButton(){
 const button=document.getElementById("chatMicButton");
 if(!button)return;

 button.title="تسجيل رسالة صوتية";
 button.classList.remove("is-recording");
 wcRecUi(false);
 wcSyncAction();
 button.setAttribute("aria-label","بدء التسجيل");
 button.style.background="";
 button.style.color="";
}

app.addEventListener("click",async e=>{
 const button=e.target.closest?.("#chatMicButton");
 if(!button)return;

 e.preventDefault();
 if(button.dataset.mode==="send"){
  const f=document.getElementById("sendMessage");
  if(f&&f.requestSubmit)f.requestSubmit();
  return;
 }

 // الضغطة الثانية أثناء انتظار إذن الميكروفون
 if(chatMicStarting){
  chatMicStopRequested=true;
  button.title="جاري إلغاء بدء التسجيل...";
  return;
 }

 // الضغطة الثانية أثناء التسجيل توقفه
 if(s.chatRecorder?.state==="recording"){
  chatMicStopRequested=true;
  s.chatRecorder.stop();
  return;
 }

 if(s.chatRecording)return;

 const session=++chatMicSession;
 chatMicStarting=true;
 chatMicStopRequested=false;
 chatMicHaptic();

 button.title="جاري تشغيل الميكروفون — اضغط للإلغاء";

 let stream=null;

 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
   throw Error("التسجيل الصوتي غير مدعوم في هذا المتصفح.");
  }

  stream=await navigator.mediaDevices.getUserMedia({audio:true});

  if(
   session!==chatMicSession||
   chatMicStopRequested||
   !document.getElementById("chatMicButton")
  ){
   stream.getTracks().forEach(track=>track.stop());

   if(session===chatMicSession){
    chatMicStarting=false;
    chatMicStopRequested=false;
    resetChatMicButton();
   }
   return;
  }

  const candidates=[
   "audio/webm;codecs=opus",
   "audio/ogg;codecs=opus",
   "audio/mp4"
  ];

  const selectedType=candidates.find(type=>
   MediaRecorder.isTypeSupported(type)
  );

  const recorder=selectedType
   ?new MediaRecorder(stream,{mimeType:selectedType})
   :new MediaRecorder(stream);

  const mimeType=(recorder.mimeType||selectedType||"audio/webm")
   .split(";")[0].toLowerCase();

  if(!["audio/webm","audio/ogg","audio/mp4"].includes(mimeType)){
   throw Error("صيغة التسجيل الصوتي غير مدعومة.");
  }

  const chunks=[];
  const startedAt=Date.now();

  recorder.addEventListener("dataavailable",event=>{
   if(event.data?.size)chunks.push(event.data);
  });

  recorder.addEventListener("stop",()=>{
   stream.getTracks().forEach(track=>track.stop());

   if(s.chatRecorder===recorder){
    s.chatRecorder=null;
    s.chatRecording=false;
   }

   if(session===chatMicSession){
    chatMicStarting=false;
    chatMicStopRequested=false;
    resetChatMicButton();
   }

   if(!chunks.length){
    note("لم يتم تسجيل صوت. حاول مرة أخرى.","error");
    return;
   }

   const extensions={
    "audio/webm":"webm",
    "audio/ogg":"ogg",
    "audio/mp4":"mp4"
   };

   const blob=new Blob(chunks,{type:mimeType});
   const file=new File(
    [blob],
    "voice-message-"+Date.now()+"."+extensions[mimeType],
    {type:mimeType,lastModified:Date.now()}
   );

   s.chatMediaDurationSeconds=Math.max(
    1,Math.round((Date.now()-startedAt)/1000)
   );

   const input=document.querySelector("#chatMediaInput");

   if(!input){
    s.chatAttachment=file;
    return;
   }

   const transfer=new DataTransfer();
   transfer.items.add(file);
   input.files=transfer.files;
   input.dispatchEvent(new Event("change",{bubbles:true}));
  });

  recorder.start(250);

  s.chatRecorder=recorder;
  s.chatRecording=true;
  chatMicStarting=false;

  const activeButton=document.getElementById("chatMicButton");

  if(activeButton){
   activeButton.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>';
   activeButton.classList.add("is-recording");
   wcRecUi(true);
   activeButton.title="اضغط لإيقاف التسجيل";
   activeButton.setAttribute("aria-label","إيقاف التسجيل");
  }

 }catch(error){
  stream?.getTracks().forEach(track=>track.stop());

  if(session===chatMicSession){
   chatMicStarting=false;
   chatMicStopRequested=false;
   s.chatRecorder=null;
   s.chatRecording=false;
   resetChatMicButton();
  }

  note(error.message||"تعذر بدء التسجيل الصوتي.","error");
 }
});


let chatLocationSending = false;

app.addEventListener("click", async e => {
  const button = e.target.closest?.("#chatLocationButton");
  if (!button) return;

  e.preventDefault();

  if (chatLocationSending) return;

  const conversationId = s.activeChat?.id;
  const senderId = s.user?.id;

  if (!conversationId || !senderId) {
    note("افتح محادثة نشطة أولًا.", "error");
    return;
  }

  chatLocationSending = true;
  button.disabled = true;
  button.setAttribute("aria-busy", "true");

  let saved = false;

  try {
    if (window.isSecureContext === false) {
      throw Error("مشاركة الموقع تتطلب فتح المنصة عبر اتصال آمن HTTPS.");
    }

    if (!navigator.geolocation) {
      throw Error("المتصفح لا يدعم تحديد الموقع.");
    }

    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 30000
        }
      );
    });

    if (
      s.activeChat?.id !== conversationId ||
      s.user?.id !== senderId
    ) {
      throw Error("تم تغيير المحادثة. افتح المحادثة المطلوبة وحاول مرة أخرى.");
    }

    const latitude = Number(position.coords.latitude);
    const longitude = Number(position.coords.longitude);

    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude) ||
      latitude < -90 ||
      latitude > 90 ||
      longitude < -180 ||
      longitude > 180
    ) {
      throw Error("تعذر الحصول على إحداثيات موقع صحيحة.");
    }

    const inserted = await db.from("messages").insert({
      conversation_id: conversationId,
      sender_id: senderId,
      message_text: "📍 تمت مشاركة الموقع",
      message_type: "location",
      attachment_path: null,
      attachment_mime_type: null,
      attachment_size_bytes: null,
      location_latitude: latitude,
      location_longitude: longitude
    });

    if (inserted.error) throw inserted.error;

    saved = true;

    if (s.activeChat?.id !== conversationId) {
      note("تم إرسال موقعك بنجاح.", "success");
      return;
    }

    const q = await db.from("messages")
      .select("id,sender_id,message_text,is_read,created_at,message_type,attachment_path,attachment_mime_type,attachment_size_bytes,media_duration_seconds,location_latitude,location_longitude,delivered_at,thumbnail_path,attachment_name")
      .eq("conversation_id", conversationId)
      .order("created_at");

    if (q.error) {
      note("تم إرسال الموقع، لكن تعذر تحديث عرض الرسائل. أعد فتح المحادثة.", "success");
      return;
    }

    s.messages = q.data || [];
    await loadChatMediaUrls(s.messages);

    render();
    note("تم إرسال موقعك بنجاح.", "success");

  } catch (error) {
    if (saved) {
      note("تم إرسال الموقع، لكن تعذر تحديث عرض المحادثة.", "success");

      note("لم تسمح بمشاركة الموقع. يمكنك تفعيل إذن الموقع من إعدادات المتصفح.", "error");

    }

app.addEventListener("click", async e => {

  // إظهار وإخفاء كلمة المرور
  const passwordToggle = e.target.closest("[data-password-toggle]");
  if (passwordToggle) {
    const passwordInput =
      passwordToggle.parentElement.querySelector('input[name="password"]');

    if (passwordInput) {
      const showPassword = passwordInput.type === "password";
      passwordInput.type = showPassword ? "text" : "password";
      passwordToggle.textContent = showPassword ? "إخفاء" : "إظهار";
      passwordToggle.setAttribute(
        "aria-label",
        showPassword ? "إخفاء كلمة المرور" : "إظهار كلمة المرور"
      );
      passwordToggle.setAttribute("aria-pressed", String(showPassword));
    }
    return;
  }

  // إغلاق النافذة عند الضغط على الخلفية
  if (s.modal && e.target.classList.contains("modalback")) {
    s.modal = null;
    render();
    return;
  }

  const button = e.target.closest("[data-a]");
  if (!button) return;

  // إغلاق النافذة عند اختيار إجراء خارجها
  if (s.modal && !button.closest(".modal")) {
    s.modal = null;
  }

  const key = waslaActionKey(button);
  if (waslaPendingActions.has(key)) return;

  waslaPendingActions.add(key);
  waslaSyncPendingUI();

  try {
    await action(button.dataset.a, button.dataset.id, button);
  } finally {
    waslaPendingActions.delete(key);
    waslaSyncPendingUI();
  }
});


app.addEventListener("submit", async e => {
  const form = e.target;
  if (!form?.id) return;

  if (waslaPendingForms.has(form.id)) {
    e.preventDefault();
    return;
  }

  waslaPendingForms.add(form.id);
  waslaSyncPendingUI();

  try {
    await submit(e);
  } finally {
    waslaPendingForms.delete(form.id);
    waslaSyncPendingUI();
  }
});

async function boot(){
 const status=t=>{
  app.innerHTML='<main class="wrap"><div class="empty">'+t+'</div></main>';
 };
 const recoveryMode=new URLSearchParams(location.search).get("mode")==="recovery"||new URLSearchParams(location.hash.slice(1)).get("type")==="recovery";
 if(recoveryMode)s.mode="recovery";

 try{
  await Promise.race([
   publicData(),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),15000))
  ]);
 }catch(e){
  status("توقف التحميل في المرحلة 1: بيانات الخدمات والتصنيفات.");
  return;
 }

 try{
  await loadGeoCatalog();
 }catch(e){
  console.warn("Geo catalog loading failed:",e);
 }

 let r;
 try{
  r=await Promise.race([
   db.auth.getSession(),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),15000))
  ]);
 }catch(e){
  status("توقف التحميل في المرحلة 2: جلسة تسجيل الدخول.");
  return;
 }

 if(recoveryMode){
  s.mode="recovery";
  render();
 }else if(r.data.session?.user){
  
  try{
   const saved=JSON.parse(sessionStorage.getItem("wasla_view_v1")||"null");
   if(saved&&saved.uid===r.data.session.user.id&&typeof saved.tab==="string"&&saved.tab!=="account"&&saved.tab!=="providerDossier"){
    s.tab=saved.tab;
    if(typeof saved.rf==="string")s.requestFilter=saved.rf;
   }
  }catch(_){}
  await loadUser(r.data.session.user);
 }else{
  s.mode="welcome";
  render();
 }

 db.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY"||(recoveryMode&&session?.user)){
   s.mode="recovery";
   render();
   return;
  }
  if(session?.user&&session.user.id!==s.user?.id){
   s.tab="home";
   try{sessionStorage.removeItem("wasla_view_v1")}catch(_){}
   loadUser(session.user);
  }
  else if(!session){
   s.user=null;
   s.profile=null;
   s.provider=null;
   if(s.staffSuspended)return;
   if(s.mode!=="recovery")render();
  }
 });
}

boot().catch(e=>{console.error(e);app.innerHTML='<main class="wrap">'+empty("تعذّر تحميل المنصة. تحقق من الاتصال ثم أعد المحاولة.")+'</main>'});
})();

<script>
(() => {
  const root = document.documentElement;
  const app = document.getElementById("app");
  if (!app) return;

  let mode = "light";

  try {
    mode = localStorage.getItem("wasla_color_mode") === "dark"
      ? "dark"
      : "light";
  } catch (e) {}

  const applyTheme = () => {
  root.setAttribute("data-theme", mode);

  try {
    localStorage.setItem("wasla_color_mode", mode);
    localStorage.removeItem("wasla_theme_draft");
  } catch (e) {}

  const button = app.querySelector(".theme-toggle");

  if (button) {
    button.textContent = mode === "dark" ? "☀" : "☾";

    button.setAttribute(
      "aria-label",
      mode === "dark" ? "التبديل للوضع النهاري" : "التبديل للوضع الليلي"
    );

    button.setAttribute(
      "title",
      mode === "dark" ? "الوضع النهاري" : "الوضع الليلي"
    );
  }
};

const addButton = () => {
  const header = app.querySelector(".topline");
  const welcome = app.querySelector(".wasla-welcome");
  const target = header || welcome;

  if (!target || target.querySelector(".theme-toggle")) return;

  const button = document.createElement("button");
  button.type = "button";
  button.className = "theme-toggle";
  button.setAttribute("aria-label", "تبديل الوضع");

  button.addEventListener("click", () => {
    mode = mode === "dark" ? "light" : "dark";
    applyTheme();
    try { window.waslaThemeSync && window.waslaThemeSync.mode(mode); } catch (e) {}
  });

  if (header) {
    const brand = header.querySelector(".brand-lockup");

    if (brand) {
      brand.insertAdjacentElement("afterend", button);
    } else {
      header.appendChild(button);
    }
  } else {
    welcome.prepend(button);
  }

  applyTheme();
};

  window.__waslaSetMode = (m) => {
    const nm = m === "dark" ? "dark" : "light";
    if (nm === mode) return;
    mode = nm;
    applyTheme();
  };

  applyTheme();
  addButton();

  new MutationObserver(addButton).observe(app, {
    childList: true,
    subtree: true
  });
})();

.wth-back{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.wth-panel{width:min(100%,640px);max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-color);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.wth-back{align-items:center}.wth-panel{border-radius:20px}}
.wth-panel h3{margin:0 0 4px;font:800 19px Tajawal,sans-serif}.wth-panel p{margin:0 0 12px;color:var(--text-secondary);font-size:13px}
.wth-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.wth-grid{grid-template-columns:repeat(3,1fr)}}
.wth-tile{border:2px solid var(--border-color);background:var(--bg-subtle);color:var(--text-primary);border-radius:14px;padding:8px;text-align:center;cursor:pointer;font:700 13px Tajawal,sans-serif}
.wth-tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.wth-mini{border-radius:9px;padding:6px;margin-bottom:6px;border:1px solid transparent}
.wth-mini i{display:block;height:12px;border-radius:5px;margin-bottom:5px}
.wth-mini .r{display:flex;gap:4px}.wth-mini .r b{flex:1;height:10px;border-radius:4px;display:block}
.wth-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:0;background:var(--bg-surface);padding-top:8px}
.wth-actions button{flex:1 1 auto;min-height:44px;border-radius:11px;border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-primary);font:700 14px Tajawal,sans-serif;cursor:pointer}
.wth-actions button.go{background:var(--primary);border-color:var(--primary);color:var(--bg-surface)}

.notif-bell{position:relative;border:1px solid var(--border-color);background:var(--bg-subtle);color:var(--text-primary);border-radius:8px;width:38px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;padding:0}
.topline > .notif-bell{margin-inline-start:8px}
.topline > .theme-toggle ~ .notif-bell{margin-inline-start:0}
.notif-ask::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:8px;height:8px;border-radius:50%;background:#EA580C}
.notif-badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#DC2626;color:#fff;font:800 11px Tajawal,sans-serif;align-items:center;justify-content:center}
.notif-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.notif-head h3{margin:0}
.notif-link{border:0;background:none;color:var(--primary);font:700 13px Tajawal,sans-serif;cursor:pointer;padding:6px}
.notif-perm{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-subtle);border:1px solid var(--border-color);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.notif-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--border-color);padding:12px 4px;color:var(--text-primary);cursor:pointer;font:inherit}
.notif-item.unread{background:var(--bg-subtle)}
.notif-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:transparent}
.notif-item.unread .notif-dot{background:#DC2626}
.notif-txt{display:flex;flex-direction:column;gap:2px;min-width:0}.notif-txt b{font-size:14px}.notif-txt span{font-size:13px;color:var(--text-secondary);overflow-wrap:anywhere}.notif-txt small{font-size:11px;color:var(--text-secondary)}

.inst-banner{position:fixed;inset-inline:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:1500;display:flex;align-items:center;gap:10px;max-width:520px;margin-inline:auto;background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-color);border-radius:16px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.inst-banner img{border-radius:10px;flex:0 0 auto}
.inst-txt{display:flex;flex-direction:column;min-width:0;flex:1}.inst-txt b{font-size:14px}.inst-txt span{font-size:12px;color:var(--text-secondary)}
.inst-go{border:0;background:#D6A642;color:#1b1405;font:800 14px Tajawal,sans-serif;border-radius:10px;padding:9px 16px;cursor:pointer;flex:0 0 auto}
.inst-x{border:0;background:none;color:var(--text-secondary);font-size:16px;cursor:pointer;padding:6px;flex:0 0 auto}
.inst-steps{margin:0 0 14px;padding-inline-start:20px;line-height:2;font-size:14px}.inst-share{display:inline-block;border:1px solid var(--border-color);border-radius:6px;padding:0 6px}

.topline{justify-content:flex-start!important}
.topline > .theme-toggle{margin-inline-start:auto!important}
.topline > .notif-bell{margin-inline-start:0!important}
.topline > .brand-lockup + .notif-bell{margin-inline-start:auto!important}
.notif-badge.zero{background:var(--border-color);color:var(--text-secondary)}
.notif-ask::after{top:auto;bottom:3px}

.setup-card{position:fixed;inset-inline:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:1500;max-width:480px;margin-inline:auto;direction:rtl;color:#F9FAFB;background:linear-gradient(145deg,#1d222a 0%,#121417 100%);border:1px solid rgba(214,166,66,.45);border-radius:20px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);font-family:Tajawal,sans-serif}
.sc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sc-logo{width:38px;height:38px;flex:0 0 auto;background:#0b0d0f;border-radius:11px;padding:6px;border:1px solid rgba(214,166,66,.35)}
.sc-title{display:flex;flex-direction:column;flex:1;min-width:0}.sc-title b{font-size:16px;font-weight:800}.sc-title span{font-size:12px;color:#9CA3AF}
.sc-x{border:0;background:rgba(255,255,255,.08);color:#D1D5DB;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:12px;flex:0 0 auto}
.sc-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.05);margin-top:8px}
.sc-row.done{background:rgba(42,157,143,.14)}
.sc-num{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:rgba(214,166,66,.18);color:#D6A642;border:1px solid rgba(214,166,66,.5)}
.sc-row.done .sc-num{background:#2A9D8F;color:#fff;border-color:#2A9D8F}
.sc-txt{display:flex;flex-direction:column;flex:1;min-width:0}.sc-txt b{font-size:14px}.sc-txt span{font-size:12px;color:#9CA3AF}
.sc-btn{border:0;background:#D6A642;color:#1b1405;font:800 13px Tajawal,sans-serif;border-radius:10px;padding:9px 14px;cursor:pointer;flex:0 0 auto}

.wid{position:relative;overflow:hidden;direction:rtl;color:#F9FAFB;background:linear-gradient(135deg,#1d222a 0%,#101216 60%,#1a1608 100%);border:1px solid rgba(214,166,66,.55);border-radius:22px;padding:16px;box-shadow:0 14px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07);animation:widIn .55s cubic-bezier(.2,.8,.2,1) both}
.wid-shine{position:absolute;top:0;bottom:0;width:60%;inset-inline-start:-80%;background:linear-gradient(105deg,transparent 30%,rgba(214,166,66,.22) 50%,transparent 70%);transform:skewX(-12deg);animation:widShine 5.5s ease-in-out 1s infinite;pointer-events:none}
.wid-wm{position:absolute;inset-inline-end:-18px;bottom:-26px;width:150px;height:150px;color:rgba(214,166,66,.10);pointer-events:none}
.wid-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:relative}
.wid-brand{font:800 15px Tajawal,sans-serif;letter-spacing:.3px}.wid-brand i{font-style:normal;font-size:10px;color:#D6A642;letter-spacing:2px;margin-inline-start:6px}
.wid-chip{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,#E8C463,#B68A2B);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);position:relative}
.wid-chip::after{content:"";position:absolute;inset:6px 8px;border:1px solid rgba(0,0,0,.28);border-radius:3px}
.wid-main{display:flex;align-items:center;gap:14px;position:relative}
.wid-av{width:76px;height:76px;flex:0 0 auto;border-radius:50%;background:#0b0d0f;border:2px solid #D6A642;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 4px rgba(214,166,66,.15);animation:widFloat 4.5s ease-in-out infinite}
.wid-av img{width:100%;height:100%;object-fit:cover}.wid-av svg{width:46px;height:46px}
.wid-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.wid-name{font:800 19px Tajawal,sans-serif;overflow-wrap:anywhere}.wid-sub{font-size:12.5px;color:#9CA3AF}
.wid-tag{align-self:flex-start;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:#E5E7EB}.wid-tag.ok{background:rgba(42,157,143,.22);color:#5FD3C4}
.wid-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative}
.wid-stats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:9px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.wid-stats b{font:800 18px Tajawal,sans-serif;color:#D6A642}.wid-stats span{font-size:11px;color:#9CA3AF}
.wid-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.14);font-size:12px;color:#9CA3AF;position:relative}.wid-foot b{font:700 13px ui-monospace,Menlo,monospace;letter-spacing:1.5px;color:#F3E3B3}
@keyframes widIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes widShine{0%,60%{inset-inline-start:-80%}100%{inset-inline-start:130%}}
@keyframes widFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.wid,.wid-shine,.wid-av{animation:none}}
</style>
</body></html>
