  (r.length ? r.map(q => {

    }

    if(q.st === "اتنفذ" && !q.rated) {

  '<h3>'+L("طلباتك","Your Jobs")+'</h3>' +

V.twallet = function(){
  var L_tech = S.ledger.filter(j => j.tech === SES.n);
  var totalEarn = sum(L_tech, j => j.amt);
  var totalCom = sum(L_tech, j => j.com);
  var netEarn = totalEarn - totalCom;
  var pendingAmt = sum(S.reqs.filter(q => q.tech === SES.n && q.st === "مقبول"), q => q.quote || 0);
  var withdrawn = sum(S.withdrawals.filter(w => w.tech === SES.n && w.status === "تم التحويل"), w => w.amt);
  var available = netEarn - withdrawn;

  return '<h3 style="margin-top:14px">💳 '+L("محفظتي المالية","My Wallet")+'</h3>' +
    stats([
      [L("إجمالي الأرباح","Total Earnings"), fmt(totalEarn)],
      [L("عمولة المنصة","App Commission"), fmt(totalCom)],
      [L("الأرباح المستحقة (الصافي)","Net Available"), fmt(available)],
      [L("مبالغ معلقة (قيد التنفيذ)","Pending Escrow"), fmt(pendingAmt)],
      [L("إجمالي السحوبات","Withdrawn"), fmt(withdrawn)]
    ]) +
    '<div class="box"><b>'+L("طلب سحب أرباح","Request Withdrawal")+'</b><label>'+L("المبلغ المطلوب","Amount")+'<input id="wd_amt" type="number" max="'+available+'" value="'+Math.max(0, available)+'"></label><button class="btn sec" data-act="reqWithdraw">'+L("إرسال طلب سحب","Withdraw")+'</button></div>' +

    '</div>';
};

function getOrCreateChat(type, refId, title, userRole, userId, userName){
  var ch = S.chats.filter(c => c.type === type && String(c.refId) === String(refId))[0];
  if(!ch){
    ch = { id: "TKT-" + String(Date.now()).slice(-6), type: type, refId: refId, title: title, userRole: userRole, userId: userId, userName: userName, status: "مفتوحة", msgs: [] };
    S.chats.push(ch);
    save();
  }
  return ch;
}

function renderChatRoom(chatId){
  var ch = S.chats.filter(c => c.id === chatId)[0];
  if(!ch) return;
  ST.activeChat = chatId;
  var msgsHtml = ch.msgs.length ? ch.msgs.map(m => {
    var isMe = m.sender === SES.n;
    var body = '';
    if(m.type === 'text') body = esc(m.text);
    else if(m.type === 'img') body = '<img src="'+m.data+'" style="max-width:100%;border-radius:8px;margin-top:4px">';
    else if(m.type === 'voice') body = '<audio controls src="'+m.data+'" style="max-width:200px;height:32px;margin-top:4px"></audio>';
    else if(m.type === 'loc') body = '<a class="btn wa sm" target="_blank" href="https://maps.google.com/?q='+m.data+'">📍 '+L("فتح الموقع على الخريطة","Open Location")+'</a>';

    return '<div style="margin-bottom:8px;text-align:'+(isMe?'right':'left')+'"><div style="display:inline-block;max-width:80%;background:'+(isMe?'var(--n1)':'var(--bg)')+';color:'+(isMe?'#fff':'var(--ink)')+';padding:8px 12px;border-radius:14px"><small style="opacity:.7;display:block;font-size:11px">'+esc(m.sender)+' ('+esc(m.role)+') · '+m.time+'</small>'+body+'</div></div>';
  }).join("") : '<div class="empty">'+L("ابدأ المحادثة الآن...","Start chatting...")+'</div>';

  sheet('<div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(ch.title)+'</b><span class="tag due">'+ch.id+'</span></div>' +
    '<div id="chatBox" style="height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:var(--card)">'+msgsHtml+'</div>' +
    '<div style="display:flex;gap:6px;margin-bottom:6px">' +
      '<label class="btn dark sm" style="margin:0;cursor:pointer">📷 صورة<input type="file" accept="image/*" style="display:none" data-act="chatImg" data-id="'+ch.id+'"></label>' +
      '<button class="btn dark sm" style="margin:0" id="recBtn" data-act="chatVoice" data-id="'+ch.id+'">🎤 صوت</button>' +
      '<button class="btn dark sm" style="margin:0" data-act="chatLoc" data-id="'+ch.id+'">📍 موقعي</button>' +
      '<a class="btn wa sm" style="margin:0" target="_blank" href="https://wa.me/'+ADMINWA+'?text='+encodeURIComponent("تذكرة دعم رقم: "+ch.id+" - "+SES.n)+'">واتساب</a>' +
    '</div>' +

    '<button class="btn ghost" data-act="close">'+L("إغلاق","Close")+'</button>');
  var cb = $("chatBox"); if(cb) cb.scrollTop = cb.scrollHeight;
}

    S.reqs.forEach(q => { if(String(q.id) === d.id) q.st = "جديد"; });
    save(); draw();
  }
  else if(d.act === "doneQuoted"){
    S.reqs.forEach(q => {

        var T = tier(S.ledger.filter(j => j.tech === q.tech).length);

    });

  }
  else if(d.act === "submitRate"){

    if(q && tt){
      tt.rc = tt.rc || (tt.r ? 5 : 0);

document.body.addEventListener("click", function(e){
  var a = e.target.closest("[data-act]"); if(!a) return;
  var d = a.dataset;
  if(d.act === "pregFull"){
    var g = k => $("pg"+k).value.trim();
    var er = $("gerr");
    var fAv = $("pg_av").files[0], f1 = $("pg13").files[0], f2 = $("pg14").files[0];
    
    if(!g(1) || !g(5) || !okFull(g(3), g(4)) || !/^\d{4}$/.test(g(10))){

      return;
    }
    if(!fAv || !f1 || !f2){
      er.textContent = L("⚠️ تنبيه: الصورة الشخصية وصورتا الهوية (وش وضهر) إجبارية لإتمام التسجيل.", "⚠️ Warning: Profile picture and ID front/back are mandatory.");
      return;
    }
    var fp = fullPh(g(3), g(4));
    if(S.techs.some(t => t.w === fp || t.n === g(1))){
      er.textContent = L("الاسم أو رقم الهاتف مسجّل مسبقاً.", "Name or phone already registered.");
      return;
    }
    er.textContent = L("جاري معالجة الصور ورفع الملفات...", "Processing images...");
    
    Promise.all([img(fAv), img(f1), img(f2)]).then(imgs => {
      var newT = {
        n: g(1), t: g(2), a: g(6), w: fp, pin: g(10), p: g(11), b: g(12),
        y: 1, r: 0, rc: 0, on: false, act: false, cc: g(3), city: g(5),
        addr: g(7), lat: ST.loc?ST.loc[0]:null, lng: ST.loc?ST.loc[1]:null,
        avatar: imgs[0], idf: imgs[1], idb: imgs[2]
      };
      if(S.areas.indexOf(g(6)) < 0) S.areas.push(g(6));
      S.techs.push(newT);
      lg("طلب تسجيل مقدم خدمة جديد معلق: " + g(1));
      save(); ST.ver = null; ST.reg = "done"; draw();
    }).catch(() => { er.textContent = L("فشل قراءة إحدى الصور، يجدر المحاولة بصورة أصغر.", "Failed to read images."); });
  }
});

  var exp = sum(S.expenses, e => e.amt);

  return '<h3 style="margin-top:14px">💎 التقارير المالية والإدارة المركزية</h3>' +

      ["صافي أرباح المنصة الفعلي", fmt(net) + " ج.م"],
      ["العمولات المتحصلة", fmt(collected) + " ج.م"],
