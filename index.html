/* WASLA — Unified Components 2.3 */

/* Surfaces and cards */
.card, .item, .modal, .empty {
  background: var(--bg-surface) !important;
  color: var(--text-primary) !important;
  border: 1px solid var(--border-color) !important;
}

  box-shadow: var(--surface-shadow) !important;
}
.card p, .item p, .muted, .small, .foot {
  color: var(--text-secondary) !important;
}
.card:hover, .item:hover {
  border-color: var(--primary) !important;
}

/* Form controls */
.field, label, .modal label {
  color: var(--text-primary);
}
input:not([type="checkbox"]):not([type="radio"]),
select, textarea {
  background: var(--bg-surface) !important;
  color: var(--text-primary) !important;
  border: 1px solid var(--border-color) !important;
  border-radius: var(--control-radius);
}
input::placeholder, textarea::placeholder {
  color: var(--text-secondary) !important;
  opacity: 1;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary) !important;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
}
select option {
  background: var(--bg-surface);
  color: var(--text-primary);
}

/* Buttons */
.btn, .tabs button, .top .nav button {
  min-height: 40px;
  border-radius: var(--control-radius);
  font-family: inherit;
  font-weight: 700;
}
.btn {
  background: var(--primary) !important;
  color: #FFFFFF !important;
  border: 1px solid var(--primary) !important;
}
.btn.gold {
  background: var(--accent) !important;
  color: var(--text-primary) !important;
  border-color: var(--accent) !important;
}
.btn.light {
  background: var(--bg-subtle) !important;
  color: var(--text-primary) !important;
  border-color: var(--border-color) !important;
}
.btn.green {
  background: var(--success-bg) !important;
  color: var(--success) !important;
  border-color: var(--success) !important;
}
.btn.danger {
  background: var(--danger-bg) !important;
  color: var(--danger) !important;
  border-color: var(--danger) !important;
}

/* Tabs and header navigation */
.tabs button {
  background: var(--bg-surface) !important;
  color: var(--text-primary) !important;
  border: 1px solid var(--border-color) !important;
}
.tabs button.active,
.tabs button[aria-selected="true"] {
  background: var(--primary) !important;
  color: #FFFFFF !important;
  border-color: var(--primary) !important;
}
.top .nav button {
  background: var(--bg-surface) !important;
  color: var(--text-primary) !important;
  border: 1px solid var(--border-color) !important;
}
.top .nav button.active {
  background: var(--primary) !important;
  color: #FFFFFF !important;
  border-color: var(--primary) !important;
}

/* Status labels and notices */
.tag {
  background: var(--bg-subtle) !important;
  color: var(--text-primary) !important;
  border: 1px solid var(--border-color) !important;
}
.tag.ok, .notice.success {
  background: var(--success-bg) !important;
  color: var(--success) !important;
  border-color: var(--success) !important;
}
.tag.wait {
  background: var(--warning-bg) !important;
  color: var(--warning) !important;
  border-color: var(--warning) !important;
}
.tag.bad, .notice.error {
  background: var(--danger-bg) !important;
  color: var(--danger) !important;
  border-color: var(--danger) !important;
}
.notice {
  background: var(--bg-surface) !important;
  color: var(--text-primary) !important;
  border: 1px solid var(--border-color) !important;
}

/* Focus, disabled and transitions */
button:focus-visible, a:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent) !important;
  outline-offset: 3px;

.btn:disabled, .tabs button:disabled,
.top .nav button:disabled,
input:disabled, select:disabled, textarea:disabled {

button, input, select, textarea,
.card, .item, .modal, .empty {

/* ===== Promo code at quote acceptance (fail-soft: needs validate_promotion / redeem_promotion / get_request_discount) ===== */
function promoErrAr(m){m=String(m||"");if(/expire|ended|date/i.test(m))return"الكود انتهت صلاحيته.";if(/limit|exhaust|max|used/i.test(m))return"الكود وصل للحد الأقصى من الاستخدام.";return"الكود ما اتطبقش. حاول تاني."}
async function payPromoApply(requestId){
 s.payCode=s.payCode||{};
 const inp=document.querySelector('[data-pc="'+requestId+'"]');
 const code=String((inp&&inp.value)||"").trim().toUpperCase();
 const p=s.payments&&s.payments[requestId],rq=(s.requests||[]).find(x=>x.id===requestId);
 if(!code){s.payCode[requestId]={code:"",msg:"اكتب كود الخصم الأول.",valid:false};render();return}
 s.payCode[requestId]={code,msg:"جاري التحقق...",valid:false,busy:true};render();
 try{
  const v=await db.rpc("validate_promotion",{p_code:code,p_service_id:(rq&&rq.service_id)||null,p_amount:Number(p&&p.amount)||0});
  if(v.error)throw v.error;
  const d=v.data||{};
  if(!d.valid){s.payCode[requestId]={code,msg:d.message||"الكود غير صحيح",valid:false};render();return}
  const r=await db.rpc("redeem_promotion",{p_code:code,p_request_id:requestId});
  if(r.error){s.payCode[requestId]={code,msg:promoErrAr(r.error.message),valid:false};render();return}
  s.payCode[requestId]={code,msg:"تم تطبيق الكود.",valid:true};
  if(s.reqDisc)delete s.reqDisc[requestId];
  await loadReqDisc(requestId);
 }catch(err){s.payCode[requestId]={code,msg:"تعذّر التحقق من الكود دلوقتي. جرب بعد شوية.",valid:false};render()}
}
async function loadReqDisc(requestId){
 s.reqDisc=s.reqDisc||{};
 if(s.reqDisc[requestId]!==undefined)return;
 s.reqDisc[requestId]=null;
 try{
  const r=await db.rpc("get_request_discount",{p_request_id:requestId});
  if(r.error)throw r.error;
  s.reqDisc[requestId]=(r.data&&r.data.has_discount)?r.data:false;
 }catch(err){s.reqDisc[requestId]=false}
 render();
}

function repCatalogRows(t,f){

 const cats=s.cats||[],svcs=s.services||[],cm={};cats.forEach(c=>cm[c.id]=c);
 const agg=(list)=>{const o={reqs:list.length,done:0,cancel:0,value:0,comm:0,rs:[],last:null};list.forEach(r=>{if(r.status==="completed")o.done++;if(r.status==="cancelled"||r.status==="canceled")o.cancel++;const p=C.pays[r.id];if(p&&p.payment_status==="paid"){o.value+=Number(p.amount||0);o.comm+=Number(p.commission_amount||0)}const v=C.rev[r.id];if(v&&v.rating!=null)o.rs.push(Number(v.rating));if(!o.last||String(r.created_at)>String(o.last))o.last=r.created_at});return o};
 const stt=x=>x?"نشط":"متوقف";
 if(t==="services")return svcs.map(x=>{const o=agg(rs.filter(r=>r.service_id===x.id)),own=s.svcRates&&s.svcRates.map?s.svcRates.map[x.id]:null,def=s.svcRates?s.svcRates.def:null;return {code:repCode("SVC",x.id),name:x.name_ar||null,section:(cm[x.category_id]||{}).name_ar||null,scode:x.category_id?repCode("SEC",x.category_id):null,status:stt(x.is_active),rate:own!=null?own:(def!=null?def:null),reqs:o.reqs,done:o.done,cancel:o.cancel,value:o.value,comm:o.comm,rating:o.rs.length?Math.round(o.rs.reduce((a,b)=>a+b,0)/o.rs.length*10)/10:null,last:o.last}}).sort((a,b)=>b.reqs-a.reqs);
 const sv={};svcs.forEach(x=>sv[x.id]=x);
 return cats.map(c=>{const ids=new Set(svcs.filter(x=>x.category_id===c.id).map(x=>x.id)),o=agg(rs.filter(r=>ids.has(r.service_id)));return {code:repCode("SEC",c.id),name:c.name_ar||null,slug:c.slug||null,status:stt(c.is_active),svcs:ids.size,reqs:o.reqs,done:o.done,value:o.value,comm:o.comm}}).sort((a,b)=>b.reqs-a.reqs);
}

function repFileName(ext){const t=REP.tab;return "wasla-"+t+"-"+new Date().toISOString().slice(0,10)+"."+ext}

async function repXlsx(){
 await repLoadScript("https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js");
 const t=REP.tab,vis=repVis(t),rows=repFiltered(t);
 const aoa=[vis.map(c=>c.l)].concat(rows.map(r=>vis.map(c=>{const v=r[c.k];if(v===null||v===undefined||v==="")return "";if(c.t==="money"||c.t==="num")return Number(v);return repText(c,v)})));
 const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=vis.map(c=>({wch:Math.max(12,Math.min(32,c.l.length+6))}));
 const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,repTitle().slice(0,28));
 XLSX.writeFile(wb,repFileName("xlsx"));
}
async function repPdf(){
 await repLoadScript("https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js");
 await repLoadScript("https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js");
 const t=REP.tab,vis=repVis(t),rows=repFiltered(t),PER=16;
 const pdf=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
 const W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight();
 const pages=Math.max(1,Math.ceil(rows.length/PER));
 const box=document.createElement("div");box.dir="rtl";
 box.style.cssText="position:fixed;left:-20000px;top:0;width:1200px;background:#fff;color:#111;padding:24px;font-family:inherit";
 document.body.appendChild(box);
 try{
  for(let p=0;p<pages;p++){
   const part=rows.slice(p*PER,(p+1)*PER);
   box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><b style="font-size:24px">وصلة | تقرير '+esc(repTitle())+'</b><span style="font-size:14px;color:#555">'+esc(fmtDateAr(new Date().toISOString()))+' · صفحة '+(p+1)+' من '+pages+'</span></div>'+
    '<table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr>'+vis.map(c=>'<th style="background:#0f4c5c;color:#fff;padding:8px;border:1px solid #ccc;text-align:right">'+esc(c.l)+'</th>').join("")+'</tr></thead><tbody>'+
    part.map((r,i)=>'<tr style="background:'+(i%2?"#f5f5f5":"#fff")+'">'+vis.map(c=>{const v=repText(c,r[c.k]);const x=c.t==="money"?moneyAr(r[c.k]):(c.t==="num"&&v!==""?esc(fmt(r[c.k])):esc(v));return '<td style="padding:7px;border:1px solid #ddd;text-align:right"'+(c.t==="code"?' dir="ltr"':"")+'>'+(v===""?"—":x)+'</td>'}).join("")+'</tr>').join("")+'</tbody></table>';
   const cv=await html2canvas(box,{scale:2,backgroundColor:"#ffffff"});
   if(p)pdf.addPage();
   const ratio=Math.min((W-30)/cv.width,(H-30)/cv.height);
   pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",W-15-cv.width*ratio,15,cv.width*ratio,cv.height*ratio);
  }
 }finally{box.remove()}
 pdf.save(repFileName("pdf"));
}
document.addEventListener("click",async e=>{
 const b=e.target.closest&&e.target.closest('[data-a^="rep-"]');if(!b)return;
 const a=b.dataset.a,id=b.dataset.id,t=REP.tab;
 if(a==="rep-tab"){REP.tab=id;REP.menu=false;render();return}
 if(a==="rep-hide"){repSave(t,repVis(t).map(c=>c.k).filter(k=>k!==id));render();return}
 if(a==="rep-add"){const v=repVis(t).map(c=>c.k);if(!v.includes(id))v.push(id);repSave(t,v);render();return}
 if(a==="rep-menu"){REP.menu=!REP.menu;render();return}
 if(a==="rep-reset"){repSave(t,null);try{const o=JSON.parse(localStorage.getItem(REP_KEY)||"{}");delete o[t];localStorage.setItem(REP_KEY,JSON.stringify(o))}catch(_){}render();return}
 if(a==="rep-xlsx"||a==="rep-pdf"){
  if(REP.busy)return;REP.busy=a==="rep-pdf"?"pdf":"xlsx";render();
  try{await(a==="rep-pdf"?repPdf():repXlsx())}catch(err){alert(err&&err.message||"تعذّر إنشاء الملف")}
  REP.busy="";render();
 }
});

 render();

/* ===== مركز الرفع: رفع الأقسام والخدمات من ملف Excel/CSV بالنموذج، عبر الدوال الموجودة (من غير تغيير في قاعدة البيانات) ===== */
const UP={rows:{sections:[],services:[]},file:"",busy:false,log:[],err:""};
const UP_SEC_COLS=["اسم القسم بالعربية","اسم القسم بالإنجليزية","المعرّف الداخلي (اختياري، بيتولد تلقائي)","الأيقونة"];
const UP_SVC_COLS=["اسم الخدمة بالعربية","اسم الخدمة بالإنجليزية","القسم (اسم القسم بالعربية)","الوصف","العمولة % (اختياري)"];
function upNorm(x){return String(x==null?"":x).replace(/[\u064B-\u065F\u0640]/g,"").replace(/[إأآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim().toLowerCase()}
function upDigits(x){return String(x==null?"":x).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g,".").replace(/,/g,".").trim()}
function upCheck(){
 const cats=s.cats||[],svcs=s.services||[];
 const catBySlug=new Set(cats.map(c=>String(c.slug||"").toLowerCase())),catByName=new Set(cats.map(c=>upNorm(c.name_ar)));
 const seenS=new Set(),seenN=new Set();
 UP.rows.sections.forEach(r=>{
  const e=[];if(!r.name_ar)e.push("اسم القسم مطلوب");
  if(!/^[a-z0-9][a-z0-9-]*$/.test(r.slug||""))e.push("المعرّف لازم حروف إنجليزية صغيرة وأرقام وشرطة");
  r.skip=false;
  if(!e.length&&(catBySlug.has(r.slug)||catByName.has(upNorm(r.name_ar))))r.skip="موجود بالفعل";
  if(!e.length&&!r.skip&&(seenS.has(r.slug)||seenN.has(upNorm(r.name_ar))))e.push("مكرر في الملف");
  seenS.add(r.slug);seenN.add(upNorm(r.name_ar));r.errors=e;
 });
 const secNames=new Set(cats.map(c=>upNorm(c.name_ar)).concat(UP.rows.sections.filter(x=>!x.errors.length).map(x=>upNorm(x.name_ar))));
 const seen=new Set();
 UP.rows.services.forEach(r=>{
  const e=[];if(!r.name_ar)e.push("اسم الخدمة مطلوب");
  if(!r.section)e.push("القسم مطلوب");else if(!secNames.has(upNorm(r.section)))e.push("القسم مش موجود");
  if(r.rate!==""&&r.rate!=null){const n=Number(upDigits(r.rate));if(!Number.isFinite(n)||n<0||n>=100)e.push("العمولة لازم من 0 لأقل من 100");}
  r.skip=false;
  const key=upNorm(r.section)+"|"+upNorm(r.name_ar);
  const cat=cats.find(c=>upNorm(c.name_ar)===upNorm(r.section));
  if(!e.length&&cat&&svcs.some(x=>x.category_id===cat.id&&upNorm(x.name_ar)===upNorm(r.name_ar)))r.skip="موجودة بالفعل";
  if(!e.length&&!r.skip&&seen.has(key))e.push("مكررة في الملف");
  seen.add(key);r.errors=e;
 });
}
async function upTemplate(){
 await repLoadScript("https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js");
 const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
 const w1=XLSX.utils.aoa_to_sheet([UP_SEC_COLS,["سباكة","Plumbing","","wrench"],["كهرباء","Electrical","",""]]);
 const w2=XLSX.utils.aoa_to_sheet([UP_SVC_COLS,["إصلاح تسريب مياه","Leak repair","سباكة","كشف وإصلاح التسريبات",12],["تركيب مفتاح كهرباء","Switch install","كهرباء","",""]]);
 const w3=XLSX.utils.aoa_to_sheet([["تعليمات الملء"],["1) املأ ورقة الأقسام أولًا ثم ورقة الخدمات. اترك الورقة فاضية لو مش هترفع منها."],["2) المعرّف الداخلي اختياري: سيبه فاضي والمنصة بتولده تلقائي."],["3) اسم القسم في ورقة الخدمات لازم يطابق اسم قسم موجود أو موجود في ورقة الأقسام."],["4) العمولة % رقم من 0 لأقل من 100، ولو فاضية بتاخد النسبة الافتراضية."],["5) الأكواد (SVC للخدمة و SEC للقسم) بتتولد تلقائي من المنصة بعد الرفع، ومفيش خانة كود في الملف."],["6) الصفوف الموجودة بالفعل بتتخطى ومش بتتكرر."]]);
 w1["!cols"]=UP_SEC_COLS.map(()=>({wch:28}));w2["!cols"]=UP_SVC_COLS.map(()=>({wch:28}));w3["!cols"]=[{wch:90}];
 XLSX.utils.book_append_sheet(wb,w1,"الأقسام");XLSX.utils.book_append_sheet(wb,w2,"الخدمات");XLSX.utils.book_append_sheet(wb,w3,"تعليمات");
 XLSX.writeFile(wb,"wasla-upload-template.xlsx");
}
async function upParse(file){
 await repLoadScript("https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js");
 const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:"array"});
 const get=(names)=>{const n=wb.SheetNames.find(x=>names.includes(upNorm(x)));return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""}).slice(1).filter(r=>r.some(c=>String(c).trim()!=="")):[]};
 const t=x=>String(x==null?"":x).trim();
 UP.rows.sections=get(["الاقسام","sections"]).map((r,i)=>({line:i+2,name_ar:t(r[0]),name_en:t(r[1]),slug:t(r[2]).toLowerCase()||("sec-"+Date.now().toString(36)+i),icon:t(r[3])}));
 UP.rows.services=get(["الخدمات","services"]).map((r,i)=>({line:i+2,name_ar:t(r[0]),name_en:t(r[1]),section:t(r[2]),desc:t(r[3]),rate:t(r[4])}));
 UP.file=file.name;UP.log=[];UP.err="";
 if(!UP.rows.sections.length&&!UP.rows.services.length)UP.err="الملف مفيهوش صفوف في ورقتي \"الأقسام\" أو \"الخدمات\". حمّل النموذج واملأه.";
 upCheck();
}
async function upRun(){
 if(UP.busy)return;upCheck();
 const secs=UP.rows.sections.filter(r=>!r.errors.length&&!r.skip),svs=UP.rows.services.filter(r=>!r.errors.length&&!r.skip);
 if(!secs.length&&!svs.length){UP.err="مفيش صفوف سليمة للرفع.";render();return}
 UP.busy=true;UP.log=[];UP.err="";render();
 const log=(m,ok)=>{UP.log.push({m,ok})};
 try{
  for(const r of secs){const x=await db.rpc("admin_create_category",{p_name_ar:r.name_ar,p_name_en:r.name_en||null,p_slug:r.slug,p_icon:r.icon||null});log("قسم: "+r.name_ar,!x.error&&"تم"||String(x.error.message||x.error));if(x.error)r.failed=true}
  if(secs.length)await loadUser(s.user);
  for(const r of svs){const cat=(s.cats||[]).find(c=>upNorm(c.name_ar)===upNorm(r.section));if(!cat){log("خدمة: "+r.name_ar,"القسم مش موجود");r.failed=true;continue}
   const x=await db.rpc("admin_create_service",{p_category_id:cat.id,p_name_ar:r.name_ar,p_name_en:r.name_en||null,p_description:r.desc||null});log("خدمة: "+r.name_ar,!x.error&&"تم"||String(x.error.message||x.error));if(x.error)r.failed=true}
  if(svs.length)await loadUser(s.user);
  for(const r of svs.filter(r=>!r.failed&&r.rate!==""&&r.rate!=null)){
   const cat=(s.cats||[]).find(c=>upNorm(c.name_ar)===upNorm(r.section)),sv=cat&&(s.services||[]).find(x=>x.category_id===cat.id&&upNorm(x.name_ar)===upNorm(r.name_ar));
   if(!sv){log("عمولة: "+r.name_ar,"الخدمة مش ظاهرة بعد الإضافة");continue}
   const x=await db.rpc("admin_set_service_commission_rate",{p_service_id:sv.id,p_rate:Number(upDigits(r.rate))});log("عمولة "+r.rate+"%: "+r.name_ar,!x.error&&"تم"||String(x.error.message||x.error));
  }
  await loadUser(s.user);
 }catch(e){UP.err=String(e&&e.message||e)}
 UP.rows={sections:[],services:[]};UP.file="";UP.busy=false;render();
}
function upView(){
 upCheck();
 const stc=r=>r.errors.length?'<span class="tag bad">'+esc(r.errors.join("، "))+'</span>':(r.skip?'<span class="tag">'+esc(r.skip)+' (يتخطى)</span>':'<span class="tag ok">جاهز</span>');
 const tbl=(title,cols,rows,cells)=>rows.length?'<h3 style="margin:14px 0 6px">'+title+' ('+fmt(rows.length)+')</h3><div class="rep-wrap"><table class="rep-t"><thead><tr><th>سطر</th>'+cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'<th>الحالة</th></tr></thead><tbody>'+rows.map(r=>'<tr><td class="n">'+fmt(r.line)+'</td>'+cells(r).map(c=>'<td>'+esc(c||"—")+'</td>').join("")+'<td>'+stc(r)+'</td></tr>').join("")+'</tbody></table></div>':"";
 const ok=UP.rows.sections.concat(UP.rows.services).filter(r=>!r.errors.length&&!r.skip).length;
 return REP_CSS+'<section class="section rep-sec"><div class="rep-hd"><i></i><div><h2>مركز الرفع</h2><p class="small">ارفع الأقسام والخدمات (مع العمولة لكل خدمة) من ملف Excel أو CSV بالنموذج.</p></div></div>'+
  '<div class="rep-stats" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><div class="rep-stat"><small>1) حمّل النموذج</small><div style="margin-top:6px">'+btn("up-template","تحميل النموذج","gold")+'</div></div><div class="rep-stat"><small>2) املأه وارفعه</small><label class="btn light" style="margin-top:6px;display:inline-block;cursor:pointer">اختيار ملف<input id="upFile" type="file" accept=".xlsx,.xls,.csv" style="display:none"></label></div><div class="rep-stat"><small>3) راجع ونفّذ</small><div style="margin-top:6px">'+(ok?btn("up-run",UP.busy?"جاري الرفع...":"رفع "+fmt(ok)+" صف","gold"):'<span class="small">مفيش صفوف جاهزة</span>')+'</div></div></div>'+
  '<p class="small">الأكواد بتتولد تلقائي بعد الرفع: SVC للخدمة و SEC للقسم. الصفوف الموجودة بالفعل بتتخطى.</p>'+
  (UP.file?'<p class="small">الملف: <b>'+esc(UP.file)+'</b></p>':"")+(UP.err?'<div class="notice error">'+esc(UP.err)+'</div>':"")+
  tbl("الأقسام",UP_SEC_COLS,UP.rows.sections,r=>[r.name_ar,r.name_en,r.slug,r.icon])+
  tbl("الخدمات",UP_SVC_COLS,UP.rows.services,r=>[r.name_ar,r.name_en,r.section,r.desc,r.rate])+
  (UP.log.length?'<h3 style="margin:14px 0 6px">نتيجة الرفع</h3><div class="card">'+UP.log.map(x=>'<div class="small">'+(x.ok==="تم"?"✓ ":"✗ ")+esc(x.m)+' — '+esc(x.ok)+'</div>').join("")+'</div>':"")+'</section>';
}

var reqRt={chan:null,uid:null,timer:null,busy:false};
function reqRtUnsub(){try{if(reqRt.chan)db.removeChannel(reqRt.chan)}catch(_){}reqRt.chan=null;reqRt.uid=null;clearTimeout(reqRt.timer)}
function reqRtKick(){
 clearTimeout(reqRt.timer);
 reqRt.timer=setTimeout(async function go(){
  if(!s.user||!reqRt.chan)return;
  const ae=document.activeElement;
  if(reqRt.busy||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&(ae.value||"").length>0)){reqRt.timer=setTimeout(go,2500);return}
  reqRt.busy=true;
  try{await refreshRoleData()}catch(_){}
  reqRt.busy=false;
 },700);
}
function reqRtSubscribe(uid){
 if(!uid||(reqRt.chan&&reqRt.uid===uid))return;
 reqRtUnsub();
 try{
  reqRt.uid=uid;
  reqRt.chan=db.channel("wasla-requests-"+uid)
   .on("postgres_changes",{event:"*",schema:"public",table:"service_requests"},()=>reqRtKick())
   .on("postgres_changes",{event:"*",schema:"public",table:"service_quotes"},()=>reqRtKick())
   .subscribe();
 }catch(_){reqRt.chan=null;reqRt.uid=null}
}
var payRt={chan:null,uid:null};
function payRtUnsub(){try{if(payRt.chan)db.removeChannel(payRt.chan)}catch(_){}payRt.chan=null;payRt.uid=null}
function payRtSubscribe(uid){
 if(!uid||(payRt.chan&&payRt.uid===uid))return;
 payRtUnsub();
 try{
  payRt.uid=uid;
  payRt.chan=db.channel("wasla-payments-"+uid)
   .on("postgres_changes",{event:"UPDATE",schema:"public",table:"payments",filter:"customer_id=eq."+uid},payload=>{
    const row=payload&&payload.new;
    if(!row||!row.request_id)return;
    const prev=s.payments&&s.payments[row.request_id];
    if(!s.payments)s.payments={};
    s.payments[row.request_id]=Object.assign({},prev||{},row);
    if(row.payment_status==="paid"&&(!prev||prev.payment_status!=="paid")){
     note("مزود الخدمة أكد استلام المبلغ ✓","success");
    }else render();
   })
   .subscribe();
 }catch(_){payRt.chan=null;payRt.uid=null}
}
function moneyAr(n,c){n=Number(n||0);return '<span dir="ltr">'+(n<0?"-":"")+fmt(Math.abs(n))+(c===false?"":" "+(c||"EGP"))+'</span>'}
function paymentStatusAr(p){
 if(p.payment_status==="paid")return "تم الدفع";
 if(p.payment_status==="failed")return "فشل الدفع";
 if(p.payment_status==="refunded")return "تم الاسترداد";
 return p.payment_method==="cash"?"بانتظار تأكيد استلام الكاش":"بانتظار الدفع";
}

}

 const method=p.payment_method==="cash"?"كاش":"عبر المنصة";
 let h='<div class="wasla-pay-block"><div class="row"><b>الدفع</b>'+tag(paymentStatusAr(p))+'</div>'+

 if(provider&&own){
  h+='<p>عمولة المنصة ('+fmt(p.commission_rate)+'%): '+moneyAr(p.commission_amount,cur)+' · صافي نصيبك: '+moneyAr(p.provider_amount,cur)+'</p>';
  if(p.payment_method==="cash"&&p.payment_status==="pending")h+='<div class="actions">'+btn("cash-received","استلمت الفلوس","green",q.id)+'</div>';

}

async function loadWallet(more){
 const w=s.wallet=s.wallet||{entries:[],data:null,loading:false,error:"",more:false};
 if(w.loading)return;
 w.loading=true;w.error="";
 if(!more){w.entries=[]}
 render();
 try{
  const off=more?w.entries.length:0;
  const r=await db.rpc("get_my_wallet",{p_limit:30,p_offset:off});
  if(r.error)throw r.error;
  const d=r.data||{};
  w.data=d;
  const ent=Array.isArray(d.entries)?d.entries:[];
  w.entries=more?w.entries.concat(ent):ent;
  w.more=ent.length>=30;
 }catch(err){
  w.error="تعذّر تحميل المحفظة: "+(err&&err.message?err.message:"خطأ غير معروف");
 }
 w.loading=false;
 render();
}

      function requestList(provider,requests=s.requests){
  return requests.map(q=>{
  const own=q.provider_id===s.provider?.id;
  const quote=provider?s.quotes.find(x=>x.request_id===q.id):null;
  let a="";

  if(provider&&q.status==="pending"&&!q.provider_id){
   a=btn("claim","قبول الطلب","green",q.id);
  }

  if(provider&&own&&q.status==="accepted"){
   if(!quote||["revision_requested","rejected","expired"].includes(quote.status)){
    a=btn("createquote",quote?"إرسال عرض معدل":"إنشاء عرض سعر","gold",q.id);
   }else if(quote.status==="agreed"){
    a=btn("advance","بدء التنفيذ","gold",q.id,"data-next='in_progress'");
   }else{
    const quoteStatus={
     awaiting_customer:"في انتظار رد العميل",
          awaiting_provider_approval:"في انتظار اعتمادك",
     withdrawn:"تم سحب عرض السعر"
    };

    if(quote.status==="awaiting_provider_approval"){
     a=btn("quote-provider-review","اعتماد العرض","gold",quote.id);
    }else{
     a=tag(quoteStatus[quote.status]||"عرض السعر قيد المراجعة");
    }
   }
  }

  if(provider&&own&&q.status==="in_progress"){
   a=btn("advance","إنهاء الطلب","green",q.id,"data-next='completed'");
  }

  if(provider&&q.provider_id&&!own)return "";

  return '<article class="item"><div class="row"><b>'+esc(q.title||q.services?.name_ar||"طلب خدمة")+'</b>'+tag(q.status)+'</div><p class="small">رمز الطلب: '+reqCodeTag(q.id)+'</p><p>'+esc([q.city,q.country].filter(Boolean).join("، "))+'</p><p>'+esc(q.description||"")+'</p><p>الميزانية: '+(q.budget?LTR(fmt(q.budget)+" EGP"):"غير محددة")+'</p>'+paymentBlock(q,provider,own)+'<div class="actions">'+a+(provider&&own?btn("provider-request-details","تفاصيل الطلب","light",q.id):"")+(!provider&&["pending","accepted"].includes(q.status)?btn("cancelrequest","إلغاء الطلب","danger",q.id):"")+(q.status==="completed"&&q.provider_id&&!provider&&!s.reviewedIds?.has(q.id)?btn("review","تقييم الخدمة","light",q.id):"")+(q.provider_id&&["accepted","in_progress"].includes(q.status)&&(!provider||s.chats.some(c=>c.request_id===q.id))?btn("chat","محادثة","light",q.id):"")+'</div></article>';

function rqFilesAdd(list){
 const lim={image:[10,5],video:[50,1],audio:[15,2]};
 s.reqFiles=s.reqFiles||[];
 for(const f of Array.from(list||[])){
  const k=f.type.startsWith("image/")?"image":f.type.startsWith("video/")?"video":f.type.startsWith("audio/")?"audio":null;
  if(!k){note("نوع الملف غير مدعوم: "+f.name,"error");continue}
  if(f.size>lim[k][0]*1048576){note("الملف "+f.name+" أكبر من "+lim[k][0]+" ميجابايت","error");continue}
  if(s.reqFiles.filter(x=>x.type.startsWith(k+"/")).length>=lim[k][1]){note("الحد الأقصى لهذا النوع "+lim[k][1]+" ملف","error");continue}
  s.reqFiles.push(f);
 }
 rqFilesRender();
}

async function rqUploadFiles(requestId,files){
 const bucket=db.storage.from("request-media");
 let ok=0,fail=0;
 for(const f of files){
  try{
   const ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"")||"bin";
   const path=s.user.id+"/"+requestId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
   const up=await bucket.upload(path,f,{contentType:f.type,upsert:false});
   if(up.error)throw up.error;
   const kind=f.type.startsWith("image/")?"image":f.type.startsWith("video/")?"video":"audio";
   const ins=await db.from("service_request_media").insert({request_id:requestId,uploaded_by:s.user.id,storage_path:path,mime_type:f.type,size_bytes:f.size,media_kind:kind});
   if(ins.error)throw ins.error;
   ok++;
  }catch(err){console.warn("[request-media]",err);fail++}
 }
 return {ok,fail};
}

function customer(){

 if(s.tab==="home")return (nrm(s.filter||"")||s.selectedCategory)?landing(true):customerHome();

 let body="";

 if(s.tab==="messages")body=chatContent();

 if(s.tab==="assistant")body=assistantView();

 if(s.tab==="payments")body=paymentsView();

 if(s.tab==="requests"){

  const filters=[
   ["all","الكل"],
   ["pending","جديدة"],
   ["accepted","مقبولة"],
   ["in_progress","قيد التنفيذ"],
   ["completed","مكتملة"],
   ["cancelled","ملغاة"]
  ];

  const selected=s.requestFilter||"all";

  const filteredRequests=selected==="all"
   ?s.requests
   :s.requests.filter(q=>q.status===selected);

  const activeCount=s.requests.filter(q=>
   ["pending","accepted","in_progress"].includes(q.status)
  ).length;

  const completedCount=s.requests.filter(q=>
   q.status==="completed"
  ).length;

  const requestCards=filteredRequests.map(q=>{
   const requestTitle=q.title||q.services?.name_ar||"طلب خدمة";
   const parsedDate=q.created_at?new Date(q.created_at):null;
   const requestDate=parsedDate&&!isNaN(parsedDate.getTime())?parsedDate.toLocaleDateString("ar-EG-u-nu-latn",{year:"numeric",month:"short",day:"numeric"}):"—";
   const location=[q.city,q.country].filter(Boolean).join("، ");
   const pn=q.provider_profiles?.display_name;
   const act=(a,t,c)=>'<button type="button" class="'+(c||"")+'" data-a="'+a+'" data-id="'+esc(q.id)+'">'+t+'</button>';
   return '<article class="cu-req"><div class="hd"><div><b>'+esc(requestTitle)+'</b><small>'+esc(requestDate)+' · '+reqCodeTag(q.id)+'</small></div>'+tag(q.status)+'</div>'+
    (location?'<div class="loc">'+cui("pin",14)+esc(location)+'</div>':"")+
    '<div class="pv">'+(pn?'<span class="a">'+esc(pn.trim().slice(0,1))+'</span><b>'+esc(pn)+'</b>':q.provider_id?'<span class="a">م</span><b>مزود الخدمة</b>':'<span class="a" style="background:var(--border-color);color:var(--text-secondary)">؟</span><span class="w">بانتظار تعيين مقدم خدمة</span>')+'</div>'+
    (q.description?'<p>'+esc(q.description)+'</p>':"")+
    (q.status==="completed"&&s.payments&&s.payments[q.id]&&s.payments[q.id].payment_status==="pending"?'<div class="pay-page"><b>الدفع</b>'+payDueHtml(q,s.payments[q.id],String(s.payments[q.id].currency||"EGP").trim())+'</div>':"")+
    '<div class="cu-act">'+act("request-details","تفاصيل الطلب")+
     ((s.quotes||[]).some(x=>x.request_id===q.id)?act("request-details","عرض السعر",(s.quotes||[]).some(x=>x.request_id===q.id&&x.status==="awaiting_customer")?"gd":"")+'':"")+
     (["pending","accepted"].includes(q.status)?act("cancelrequest","إلغاء الطلب","dg"):"")+
     (q.status==="completed"&&q.provider_id&&!s.reviewedIds?.has(q.id)&&!(s.payments&&s.payments[q.id]&&s.payments[q.id].payment_status!=="paid")?act("review","تقييم الخدمة","gd"):"")+
     (q.provider_id&&["accepted","in_progress"].includes(q.status)?act("chat","المحادثة","gd"):"")+
    '</div></article>';
  }).join("");

  const cnt=f=>f==="all"?s.requests.length:s.requests.filter(q=>q.status===f).length;
  body=
   '<section class="section cu">'+
    '<div class="cu-top"><div><h2>طلباتي</h2><p>تابع حالة كل طلب بسهولة</p></div><button type="button" class="cu-new" data-a="request" data-id="">'+cui("plus")+' طلب جديد</button></div>'+
    '<div class="cu-stats"><div class="cu-st"><i>'+cui("list")+'</i><b>'+fmt(s.requests.length)+'</b><span>إجمالي الطلبات</span></div>'+
    '<div class="cu-st a"><i>'+cui("tool")+'</i><b>'+fmt(activeCount)+'</b><span>طلبات نشطة</span></div>'+
    '<div class="cu-st g"><i>'+cui("ok")+'</i><b>'+fmt(completedCount)+'</b><span>طلبات مكتملة</span></div></div>'+
    '<div class="cu-chips" role="group" aria-label="تصفية الطلبات">'+
     filters.map(f=>'<button type="button" class="'+(selected===f[0]?"on":"")+'" data-a="request-filter" data-id="'+f[0]+'">'+f[1]+'<em>'+fmt(cnt(f[0]))+'</em></button>').join("")+
    '</div>'+
    (requestCards||empty(selected==="all"?"لا توجد طلبات حتى الآن":"لا توجد طلبات في هذه الحالة."))+
   '</section>';
 }

 return header("حساب العميل","",true)+

  '<main class="wrap wasla-customer-page">'+

   msg()+

   (s.tab==="requests"||s.tab==="payments"?"":'<div class="sectionhead"><h2>'+(s.tab==="messages"?"الرسائل":"PRIME")+'</h2><span class="tag">عميل</span></div>')+

   body+

  '</main>'+

  customerBottomNav();
}

 }

 
if(s.tab==="home"){
 body=providerDashboard();
}


if(s.tab==="requests"){

 );

 ).length;

 ).length;

 ).length;

 ).length;

  q.provider_id===s.provider.id&&
  q.status==="completed"
 ).length;

  q.provider_id===s.provider.id&&
  q.status==="cancelled"
 ).length;
 const filters=[

  ["new","جديدة",pendingCount],

  ["in_progress","قيد التنفيذ",inProgressCount],
  ["completed","مكتملة",completedCount],
  ["cancelled","ملغاة",cancelledCount]
 ];
 const filteredRequests=ownRequests.filter(q=>{
  if(selected==="new")
   return q.status==="pending"&&!q.provider_id;

    if(selected==="accepted")
   return q.provider_id===s.provider.id&&
    q.status==="accepted";

  if(selected==="in_progress")
   return q.provider_id===s.provider.id&&
    q.status==="in_progress";

    q.status==="completed";

  if(selected==="cancelled")
   return q.provider_id===s.provider.id&&
    q.status==="cancelled";

  return true;
 });

function wcVideoThumb(file){

  let done=false,url=null;
  const v=document.createElement("video");
  const finish=blob=>{if(done)return;done=true;clearTimeout(tm);try{if(url)URL.revokeObjectURL(url)}catch(_){}v.removeAttribute("src");resolve(blob||null)};
  const tm=setTimeout(()=>finish(null),10000);
  try{
   url=URL.createObjectURL(file);
   v.muted=true;v.playsInline=true;v.preload="auto";v.crossOrigin="anonymous";
   v.onerror=()=>finish(null);
   v.onloadedmetadata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(_){finish(null)}};
   v.onseeked=()=>{
    try{
     if(!v.videoWidth||!v.videoHeight)return finish(null);
     const w=Math.min(480,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);
     const c=document.createElement("canvas");c.width=w;c.height=h;
     c.getContext("2d").drawImage(v,0,0,w,h);
     c.toBlob(b=>finish(b&&b.size>0?b:null),"image/jpeg",0.8);
    }catch(_){finish(null)}
   };
   v.src=url;
  }catch(_){finish(null)}
 });
}

let wcListChan=null,wcListOk=false,wcListDown=false,wcListTimer=null,wcListLast=0,wcListBusy=false;

async function wcRefreshChats(){

 try{
  const r=await wcChatsQuery();

 }catch(_){}

 }

function wcListSubscribe(){

 try{
  wcListChan=db.channel("wc-list-"+s.user.id)
   .on("postgres_changes",{event:"*",schema:"public",table:"conversations"},()=>wcListKick())
   .on("postgres_changes",{event:"*",schema:"public",table:"messages"},payload=>{
    wcListKick();
    try{
     const n=payload&&payload.new;
     if(payload&&payload.eventType==="INSERT"&&n&&n.id&&n.conversation_id&&n.sender_id&&n.sender_id!==s.user?.id){
      s.wcDelivSeen=s.wcDelivSeen||new Set();
      if(s.wcDelivSeen.has(n.id))return;
      if(!(s.activeChat&&s.activeChat.id===n.conversation_id))wcMarkDelivered(n.conversation_id).then(ok=>{if(ok)s.wcDelivSeen.add(n.id)}).catch(()=>{});
     }
    }catch(_){}
   })
   .subscribe(status=>{
    if(status==="SUBSCRIBED"){wcListOk=true;if(wcListDown){wcListDown=false;wcListKick()}}
    else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){wcListOk=false;wcListDown=true}
   });
 }catch(_){wcListChan=null;wcListOk=false}
}

async function loadChatMediaUrls(messages){
 s.chatMediaUrls={};

 const mediaMessages=(messages||[])
  .filter(m=>m.attachment_path);

 const results=await Promise.all(
  mediaMessages.map(async m=>{
   let result={error:true};
   try{
    result=await db.storage
     .from("conversation-media")
     .createSignedUrl(m.attachment_path,3600);
   }catch(_){}

   return {
    id:m.id,
    url:result.error?null:result.data?.signedUrl||null
   };
  })
 );

 s.chatMediaUrls=Object.fromEntries(
  results.filter(x=>x.url).map(x=>[x.id,x.url])
 );

 const thumbMessages=(messages||[]).filter(m=>m.thumbnail_path);
 const thumbResults=await Promise.all(
  thumbMessages.map(async m=>{
   let result={error:true};
   try{
    result=await db.storage
     .from("conversation-media")
     .createSignedUrl(m.thumbnail_path,3600);
   }catch(_){}
   return {id:"t:"+m.id,url:result.error?null:result.data?.signedUrl||null};
  })
 );
 thumbResults.filter(x=>x.url).forEach(x=>{s.chatMediaUrls[x.id]=x.url});
 s.chatUrlAt={};s.wcSignTry={};
 Object.keys(s.chatMediaUrls).forEach(k=>{s.chatUrlAt[k]=Date.now()});
}
      async function openChatForRequest(requestId){
 let c=s.chats.find(x=>x.request_id===requestId);
 if(!c){if(s.profile.role!=="customer")throw Error("يجب أن يبدأ العميل المحادثة أولًا");const q=s.requests.find(x=>x.id===requestId);if(!q||!q.provider_id||!["accepted","in_progress"].includes(q.status))throw Error("المحادثة متاحة بعد قبول الطلب");const r=await db.from("conversations").insert({request_id:q.id,customer_id:s.user.id,provider_id:q.provider_id}).select("id,request_id,customer_id,provider_id,last_message_at").single();if(r.error)throw r.error;c=r.data;s.chats.unshift(c)}
 s.activeChat=c;
s.tab="messages";s.messages=[];s.chatPeerProfile=null;s.chatLoading=Date.now();render();
const [peerResult,r]=await Promise.all([db.rpc("get_conversation_peer_profile",{p_conversation_id:c.id}),db.from("messages")
 .select("id,sender_id,message_text,is_read,created_at,message_type,attachment_path,attachment_mime_type,attachment_size_bytes,media_duration_seconds,location_latitude,location_longitude,delivered_at,thumbnail_path,attachment_name")
 .eq("conversation_id",c.id)
 .order("created_at")]);
if (peerResult.error) throw peerResult.error;
s.chatPeerProfile = peerResult.data?.[0] || null;
if(r.error)throw r.error;
s.messages=r.data||[];
await loadChatMediaUrls(s.messages);
if(["customer","provider"].includes(s.profile?.role)){
 try{
  if(s.messages.some(x=>x.sender_id!==s.user.id&&!x.delivered_at&&!x.is_read)&&await wcMarkDelivered(c.id))
   s.messages=s.messages.map(x=>(x.sender_id!==s.user.id&&!x.delivered_at)?{...x,delivered_at:new Date().toISOString()}:x);
 }catch(_){}
 const readResult=await db.rpc("mark_conversation_messages_read",{
  p_conversation_id:c.id
 });
 if(readResult.error)throw readResult.error;

 if(readResult.data>0){
  s.messages=s.messages.map(m=>
   m.sender_id!==s.user.id?{...m,is_read:true}:m
  );
 }
}
 auditEvent("CONVERSATION_VIEWED","conversations",c.id,"success",{
 messages_count:s.messages.length
});
s.tab="messages";
s.chatLoading=0;
render();
wcSubscribe(c.id);
      }

      async function resumePrimeKnowledgeRelease(releaseId){
 if(s.profile?.role!=="owner")
  throw Error("استكمال الإصدارات متاح للمالك فقط");

 const release=s.knowledgeReleases.find(x=>x.id===releaseId);

 if(!release||release.status!=="draft")
  throw Error("مسودة الإصدار غير موجودة أو لم تعد قابلة للاستكمال");

 const manifest=release.document_manifest;

 if(!Array.isArray(manifest)||!manifest.length||manifest.length>100)
  throw Error("قائمة مستندات الإصدار غير صالحة");

 const seen=new Set();

 for(const entry of manifest){
  if(!entry||typeof entry!=="object"||
     typeof entry.document_id!=="string"||
     !Number.isInteger(Number(entry.document_version))||
     Number(entry.document_version)<1||
     !Number.isInteger(Number(entry.chunk_count))||
     Number(entry.chunk_count)<1||
     Number(entry.chunk_count)>1000)
   throw Error("بيانات أحد مستندات الإصدار غير صالحة");

  if(seen.has(entry.document_id))
   throw Error("الإصدار يحتوي على مستند مكرر");

  seen.add(entry.document_id);

  const {data,error}=await db.functions.invoke("prime-knowledge-admin",{
   body:{
    action:"get_document",
    document_id:entry.document_id
   }
  });

  if(error)throw error;
  if(data?.error)throw Error(data.error);

  const doc=data?.document;

  if(!doc||doc.status!=="approved"||
     Number(doc.document_version)!==Number(entry.document_version))
   throw Error("أحد المستندات لم يعد معتمدًا بنفس النسخة. لن يتم استكمال الإصدار.");

  const content=String(doc.content||"").trim();

  if(!content||content.length>100000)
   throw Error("محتوى أحد المستندات غير صالح");

  const chunks=[];
  let current="";

  const paragraphs=content.split(/\n\s*\n/);

  for(const paragraph of paragraphs){
   const part=paragraph.trim();
   if(!part)continue;

   if(part.length>15000){
    if(current){
     chunks.push(current);
     current="";
    }

    for(let i=0;i<part.length;i+=15000){
     chunks.push(part.slice(i,i+15000));
    }
    continue;
   }

   if(current&&current.length+part.length+2>15000){
    chunks.push(current);
    current=part;
   }else{
    current=current?current+"\n\n"+part:part;
   }
  }

  if(current)chunks.push(current);

  if(chunks.length!==Number(entry.chunk_count))
   throw Error("عدد أجزاء المستند تغيّر. أوقفنا الاستكمال لحماية الإصدار.");

  for(let i=0;i<chunks.length;i++){
   const result=await db.functions.invoke("prime-knowledge-admin",{
    body:{
     action:"add_chunk",
     release_id:releaseId,
     document_id:doc.id,
     document_version:Number(entry.document_version),
     chunk_index:i,
     content:chunks[i],
     token_estimate:Math.ceil(chunks[i].length/4),
     metadata:{
      title:doc.title,
      slug:doc.slug,
      category:doc.category
     }
    }
   });

   if(result.error)throw result.error;
   if(result.data?.error)throw Error(result.data.error);
   if(!result.data?.success)
    throw Error("لم يتم تأكيد استكمال أحد أجزاء المحتوى");
  }
 }

 await loadPrimeKnowledge();

 note("تم استكمال تجهيز الإصدار كمسودة. لم يتم نشره.","success");
  }

        if(reason.length<5||reason.length>500){a.asErr="سبب التعيين إلزامي ويجب أن يكون من 5 إلى 500 حرف";render();return}
        a.asBusy=true;render();
        try{
          const {data,error}=await db.rpc("admin_assign_request",{p_request_id:id,p_provider_id:a.asSel,p_reason:reason});
          if(error)throw error;
          if(q.detailId!==id)return;

          a.asOk=(re?"تمت إعادة تعيين الطلب إلى ":"تم تعيين الطلب إلى ")+(data&&data.provider_name?data.provider_name:"مقدم الخدمة");

      async function loadLateRequests(){
        const l=rlState();
        if(!rqCanView())return;
        l.loading=true;l.loaded=true;l.error="";l.errorHint="";l.rows=[];
        render();
        const f=l.filters;
        const params={p_reason:f.reason||null,p_city_id:f.city_id||null,p_area_id:f.area_id||null,p_service_id:f.service_id||null,p_provider_id:f.provider_id||null,p_search:f.search.trim()||null,p_limit:l.limit,p_offset:l.offset};
        try{
          const {data,error}=await db.rpc("admin_list_late_requests",params);
          if(error)throw error;
          l.rows=Array.isArray(data?.items)?data.items:[];
          l.total=Number(data?.total||0);
          l.counters=data?.counters||null;
          l.limit=Number(data?.limit||l.limit);
          l.offset=Number(data?.offset??l.offset);
        }catch(err){
          console.error("[admin_list_late_requests]");
          const info=rqError(err);
          l.rows=[];l.total=0;l.counters=null;
          l.error=info.known?info.text:"تعذّر تحميل الطلبات المتأخرة.";
          l.errorHint=info.known?"":String(info.raw||"");
          if(info.offsetReset)l.offset=0;
        }
        l.loading=false;
        render();
      }

      function asvDue(iso){
        if(!iso)return {txt:"—",cls:""};

        const t=fmt(h)+" س "+fmt(mm)+" د";

      }

      async function asvSheetSend(){
        const st=asvState(),sh=st.sheet;
        if(!sh||sh.busy||!ASV_SHEETS[sh.kind])return;
        const d=ASV_SHEETS[sh.kind];
        const text=String(document.getElementById("asvSheetText")?.value||sh.text||"").trim();
        sh.text=text;sh.err="";
        const params={};
        params[d.idKey]=sh.id;
        if(text.length<5||text.length>500){sh.err="النص لازم يكون من 5 إلى 500 حرف";render();return}
        if(d.amount){
          const raw=String(document.getElementById("asvSheetAmt")?.value||sh.amount||"").trim().replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x));
          sh.amount=raw;
          const n=Number(raw);
          if(!raw||!Number.isFinite(n)||n<=0||n>100000){sh.err="اكتب مبلغ صحيح أكبر من صفر";render();return}
          params.p_amount=n;
        }
        params[d.textKey]=text;
        sh.busy=true;render();
        try{
          const {error}=await db.rpc(d.rpc,params);
          if(error)throw error;
          st.msg=d.ok;st.sheet=null;
          if(d.reload==="cmp")await asvLoadComplaints();else await asvLoadProviders();
          return;
        }catch(err){
          console.error("["+d.rpc+"]");
          sh.err=String(err?.message||"").slice(0,160)||"تعذّر تنفيذ العملية.";
        }
        sh.busy=false;render();
      }

        const a=b.dataset.a,q=rqState();

          asvState().sheet={kind:b.dataset.kind,id:b.dataset.id,text:"",amount:"",err:"",busy:false};asvState().msg="";render();return;

function navViewState(idx){
 return {wv:1,idx:idx,tab:s.tab,rf:s.requestFilter,
  chat:(s.tab==="messages"&&s.activeChat)?String(s.activeChat.id):null,
  detail:(s.tab==="requests"&&s.rq&&s.rq.detailId)?String(s.rq.detailId):null,

function navHistSync(){
 var k=navViewKey();
 if(!k)return;
 var h=navHist;
 if(h.target!==null){
  if(k===h.target||Date.now()>h.until){h.key=k;h.target=null;h.stack[h.idx]=k}
  return;
 }
 if(!h.init){
  h.init=true;
  var hs=history.state;
  h.idx=(hs&&hs.wv===1&&typeof hs.idx==="number")?hs.idx:0;
  h.stack[h.idx]=k;h.key=k;

 if(k===h.key)return;
 if(h.idx>0&&h.stack[h.idx-1]===k){
  // in-app "back" button: go back in history instead of stacking a duplicate
  h.target=k;h.until=Date.now()+3000;
  history.back();
  return;
 }
 h.idx+=1;
 h.stack.length=h.idx;
 h.stack[h.idx]=k;
 h.key=k;
 history.pushState(navViewState(h.idx),document.title);
}

 async function prepareServiceImage(file){
 if(!file)return null;

 if(!["image/jpeg","image/png","image/webp"].includes(file.type))
  throw Error("اختار صورة JPG أو PNG أو WebP");

 if(typeof createImageBitmap!=="function")
  throw Error("المتصفح لا يدعم ضغط الصور. جرّب Chrome محدث.");

 const bitmap=await createImageBitmap(file);
 const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));

 const canvas=document.createElement("canvas");
 canvas.width=Math.max(1,Math.round(bitmap.width*scale));
 canvas.height=Math.max(1,Math.round(bitmap.height*scale));

 const ctx=canvas.getContext("2d");
 ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
 bitmap.close?.();

 const blob=await new Promise(resolve=>
  canvas.toBlob(resolve,"image/webp",.82)
 );

 if(!blob)throw Error("تعذّر تجهيز الصورة");
 if(blob.size>4*1024*1024)
  throw Error("حجم الصورة بعد الضغط أكبر من 4 ميجابايت");

 return new File([blob],"service-"+Date.now()+".webp",{
  type:"image/webp"
 });
}

async function saveServiceImage(serviceId,file,oldUrl){
 const imageFile=await prepareServiceImage(file);
 if(!imageFile)return null;

 const path="services/"+serviceId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+".webp";
 const bucket=db.storage.from("service-images");

 const uploaded=await bucket.upload(path,imageFile,{
  contentType:"image/webp",
  cacheControl:"31536000",
  upsert:false
 });

 if(uploaded.error)throw uploaded.error;

 const publicUrl=bucket.getPublicUrl(path).data.publicUrl;

 const updated=await db.rpc("admin_set_service_image",{
 p_service_id:serviceId,
 p_image_url:publicUrl
});

if(updated.error){
 await bucket.remove([path]);
 throw updated.error;
}
 const marker="/storage/v1/object/public/service-images/";

 if(oldUrl&&String(oldUrl).includes(marker)){
  const oldPath=decodeURIComponent(String(oldUrl).split(marker).pop());

  if(oldPath.startsWith("services/")&&oldPath!==path)
   await bucket.remove([oldPath]);
 }

 return publicUrl;
}

 const latestVersion=Math.max(

  ...s.knowledgeReleases.map(x=>Number(x.release_version)||0)
 );

 if(!Number.isInteger(releaseVersion)||releaseVersion<=latestVersion)
  throw Error("رقم الإصدار يجب أن يكون أكبر من أحدث إصدار موجود");

 if(!documentIds.length)
  throw Error("اختر مستندًا معتمدًا واحدًا على الأقل");

 if(platformCommit&&platformCommit.length>100)
  throw Error("معرّف Commit أطول من المسموح");

 const documents=[];

 for(const documentId of documentIds){
  const {data,error}=await db.functions.invoke("prime-knowledge-admin",{
   body:{
    action:"get_document",
    document_id:documentId
   }
  });

  if(error)throw error;
  if(data?.error)throw Error(data.error);

  const doc=data?.document;
  if(!doc||doc.status!=="approved")
   throw Error("أحد المستندات المختارة لم يعد معتمدًا");

  const listed=s.knowledgeDocs.find(x=>x.id===documentId);
  if(!listed||Number(listed.document_version)!==Number(doc.document_version))
   throw Error("تغيّرت نسخة أحد المستندات. حدّث البيانات وأعد المحاولة");

  const content=String(doc.content||"").trim();
  if(!content||content.length>100000)
   throw Error("محتوى المستند غير صالح أو يتجاوز الحد المسموح");

  const chunks=[];
  let current="";

  const paragraphs=content.split(/\n\s*\n/);

  for(const paragraph of paragraphs){
   const part=paragraph.trim();
   if(!part)continue;

   if(part.length>15000){
    if(current){
     chunks.push(current);
     current="";
    }

    for(let i=0;i<part.length;i+=15000){
     chunks.push(part.slice(i,i+15000));
    }
    continue;
   }

   if(current&&current.length+part.length+2>15000){
    chunks.push(current);
    current=part;
   }else{
    current=current?current+"\n\n"+part:part;
   }
  }

  if(current)chunks.push(current);

  if(!chunks.length||chunks.length>1000)
   throw Error("تعذّر تقسيم محتوى أحد المستندات");

  documents.push({
   id:doc.id,
   title:doc.title,
   slug:doc.slug,
   version:Number(doc.document_version),
   chunks
  });
 }

 }));

const waslaPendingActions = new Set();
const waslaPendingForms = new Set();
const waslaOriginalDisabled = new WeakMap();

function waslaActionKey(button) {
  return [
    button.dataset.a || "",
    button.dataset.id || "",
    button.dataset.next || "",
    button.dataset.decision || ""
  ].join("|");
}

function waslaSetPending(control, pending) {
  if (pending) {
    if (!waslaOriginalDisabled.has(control)) {
      waslaOriginalDisabled.set(control, !!control.disabled);
    }

    if ("disabled" in control) control.disabled = true;

    control.classList.add("wasla-action-pending");
    control.setAttribute("aria-busy", "true");
  } else {
    if (waslaOriginalDisabled.has(control)) {
      if ("disabled" in control) {
        control.disabled = waslaOriginalDisabled.get(control);
      }
      waslaOriginalDisabled.delete(control);
    }

    control.classList.remove("wasla-action-pending");
    control.removeAttribute("aria-busy");
  }
}

function waslaSyncPendingUI() {
  app.querySelectorAll("[data-a]").forEach(button => {
    waslaSetPending(
      button,
      waslaPendingActions.has(waslaActionKey(button))
    );
  });

  app.querySelectorAll("form[id]").forEach(form => {
    const pending = waslaPendingForms.has(form.id);

    form.querySelectorAll(
      'button[type="submit"], button:not([type]), input[type="submit"]'
    ).forEach(control => {
      waslaSetPending(control, pending);
    });
  });
}

let chatMicSession=0;
let chatMicStarting=false;
let chatMicStopRequested=false;

function chatMicHaptic(){
 try{
  if(navigator.vibrate)navigator.vibrate(18);
 }catch(_){}
}

function resetChatMicButton(){
 const button=document.getElementById("chatMicButton");
 if(!button)return;

 button.title="تسجيل رسالة صوتية";
 button.classList.remove("is-recording");
 wcRecUi(false);
 wcSyncAction();
 button.setAttribute("aria-label","بدء التسجيل");
 button.style.background="";
 button.style.color="";
}

app.addEventListener("click",async e=>{
 const button=e.target.closest?.("#chatMicButton");
 if(!button)return;

 e.preventDefault();
 if(button.dataset.mode==="send"){
  const f=document.getElementById("sendMessage");
  if(f&&f.requestSubmit)f.requestSubmit();
  return;
 }

 // الضغطة الثانية أثناء انتظار إذن الميكروفون
 if(chatMicStarting){
  chatMicStopRequested=true;
  button.title="جاري إلغاء بدء التسجيل...";
  return;
 }

 // الضغطة الثانية أثناء التسجيل توقفه
 if(s.chatRecorder?.state==="recording"){
  chatMicStopRequested=true;
  s.chatRecorder.stop();
  return;
 }

 if(s.chatRecording)return;

 const session=++chatMicSession;
 chatMicStarting=true;
 chatMicStopRequested=false;
 chatMicHaptic();

 button.title="جاري تشغيل الميكروفون — اضغط للإلغاء";

 let stream=null;

 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
   throw Error("التسجيل الصوتي غير مدعوم في هذا المتصفح.");
  }

  stream=await navigator.mediaDevices.getUserMedia({audio:true});

  if(
   session!==chatMicSession||
   chatMicStopRequested||
   !document.getElementById("chatMicButton")
  ){
   stream.getTracks().forEach(track=>track.stop());

   if(session===chatMicSession){
    chatMicStarting=false;
    chatMicStopRequested=false;
    resetChatMicButton();
   }
   return;
  }

  const candidates=[
   "audio/webm;codecs=opus",
   "audio/ogg;codecs=opus",
   "audio/mp4"
  ];

  const selectedType=candidates.find(type=>
   MediaRecorder.isTypeSupported(type)
  );

  const recorder=selectedType
   ?new MediaRecorder(stream,{mimeType:selectedType})
   :new MediaRecorder(stream);

  const mimeType=(recorder.mimeType||selectedType||"audio/webm")
   .split(";")[0].toLowerCase();

  if(!["audio/webm","audio/ogg","audio/mp4"].includes(mimeType)){
   throw Error("صيغة التسجيل الصوتي غير مدعومة.");
  }

  const chunks=[];
  const startedAt=Date.now();

  recorder.addEventListener("dataavailable",event=>{
   if(event.data?.size)chunks.push(event.data);
  });

  recorder.addEventListener("stop",()=>{
   stream.getTracks().forEach(track=>track.stop());

   if(s.chatRecorder===recorder){
    s.chatRecorder=null;
    s.chatRecording=false;
   }

   if(session===chatMicSession){
    chatMicStarting=false;
    chatMicStopRequested=false;
    resetChatMicButton();
   }

   if(!chunks.length){
    note("لم يتم تسجيل صوت. حاول مرة أخرى.","error");
    return;
   }

   const extensions={
    "audio/webm":"webm",
    "audio/ogg":"ogg",
    "audio/mp4":"mp4"
   };

   const blob=new Blob(chunks,{type:mimeType});
   const file=new File(
    [blob],
    "voice-message-"+Date.now()+"."+extensions[mimeType],
    {type:mimeType,lastModified:Date.now()}
   );

   s.chatMediaDurationSeconds=Math.max(
    1,Math.round((Date.now()-startedAt)/1000)
   );

   const input=document.querySelector("#chatMediaInput");

   if(!input){
    s.chatAttachment=file;
    return;
   }

   const transfer=new DataTransfer();
   transfer.items.add(file);
   input.files=transfer.files;
   input.dispatchEvent(new Event("change",{bubbles:true}));
  });

  recorder.start(250);

  s.chatRecorder=recorder;
  s.chatRecording=true;
  chatMicStarting=false;

  const activeButton=document.getElementById("chatMicButton");

  if(activeButton){
   activeButton.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>';
   activeButton.classList.add("is-recording");
   wcRecUi(true);
   activeButton.title="اضغط لإيقاف التسجيل";
   activeButton.setAttribute("aria-label","إيقاف التسجيل");
  }

 }catch(error){
  stream?.getTracks().forEach(track=>track.stop());

  if(session===chatMicSession){
   chatMicStarting=false;
   chatMicStopRequested=false;
   s.chatRecorder=null;
   s.chatRecording=false;
   resetChatMicButton();
  }

  note(error.message||"تعذر بدء التسجيل الصوتي.","error");
 }
});


let chatLocationSending = false;

app.addEventListener("click", async e => {
  const button = e.target.closest?.("#chatLocationButton");
  if (!button) return;

  e.preventDefault();

  if (chatLocationSending) return;

  const conversationId = s.activeChat?.id;
  const senderId = s.user?.id;

  if (!conversationId || !senderId) {
    note("افتح محادثة نشطة أولًا.", "error");
    return;
  }

  chatLocationSending = true;
  button.disabled = true;
  button.setAttribute("aria-busy", "true");

  let saved = false;

  try {
    if (window.isSecureContext === false) {
      throw Error("مشاركة الموقع تتطلب فتح المنصة عبر اتصال آمن HTTPS.");
    }

    if (!navigator.geolocation) {
      throw Error("المتصفح لا يدعم تحديد الموقع.");
    }

    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 30000
        }
      );
    });

    if (
      s.activeChat?.id !== conversationId ||
      s.user?.id !== senderId
    ) {
      throw Error("تم تغيير المحادثة. افتح المحادثة المطلوبة وحاول مرة أخرى.");
    }

    const latitude = Number(position.coords.latitude);
    const longitude = Number(position.coords.longitude);

    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude) ||
      latitude < -90 ||
      latitude > 90 ||
      longitude < -180 ||
      longitude > 180
    ) {
      throw Error("تعذر الحصول على إحداثيات موقع صحيحة.");
    }

    const inserted = await db.from("messages").insert({
      conversation_id: conversationId,
      sender_id: senderId,
      message_text: "📍 تمت مشاركة الموقع",
      message_type: "location",
      attachment_path: null,
      attachment_mime_type: null,
      attachment_size_bytes: null,
      location_latitude: latitude,
      location_longitude: longitude
    });

    if (inserted.error) throw inserted.error;

    saved = true;

    if (s.activeChat?.id !== conversationId) {
      note("تم إرسال موقعك بنجاح.", "success");
      return;
    }

    const q = await db.from("messages")
      .select("id,sender_id,message_text,is_read,created_at,message_type,attachment_path,attachment_mime_type,attachment_size_bytes,media_duration_seconds,location_latitude,location_longitude,delivered_at,thumbnail_path,attachment_name")
      .eq("conversation_id", conversationId)
      .order("created_at");

    if (q.error) {
      note("تم إرسال الموقع، لكن تعذر تحديث عرض الرسائل. أعد فتح المحادثة.", "success");
      return;
    }

    s.messages = q.data || [];
    await loadChatMediaUrls(s.messages);

    render();
    note("تم إرسال موقعك بنجاح.", "success");

  } catch (error) {
    if (saved) {
      note("تم إرسال الموقع، لكن تعذر تحديث عرض المحادثة.", "success");
    } else if (error.code === 1) {
      note("لم تسمح بمشاركة الموقع. يمكنك تفعيل إذن الموقع من إعدادات المتصفح.", "error");
    } else if (error.code === 2) {
      note("تعذر تحديد موقعك حاليًا. حاول مرة أخرى.", "error");
    } else if (error.code === 3) {
      note("انتهت مهلة تحديد الموقع. حاول مرة أخرى.", "error");
    } else {
      note(error.message || "تعذر إرسال الموقع.", "error");
    }
  } finally {
    chatLocationSending = false;

    const currentButton = document.getElementById("chatLocationButton");
    if (currentButton) {
      currentButton.disabled = false;
      currentButton.removeAttribute("aria-busy");
    }
  }
});

(() => {
  const root = document.documentElement;
  const app = document.getElementById("app");
  if (!app) return;

  let mode = "light";

  try {
    mode = localStorage.getItem("wasla_color_mode") === "dark"
      ? "dark"
      : "light";
  } catch (e) {}

  const applyTheme = () => {
  root.setAttribute("data-theme", mode);

  try {
    localStorage.setItem("wasla_color_mode", mode);
    localStorage.removeItem("wasla_theme_draft");
  } catch (e) {}

  const button = app.querySelector(".theme-toggle");

  if (button) {
    button.textContent = mode === "dark" ? "☀" : "☾";

    button.setAttribute(
      "aria-label",
      mode === "dark" ? "التبديل للوضع النهاري" : "التبديل للوضع الليلي"
    );

    button.setAttribute(
      "title",
      mode === "dark" ? "الوضع النهاري" : "الوضع الليلي"
    );
  }
};

const addButton = () => {
  const header = app.querySelector(".topline");
  const welcome = app.querySelector(".wasla-welcome");
  const target = header || welcome;

  if (!target || target.querySelector(".theme-toggle")) return;

  const button = document.createElement("button");
  button.type = "button";
  button.className = "theme-toggle";
  button.setAttribute("aria-label", "تبديل الوضع");

  button.addEventListener("click", () => {
    mode = mode === "dark" ? "light" : "dark";
    applyTheme();
    try { window.waslaThemeSync && window.waslaThemeSync.mode(mode); } catch (e) {}
  });

  if (header) {
    const brand = header.querySelector(".brand-lockup");

    if (brand) {
      brand.insertAdjacentElement("afterend", button);
    } else {
      header.appendChild(button);
    }
  } else {
    welcome.prepend(button);
  }

  applyTheme();
};

  window.__waslaSetMode = (m) => {
    const nm = m === "dark" ? "dark" : "light";
    if (nm === mode) return;
    mode = nm;
    applyTheme();
  };

  applyTheme();
  addButton();

  new MutationObserver(addButton).observe(app, {
    childList: true,
    subtree: true
  });
})();
